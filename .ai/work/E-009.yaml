question: >
  E-008 proved at L2 that the MINIMUM edit in packages/barocss/src/presets/effects.ts closes the ring box-shadow
  parity family (K10, K11): registering --baro-shadow/--baro-inset-shadow/--baro-inset-ring-shadow via @property

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Native Boolean extrusion display GLB in Three.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; border: 1px solid #44617d; }
  button { margin: 12px 8px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Native filled Shell and true Curve display GLB · Three.js</h1>
  <p>Saved GLB files load through the standard GLTFLoader. Native CAD remains separate.</p>
  <div id="view"></div>
  <button id="edges" type="button">Show sampled true edges</button>
  <button id="reject" type="button">Try invalid exports</button>
  <button id="dispose" type="button">Remove imported display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { AmbientLight, Group, OrthographicCamera, Scene, Vector3, WebGLRenderer } from 'three';
  import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
  import { validateCoplanarFaceBooleanExtrusionMesh } from '@barocss/cad';
  import { exportBaroCadBooleanExtrusionDisplayGlb } from '@barocss/cad-interop/boolean-extrusion-glb';

  const status = document.querySelector('#status');
  const renderer = new WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setSize(800, 600);
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x101b2c);
  document.querySelector('#view').append(renderer.domElement);
  const canvas = renderer.domElement;
  const scene = new Scene();
  scene.add(new AmbientLight(0xffffff, 2));
  const caller = new Group(); caller.name = 'caller-owned'; scene.add(caller);
  const camera = new OrthographicCamera(-0.012, 0.012, 0.009, -0.009, 0.001, 1);
  camera.up.set(0, 0, -1);
  camera.position.set(-0.0025, 0.05, -0.0013);
  camera.lookAt(-0.0025, -0.004, -0.0013);
  const wallCamera = new OrthographicCamera(-0.015, 0.015, 0.01125, -0.01125, 0.001, 1);
  wallCamera.position.set(0.028, 0.02, 0.028);
  wallCamera.lookAt(-0.0025, -0.004, -0.0013);
  const options = { unitsPerMillimeter: 0.001, basis: 'authored-xyz-matches-rhyup' };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const background = (r, g, b) => Math.abs(r - 16) <= 12 && Math.abs(g - 27) <= 12 && Math.abs(b - 44) <= 12;
  const render = (view = camera) => {
    renderer.render(scene, view);
    const gl = renderer.getContext();
    const bytes = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('Three GLB WebGL readPixels failed');
    return bytes;
  };
  const count = bytes => {
    let total = 0;
    for (let i = 0; i < bytes.length; i += 4) {
      if (!background(bytes[i], bytes[i + 1], bytes[i + 2])) total++;
    }
    return total;
  };
  const sample = (bytes, pointMM) => {
    const point = new Vector3(...pointMM.map(value => value * 0.001)).project(camera);
    const x = Math.round((point.x + 1) * canvas.width / 2);
    const y = Math.round((point.y + 1) * canvas.height / 2);
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) throw new Error('CAD probe outside camera');
    const offset = (y * canvas.width + x) * 4;
    return { x, y, rgb: [...bytes.slice(offset, offset + 3)],
      background: background(bytes[offset], bytes[offset + 1], bytes[offset + 2]) };
  };
  const native = async name => {
    const response = await fetch(new URL(`./boolean-extrusion-glb-data/${name}.owned-extrusion-mesh.json`, location.href));
    if (!response.ok) throw new Error(`Native fixture HTTP ${response.status}: ${name}`);
    const result = await response.json();
    validateCoplanarFaceBooleanExtrusionMesh(result);
    return result;
  };
  const load = async name => {
    const url = new URL(`./boolean-extrusion-glb-data/${name}.display.glb`, location.href).href;
    const imported = await new GLTFLoader().loadAsync(url);
    const meshes = [], lines = [];
    imported.scene.traverse(object => {
      if (object.isMesh) meshes.push(object);
      if (object.isLine) { lines.push(object); object.visible = false; }
    });
    return { imported, meshes, lines, url };
  };
  const release = candidate => {
    candidate.imported.scene.removeFromParent();
    candidate.imported.scene.traverse(object => {
      if (object.isMesh || object.isLine) {
        object.geometry.dispose();
        if (Array.isArray(object.material)) object.material.forEach(material => material.dispose());
        else object.material.dispose();
      }
    });
  };
  let accepted, display, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  try {
    const cases = [
      ['containment_hole', 1, 24, 32],
      ['strip_two_components', 2, 24, 24],
      ['reverse_containment_empty', 0, 0, 0],
      ['cross_union', 1, 24, 28],
      ['cross_union_distance_edit', 1, 24, 28],
    ];
    const observations = [];
    for (const [name, shellCount, edgeCount, triangleCount] of cases) {
      const candidate = await load(name);
      scene.add(candidate.imported.scene);
      if (candidate.meshes.length !== shellCount || candidate.lines.length !== edgeCount ||
          candidate.meshes.reduce((sum, object) => sum + object.geometry.index.count / 3, 0) !== triangleCount ||
          candidate.meshes.some(object => object.geometry.getAttribute('uv') !== undefined) ||
          candidate.meshes.some(object => object.userData.barocss.kind !== 'native-boolean-extrusion-shell-display') ||
          candidate.lines.some(object => object.userData.barocss.kind !== 'native-true-curve-sample-display')) {
        throw new Error(`Imported Shell GLB differs: ${name}`);
      }
      const pixels = render();
      const isolated = [];
      if (name === 'strip_two_components') {
        for (const object of candidate.meshes) {
          for (const other of candidate.meshes) other.visible = other === object;
          isolated.push({ shellId: object.userData.barocss.shellId, pixels: count(render()) });
        }
        for (const object of candidate.meshes) object.visible = true;
      }
      let holeProbe = null, materialProbe = null, wallOnlyPixels = null;
      if (name === 'containment_hole') {
        const result = await native(name);
        const hole = result.extrusion.region.loops.find(loop => loop.role === 'hole');
        const average = hole.vertexIds.map(id => result.extrusion.region.vertices.find(vertex => vertex.id === id).pointMM)
          .reduce((sum, point, _, points) => sum.map((value, axis) => value + point[axis] / points.length), [0, 0, 0]);
        holeProbe = sample(pixels, average);
        const top = result.faceRanges.find(face => face.kind === 'top-cap');
        const vertices = top.triangles[0].vertexIndices.map(index => result.mesh.positionsMM.slice(3 * index, 3 * index + 3));
        materialProbe = sample(pixels, [0, 1, 2].map(axis =>
          vertices.reduce((sum, vertex) => sum + vertex[axis] / 3, 0)));
        if (!holeProbe.background || materialProbe.background) throw new Error('Saved GLB hole or material differs');
        const mesh = candidate.meshes[0];
        const faces = mesh.userData.barocss.faces;
        const wallStart = faces.filter(face => face.kind !== 'wall').reduce((sum, face) => sum + face.indexCount, 0);
        const wallCount = faces.filter(face => face.kind === 'wall').reduce((sum, face) => sum + face.indexCount, 0);
        mesh.geometry.setDrawRange(wallStart, wallCount);
        wallOnlyPixels = count(render(wallCamera));
        mesh.geometry.setDrawRange(0, Infinity);
        if (wallOnlyPixels < 100) throw new Error('Saved GLB walls were not visible');
      }
      if ((triangleCount === 0 ? count(pixels) !== 0 : count(pixels) < 100) ||
          isolated.some(entry => entry.pixels < 30)) throw new Error(`Shell GLB pixels differ: ${name}`);
      observations.push({ name, url: candidate.url, shellCount, edgeCount, triangleCount,
        visiblePixels: count(pixels), isolated, holeProbe, materialProbe, wallOnlyPixels, hash: hash(pixels) });
      release(candidate);
    }
    if (observations[3].hash === observations[4].hash) throw new Error('Saved distance edit did not change GLB frame');
    accepted = await native('containment_hole');
    display = await load('containment_hole');
    scene.add(display.imported.scene);
    const acceptedFrame = render();
    if (hash(acceptedFrame) !== observations[0].hash ||
        !(renderer.getContext() instanceof WebGL2RenderingContext)) throw new Error('Accepted Shell GLB frame differs');
    evidence = { fixtures: observations, acceptedHash: hash(acceptedFrame), webgl2: true,
      callerRetained: scene.children.includes(caller), trueEdgesVisible: false, refused: 0, disposed: false };
    window.__baroBooleanExtrusionGlbEvidence = evidence; show();
    document.querySelector('#edges').onclick = () => {
      const before = hash(render());
      for (const object of display.lines) object.visible = true;
      const after = hash(render());
      if (after === before) throw new Error('Saved true Curve lines did not change the frame');
      evidence.trueEdgesVisible = true; evidence.trueEdgesFrameHash = after; show();
    };
    document.querySelector('#reject').onclick = () => {
      const before = hash(render());
      const forged = structuredClone(accepted); forged.mesh.positionsMM[0] += 1;
      const getter = { ...options }; let getterCalls = 0;
      Object.defineProperty(getter, 'basis', { enumerable: true, get() { getterCalls++; return options.basis; } });
      let refused = 0;
      for (const action of [
        () => exportBaroCadBooleanExtrusionDisplayGlb(forged, options),
        () => exportBaroCadBooleanExtrusionDisplayGlb(accepted, { ...options, basis: 'unknown' }),
        () => exportBaroCadBooleanExtrusionDisplayGlb(accepted, { ...options, unitsPerMillimeter: 1 }),
        () => exportBaroCadBooleanExtrusionDisplayGlb(accepted, getter),
      ]) { try { action(); } catch { refused++; } }
      if (refused !== 4 || getterCalls !== 0 || hash(render()) !== before ||
          !scene.children.includes(caller) || display.meshes.some(object => !object.parent)) {
        throw new Error('Rejected Shell GLB changed accepted display');
      }
      evidence.refused = refused; evidence.acceptedFrameRetained = true; show();
    };
    document.querySelector('#dispose').onclick = () => {
      release(display);
      if (count(render()) !== 0 || !scene.children.includes(caller) ||
          renderer.getContext() === null || document.querySelectorAll('canvas').length !== 1) {
        throw new Error('Imported Shell GLB cleanup changed caller resources');
      }
      evidence.disposed = true; evidence.afterDisposePixels = 0; evidence.callerRetained = true; show();
    };
  } catch (error) {
    if (display) release(display);
    evidence = { error: String(error), stack: error.stack };
    window.__baroBooleanExtrusionGlbEvidence = evidence; show();
  }
</script>

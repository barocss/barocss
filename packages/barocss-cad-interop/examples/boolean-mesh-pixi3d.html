<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Native filled CAD Boolean mesh in Pixi3D</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; border: 1px solid #44617d; }
  button { margin: 12px 8px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Native filled CAD Boolean mesh · Pixi3D</h1>
  <p>Native triangles fill the material; the hole and separated components remain distinct.</p>
  <div id="view"></div>
  <button id="reject" type="button">Try invalid candidates</button>
  <button id="dispose" type="button">Dispose display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Application, Graphics } from 'pixi.js';
  import { Camera, Container3D, Mesh3D, MeshGeometry3D, Point3D, StandardMaterial } from 'pixi3d/pixi7';
  import { validateCoplanarFaceBooleanMesh } from '@barocss/cad';
  import { createBaroCadBooleanPixi3DMesh } from '@barocss/cad-interop/pixi3d-boolean-mesh';

  const status = document.querySelector('#status');
  const app = new Application({ width: 800, height: 520, background: '#101b2c',
    antialias: false, preserveDrawingBuffer: true });
  const canvas = app.view;
  document.querySelector('#view').append(canvas);
  const caller = new Graphics().beginFill(0xffffff).drawCircle(22, 22, 6).endFill();
  app.stage.addChild(caller);
  const camera = Camera.main ?? new Camera(app.renderer);
  camera.orthographic = true;
  camera.orthographicSize = 0.078;
  camera.position.set(0.8, 0.3, -0.8);
  camera.transform.updateTransform();
  camera.transform.lookAt(new Point3D(-0.02, -0.035, -0.02));
  camera.near = 0.001; camera.far = 3;
  const options = { unitsPerMillimeter: 0.01, basis: 'authored-xyz-matches-rhyup' };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const background = (r, g, b) => Math.abs(r - 16) <= 12 && Math.abs(g - 27) <= 12 && Math.abs(b - 44) <= 12;
  const render = () => {
    app.renderer.render(app.stage);
    const gl = app.renderer.gl;
    const bytes = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('Pixi WebGL readPixels failed');
    return bytes;
  };
  const colored = bytes => {
    let count = 0;
    for (let i = 0; i < bytes.length; i += 4) {
      if (!background(bytes[i], bytes[i + 1], bytes[i + 2])) count++;
    }
    return count;
  };
  const pixelAt = (bytes, pointMM) => {
    const projected = camera.worldToScreen(...pointMM.map(value => value * options.unitsPerMillimeter));
    const x = Math.round(projected.x);
    const y = canvas.height - 1 - Math.round(projected.y);
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
      throw new Error('Native material probe lies outside Pixi camera');
    }
    const offset = (y * canvas.width + x) * 4;
    return { x, y, rgb: [...bytes.slice(offset, offset + 3)],
      background: background(bytes[offset], bytes[offset + 1], bytes[offset + 2]) };
  };
  const load = async name => {
    const url = new URL(`./boolean-mesh-three-data/${name}.owned-mesh.json`, location.href);
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${name}`);
    const result = await response.json();
    validateCoplanarFaceBooleanMesh(result);
    return result;
  };
  const verifyBuffers = (display, result) => {
    for (const binding of display.bindings) {
      if (!(binding.object instanceof Mesh3D) || binding.object.parent !== display.root ||
          binding.meshId !== result.mesh.id ||
          binding.evaluationId !== result.mesh.binding.evaluationId ||
          binding.supportId !== result.mesh.binding.supportId ||
          JSON.stringify(binding.sourceAssetIds) !== JSON.stringify(result.mesh.binding.sourceAssetIds) ||
          JSON.stringify(binding.operands) !== JSON.stringify({ a: result.mesh.binding.a, b: result.mesh.binding.b }) ||
          binding.object.geometry.uvs !== undefined) {
        throw new Error('Pixi mesh binding differs from native identity or misuses texture UV');
      }
      const component = result.triangulation.components.find(value => value.componentId === binding.componentId);
      const expectedIndices = component.triangleIds.flatMap(id =>
        result.triangulation.triangles.find(triangle => triangle.id === id).vertexIndices);
      const geometry = binding.object.geometry;
      if (JSON.stringify([...geometry.indices.buffer]) !== JSON.stringify(expectedIndices) ||
          JSON.stringify(binding.triangleIds) !== JSON.stringify(component.triangleIds) ||
          JSON.stringify(binding.holeLoopIds) !== JSON.stringify(component.holeLoopIds) ||
          JSON.stringify(binding.vertexIndices) !== JSON.stringify(component.vertexIndices) ||
          JSON.stringify(binding.boundaryPathIds) !== JSON.stringify(result.boundaryPaths.filter(path =>
            path.componentId === component.componentId).map(path => path.fragmentId))) {
        throw new Error('Pixi native triangle or component provenance differs');
      }
      for (let i = 0; i < result.mesh.positionsMM.length; i++) {
        if (!Object.is(geometry.positions.buffer[i], Math.fround(result.mesh.positionsMM[i] * options.unitsPerMillimeter)) ||
            !Object.is(geometry.normals.buffer[i], Math.fround(result.mesh.normals[i]))) {
          throw new Error('Pixi vertex position or normal differs from native Float32 conversion');
        }
      }
      for (let i = 0; i < result.mesh.parametersUV.length; i++) {
        if (!Object.is(binding.cadParametersUV[i], Math.fround(result.mesh.parametersUV[i]))) {
          throw new Error('Pixi CAD parameter differs from native Float32 conversion');
        }
      }
    }
  };
  const callerFrame = render();
  const callerPixels = colored(callerFrame);
  let accepted, display, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  try {
    const fixtures = [
      ['containment_hole', 1, 8, 8],
      ['strip_two_components', 2, 4, 8],
      ['reverse_containment_empty', 0, 0, 0],
    ];
    const observations = [];
    const originals = {};
    for (const [name, components, triangles, boundaries] of fixtures) {
      const result = await load(name);
      originals[name] = result;
      const candidate = createBaroCadBooleanPixi3DMesh(result, options);
      verifyBuffers(candidate, result);
      app.stage.addChild(candidate.root);
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      if (candidate.bindings.length !== components || candidate.root.children.length !== components ||
          candidate.boundaryPaths.length !== boundaries ||
          candidate.bindings.reduce((sum, binding) => sum + binding.triangleIds.length, 0) !== triangles) {
        throw new Error(`Native Boolean mesh grouping differs: ${name}`);
      }
      const pixels = render();
      const isolated = [];
      if (name === 'strip_two_components') {
        for (const binding of candidate.bindings) {
          for (const other of candidate.bindings) other.object.visible = other === binding;
          isolated.push({ id: binding.componentId, displayPixels: colored(render()) - callerPixels });
        }
        for (const binding of candidate.bindings) binding.object.visible = true;
      }
      let holeProbe = null, materialProbe = null;
      if (name === 'containment_hole') {
        const hole = result.region.loops.find(loop => loop.role === 'hole');
        const outer = result.region.loops.find(loop => loop.role === 'outer');
        const average = loop => loop.vertexIds.map(id => result.region.vertices.find(vertex => vertex.id === id).pointMM)
          .reduce((sum, point, _, points) => sum.map((value, axis) => value + point[axis] / points.length), [0, 0, 0]);
        holeProbe = pixelAt(pixels, average(hole));
        const corner = result.region.vertices.find(vertex => vertex.id === outer.vertexIds[0]).pointMM;
        const center = average(hole);
        materialProbe = pixelAt(pixels, corner.map((value, axis) => value * 0.75 + center[axis] * 0.25));
        if (!holeProbe.background || materialProbe.background) {
          throw new Error('Pixi filled mesh drew inside native hole or missed material');
        }
      }
      if ((triangles === 0 ? colored(pixels) !== callerPixels : colored(pixels) - callerPixels < 100) ||
          isolated.some(entry => entry.displayPixels < 30)) {
        throw new Error(`Pixi filled mesh pixels differ: ${name}`);
      }
      observations.push({ name, components, triangles, boundaries,
        displayPixels: colored(pixels) - callerPixels, isolated, holeProbe, materialProbe, hash: hash(render()) });
      candidate.dispose();
    }
    accepted = originals.containment_hole;
    display = createBaroCadBooleanPixi3DMesh(accepted, options);
    app.stage.addChild(display.root);
    await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
    const acceptedFrame = render();
    if (hash(acceptedFrame) !== observations[0].hash ||
        !(app.renderer.gl instanceof WebGL2RenderingContext)) {
      throw new Error('Accepted Pixi Boolean filled frame differs');
    }
    evidence = { fixtures: observations, callerPixels, acceptedHash: hash(acceptedFrame),
      webgl2: true, callerRetained: app.stage.children.includes(caller), refused: 0, disposed: false };
    window.__baroBooleanMeshPixiEvidence = evidence;
    show();
    document.querySelector('#reject').onclick = () => {
      const before = hash(render());
      const forged = structuredClone(accepted); forged.mesh.positionsMM[0] += 1;
      const getter = { ...options }; let getterCalls = 0;
      Object.defineProperty(getter, 'basis', { enumerable: true,
        get() { getterCalls++; return options.basis; } });
      let refused = 0;
      for (const action of [
        () => createBaroCadBooleanPixi3DMesh(forged, options),
        () => createBaroCadBooleanPixi3DMesh(accepted, { ...options, basis: 'unknown' }),
        () => createBaroCadBooleanPixi3DMesh(accepted, { ...options, unitsPerMillimeter: 0 }),
        () => createBaroCadBooleanPixi3DMesh(accepted, getter),
      ]) { try { action(); } catch { refused++; } }
      const originalAddChild = Container3D.prototype.addChild;
      const originalGeometryDestroy = MeshGeometry3D.prototype.destroy;
      const originalMaterialDestroy = StandardMaterial.prototype.destroy;
      let calls = 0, geometriesDisposed = 0, materialsDisposed = 0;
      try {
        Container3D.prototype.addChild = function (...children) {
          if (children[0] instanceof Mesh3D && ++calls === 2) {
            throw new Error('injected later-component attachment failure');
          }
          return originalAddChild.apply(this, children);
        };
        MeshGeometry3D.prototype.destroy = function (...args) {
          geometriesDisposed++; return originalGeometryDestroy.apply(this, args);
        };
        StandardMaterial.prototype.destroy = function (...args) {
          materialsDisposed++; return originalMaterialDestroy.apply(this, args);
        };
        try { createBaroCadBooleanPixi3DMesh(originals.strip_two_components, options); }
        catch { refused++; }
      } finally {
        Container3D.prototype.addChild = originalAddChild;
        MeshGeometry3D.prototype.destroy = originalGeometryDestroy;
        StandardMaterial.prototype.destroy = originalMaterialDestroy;
      }
      if (refused !== 5 || getterCalls !== 0 || calls !== 2 ||
          geometriesDisposed !== 2 || materialsDisposed !== 2 ||
          hash(render()) !== before || display.bindings.some(binding => binding.object.destroyed) ||
          !app.stage.children.includes(caller)) {
        throw new Error('Rejected Pixi Boolean mesh changed accepted frame or leaked resources');
      }
      evidence.refused = refused; evidence.stagedGeometriesDisposed = geometriesDisposed;
      evidence.stagedMaterialsDisposed = materialsDisposed;
      evidence.acceptedFrameRetained = true; show();
    };
    document.querySelector('#dispose').onclick = () => {
      const owned = display.bindings.map(binding => binding.object);
      display.dispose(); display.dispose();
      const after = render();
      if (owned.some(mesh => !mesh.destroyed) || !display.root.destroyed ||
          app.stage.children.includes(display.root) || !app.stage.children.includes(caller) ||
          hash(after) !== hash(callerFrame) || app.renderer.gl === null ||
          document.querySelectorAll('canvas').length !== 1) {
        throw new Error('Pixi Boolean mesh disposal changed caller resources');
      }
      evidence.disposed = true; evidence.afterDisposePixels = colored(after);
      evidence.callerFrameRetained = true; show();
    };
  } catch (error) {
    display?.dispose();
    evidence = { error: String(error), stack: error.stack };
    window.__baroBooleanMeshPixiEvidence = evidence;
    show();
  }
</script>

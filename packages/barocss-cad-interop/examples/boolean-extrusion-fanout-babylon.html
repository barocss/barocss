<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Authored CAD fan-out in Babylon.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; width: 800px; height: 600px; border: 1px solid #44617d; }
  button { margin: 10px 7px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Separate CAD extrusion leaves in Babylon.js</h1>
  <p>Select one exact feature and output slot. The authored graph stays available for edits.</p>
  <canvas id="view" width="800" height="600"></canvas>
  <div id="cases"></div>
  <button id="edges" type="button">Show true edges</button>
  <button id="reject" type="button">Try invalid selection</button>
  <button id="dispose" type="button">Dispose display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Engine } from '@babylonjs/core/Engines/engine.js';
  import { Scene } from '@babylonjs/core/scene.js';
  import { Camera } from '@babylonjs/core/Cameras/camera.js';
  import { FreeCamera } from '@babylonjs/core/Cameras/freeCamera.js';
  import { Mesh } from '@babylonjs/core/Meshes/mesh.js';
  import { Color4 } from '@babylonjs/core/Maths/math.color.js';
  import { Vector3 } from '@babylonjs/core/Maths/math.vector.js';
  import { loadBaroCadBooleanExtrusionFeatureGraph } from '@barocss/cad-interop/boolean-extrusion-feature-graph';
  import { deriveBaroCadBooleanExtrusionFeatureMesh } from '@barocss/cad-interop/boolean-extrusion-feature-mesh';
  import { createBaroCadBooleanExtrusionBabylonMesh } from '@barocss/cad-interop/babylon-boolean-extrusion-mesh';

  const canvas = document.querySelector('#view');
  const status = document.querySelector('#status');
  const engine = new Engine(canvas, false, { preserveDrawingBuffer: true, stencil: true });
  const scene = new Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = new Color4(16 / 255, 27 / 255, 44 / 255, 1);
  const caller = new Mesh('caller-owned', scene);
  const camera = new FreeCamera('camera', new Vector3(0.04, 0.025, -0.04), scene);
  camera.setTarget(new Vector3(-0.003, -0.004, -0.001));
  camera.mode = Camera.ORTHOGRAPHIC_CAMERA;
  camera.orthoLeft = -0.016; camera.orthoRight = 0.016;
  camera.orthoTop = 0.012; camera.orthoBottom = -0.012;
  camera.minZ = 0.001; camera.maxZ = 1;
  scene.activeCamera = camera;
  const graphOptions = { maximumParameterResolutions: 8, maximumFeatureEvaluations: 6 };
  const meshOptions = { meshId: 'shell_mesh', maximumVertices: 384, maximumTriangles: 288,
    maximumEdgePaths: 192, maximumNativeSamples: 1024 };
  const displayOptions = { unitsPerMillimeter: 0.001, basis: 'authored-xyz-matches-rhyup' };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const background = (r, g, b) => Math.abs(r - 16) <= 12 && Math.abs(g - 27) <= 12 && Math.abs(b - 44) <= 12;
  const frame = () => {
    scene.render();
    const gl = canvas.getContext('webgl2');
    const bytes = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('Babylon WebGL readPixels failed');
    let pixels = 0;
    for (let i = 0; i < bytes.length; i += 4) if (!background(bytes[i], bytes[i + 1], bytes[i + 2])) pixels++;
    return { hash: hash(bytes), pixels };
  };
  const ready = async () => {
    engine.runRenderLoop(() => scene.render());
    await scene.whenReadyAsync();
    engine.stopRenderLoop();
  };
  let shown, accepted, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  const release = () => {
    if (!shown) return 0;
    const disposed = [];
    for (const face of shown.faces) {
      face.object.onDisposeObservable.add(() => disposed.push('face'));
      face.object.material.onDisposeObservable.add(() => disposed.push('material'));
    }
    for (const edge of shown.edges) edge.object.onDisposeObservable.add(() => disposed.push('edge'));
    shown.dispose(); shown.dispose();
    if (disposed.length !== 2 * shown.faces.length + shown.edges.length ||
        !shown.root.isDisposed() || !shown.edgeRoot.isDisposed()) {
      throw new Error('Babylon display resources were not disposed once');
    }
    shown = undefined;
    return disposed.length;
  };
  const select = (read, leaf) => {
    const selection = { graphId: read.native.document.id, revision: read.native.document.revision,
      featureId: leaf.featureId, outputSlotId: leaf.outputSlotId };
    const derived = deriveBaroCadBooleanExtrusionFeatureMesh(read.native, selection, meshOptions);
    if (derived.binding.featureId !== leaf.featureId || derived.binding.outputSlotId !== leaf.outputSlotId ||
        derived.nativeMesh.report.extrusionEvaluationId !== leaf.evaluation.options.evaluationId) {
      throw new Error('Selected output does not match the exact native leaf');
    }
    return { read, selection, derived };
  };
  const display = async item => {
    const disposed = release();
    accepted = item;
    shown = createBaroCadBooleanExtrusionBabylonMesh(scene, item.derived.nativeMesh, displayOptions);
    if (shown.faces.length !== item.derived.nativeMesh.report.faceRangeCount ||
        shown.edges.length !== item.derived.nativeMesh.report.edgePathCount ||
        shown.edgeRoot.isEnabled()) throw new Error('Babylon Shell grouping differs');
    await ready();
    const observation = frame();
    if (item.derived.nativeMesh.report.empty ? observation.pixels !== 0 : observation.pixels < 100) {
      throw new Error('Selected Shell pixels differ from native empty state');
    }
    evidence.selected = { revision: item.selection.revision, featureId: item.selection.featureId,
      outputSlotId: item.selection.outputSlotId, evaluationId: item.derived.nativeMesh.report.extrusionEvaluationId,
      distanceMM: item.read.native.report.summary.extrusions.find(row => row.featureId === item.selection.featureId).distanceMM,
      faces: shown.faces.length, edges: shown.edges.length, ...observation };
    evidence.ownedResourcesDisposed += disposed;
    evidence.trueEdgesVisible = false;
    show();
    return observation;
  };
  try {
    const names = ['three_shared_region_leaves', 'shared_height_parameter_edit', 'three_genuine_empty_leaves'];
    const graphs = new Map();
    for (const name of names) {
      const url = new URL(`./boolean-extrusion-fanout-three-data/${name}.authored-graph.json`, location.href);
      const read = await loadBaroCadBooleanExtrusionFeatureGraph(url.href, graphOptions);
      if (read.native.report.summary.extrusions.length !== 3) throw new Error('Expected three separate leaves');
      graphs.set(name, read);
    }
    evidence = { webgl2: canvas.getContext('webgl2') instanceof WebGL2RenderingContext,
      observations: [], selected: null, refused: 0, trueEdgesVisible: false,
      ownedResourcesDisposed: 0, callerRetained: true };
    if (!evidence.webgl2) throw new Error('WebGL2 required');
    for (const name of names) {
      const read = graphs.get(name);
      for (const leaf of read.native.features.filter(row => row.kind === 'normal-extrusion')) {
        const item = select(read, leaf);
        const observation = await display(item);
        evidence.observations.push({ name, featureId: leaf.featureId, revision: item.selection.revision,
          distanceMM: evidence.selected.distanceMM, empty: item.derived.nativeMesh.report.empty, ...observation });
        const button = document.createElement('button');
        button.type = 'button';
        button.textContent = `${name}: ${leaf.featureId}`;
        button.onclick = async () => { try { await display(item); } catch (error) { evidence.error = String(error); show(); } };
        document.querySelector('#cases').append(button);
      }
    }
    const first = evidence.observations.filter(row => row.name === names[0]);
    const edited = evidence.observations.filter(row => row.name === names[1]);
    const empty = evidence.observations.filter(row => row.name === names[2]);
    if (new Set(first.map(row => row.hash)).size !== 3 ||
        first.some((row, i) => row.hash === edited[i].hash) ||
        edited.some(row => row.pixels < 100) || empty.some(row => row.pixels !== 0)) {
      throw new Error('Sibling heights, edited graph or empty results did not change real pixels');
    }
    await display(select(graphs.get(names[0]), graphs.get(names[0]).native.features.find(row => row.featureId === 'leaf_middle')));
    evidence.firstSiblingHashesDiffer = true; evidence.editedHashesDiffer = true;
    window.__baroFanoutBabylonEvidence = evidence; show();
    document.querySelector('#edges').onclick = () => {
      if (!shown) return;
      if (shown.edges.length === 0) { evidence.emptyEdgePaths = true; show(); return; }
      const before = frame().hash;
      shown.edgeRoot.setEnabled(true);
      const after = frame().hash;
      if (after === before || shown.edges.length !== accepted.derived.nativeMesh.report.edgePathCount) {
        throw new Error('True native Curve paths did not change the frame');
      }
      evidence.trueEdgesVisible = true; evidence.trueEdgesHash = after; show();
    };
    document.querySelector('#reject').onclick = () => {
      if (!shown) return;
      const before = frame().hash;
      const wrong = structuredClone(accepted.read.native);
      wrong.report.qualifiedBindings.find(row => row.nativeReferences.length).nativeReferences[0].nativeId = 'forged';
      const wrongFeatureId = accepted.selection.featureId === 'leaf_low' ? 'leaf_middle' : 'leaf_low';
      const wrongSlotId = accepted.selection.outputSlotId === 'leaf_slot_0' ? 'leaf_slot_1' : 'leaf_slot_0';
      let refused = 0;
      for (const action of [
        () => deriveBaroCadBooleanExtrusionFeatureMesh(accepted.read.native,
          { ...accepted.selection, revision: accepted.selection.revision + 1 }, meshOptions),
        () => deriveBaroCadBooleanExtrusionFeatureMesh(accepted.read.native,
          { ...accepted.selection, featureId: wrongFeatureId }, meshOptions),
        () => deriveBaroCadBooleanExtrusionFeatureMesh(accepted.read.native,
          { ...accepted.selection, outputSlotId: wrongSlotId }, meshOptions),
        () => deriveBaroCadBooleanExtrusionFeatureMesh(wrong, accepted.selection, meshOptions),
      ]) { try { action(); } catch { refused++; } }
      if (refused !== 4 || frame().hash !== before || caller.isDisposed() ||
          shown.faces.some(row => row.object.isDisposed())) throw new Error('Refusal changed accepted display');
      evidence.refused += refused; evidence.acceptedFrameRetained = true; show();
    };
    document.querySelector('#dispose').onclick = () => {
      evidence.ownedResourcesDisposed += release();
      if (frame().pixels !== 0 || caller.isDisposed() || !scene.meshes.includes(caller) ||
          engine.getRenderingCanvas() !== canvas || document.querySelectorAll('canvas').length !== 1) {
        throw new Error('Caller Scene, Engine or canvas changed');
      }
      evidence.disposed = true; evidence.callerRetained = true; show();
    };
  } catch (error) {
    shown?.dispose();
    evidence = { error: String(error), stack: error.stack };
    window.__baroFanoutBabylonEvidence = evidence; show();
  }
</script>

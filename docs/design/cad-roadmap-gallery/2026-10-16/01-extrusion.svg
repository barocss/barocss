<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">스케치에서 입체로 · Extrude</title><desc id="desc">평면 도형을 높이 방향으로 밀어 부품의 첫 몸체를 만듭니다. Conceptual CAD target design, not implementation evidence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#167d97" stroke-width="1.5"/></marker></defs><rect width="1440" height="900" fill="#f5f7fa"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="40" y="44" font-size="16" fill="#576b80" font-weight="700">BAROCSS / CAD ROADMAP VISUAL STUDY 01</text><text x="40" y="93" font-size="34" fill="#16283b" font-weight="700">스케치에서 입체로 · Extrude</text><text x="40" y="130" font-size="19" fill="#526779" font-weight="400">평면 도형을 높이 방향으로 밀어 부품의 첫 몸체를 만듭니다.</text><rect x="40" y="154" width="1360" height="39" rx="8" fill="#fff0ce"/><text x="58" y="180" font-size="17" fill="#78531a" font-weight="700">TARGET DESIGN / NOT IMPLEMENTATION EVIDENCE · 목표 디자인 · 실제 실행 화면 아님</text><rect x="40" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="62" y="256" font-size="17" fill="#50677d" font-weight="700">01  입력 형상 / INPUT</text><g transform="translate(40,0)"><polygon transform="translate(0,-45)" points="150,430 342,502 246,566 54,494" fill="#dff3f2" stroke="#168c87" stroke-width="2" stroke-linejoin="round" /><text x="165" y="459" font-size="18" fill="#126f6d" font-weight="700">Sketch 01</text><text x="140" y="592" font-size="17" fill="#263445" font-weight="400">48 × 32 mm · 닫힌 프로파일</text></g><rect x="500" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="522" y="256" font-size="17" fill="#50677d" font-weight="700">02  조작 / OPERATION</text><g transform="translate(500,0)"><polygon transform="translate(0,-45)" points="150,354 342,426 342,522 150,450" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="54,418 246,490 342,426 150,354" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="342,522 246,586 246,490 342,426" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><line transform="translate(0,-45)" x1="140" y1="430" x2="140" y2="325" stroke="#168c87" stroke-width="2" /><path transform="translate(0,-45)" d="M140 430 L140 310" stroke="#168c87" stroke-width="3" marker-end="url(#arrow)"/><text x="165" y="329" font-size="18" fill="#168c87" font-weight="700">+Z 24 mm</text><text x="57" y="592" font-size="17" fill="#263445" font-weight="400">평면 선택 → 높이 입력 → Preview</text></g><rect x="960" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="982" y="256" font-size="17" fill="#50677d" font-weight="700">03  목표 결과 / RESULT</text><g transform="translate(960,0)"><polygon transform="translate(0,-45)" points="150,354 342,426 342,522 150,450" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="54,418 246,490 342,426 150,354" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="342,522 246,586 246,490 342,426" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><text x="128" y="562" font-size="19" fill="#244b66" font-weight="700">Body 01 · 단일 솔리드</text><text x="58" y="597" font-size="17" fill="#263445" font-weight="400">원본 스케치와 높이를 다시 편집</text></g><rect x="40" y="658" width="1360" height="156" rx="14" fill="#e9eff5"/><text x="62" y="690" font-size="17" fill="#34516b" font-weight="700">선택 · 입력값 · 동작 설계 / COMMAND CONTEXT</text><text x="62" y="724" font-size="18" fill="#263445" font-weight="400">선택: Sketch 01   |   너비 48 mm · 깊이 32 mm · 높이 24 mm · 방향 +Z</text><text x="62" y="753" font-size="18" fill="#263445" font-weight="400">Preview는 임시 결과. Apply로 확정하고 Cancel은 원래 스케치/승인 상태를 유지합니다.</text><text x="62" y="782" font-size="18" fill="#263445" font-weight="400">로드맵: PART-02 / CE-P01 · 일반 프로파일/캡/유효성 지원은 개별 계약이 필요합니다.</text><text x="40" y="849" font-size="16" fill="#526779" font-weight="400">근거: #534 PART-02 · #1029 · CAD Editor Product Roadmap CE-P01</text><text x="40" y="877" font-size="15" fill="#6b7c8d" font-weight="400">도해는 수동 설계한 예시입니다. 형상 비례·치수는 제안이며 API 지원 범위나 검증 결과가 아닙니다.</text></g></svg>
<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Canvas2D bounded scale corpus</title>
<style>
  body { margin: 20px; font: 14px system-ui; color: #17233c; background: #f5f7fb; }
  button { padding: 7px 10px; margin: 0 8px 8px 0; }
  canvas { width: 800px; height: 480px; display: block; background: #dce5f0; }
  pre { max-width: 800px; white-space: pre-wrap; overflow-wrap: anywhere; background: white; padding: 12px; }
</style>
<h1>Canvas2D bounded scale corpus</h1>
<button id="run">Run fixed measurement</button><button id="save">Save metrics JSON</button>
<p id="status" role="status">Loading</p><canvas></canvas><pre id="metrics"></pre>
<script type="module">
  import { createCanvas2D } from '../../packages/barocss-canvas2d/dist/index.js';
  import { SceneHistory } from './scene-history.mjs';
  import { corpusScene, corpusAssets, corpusSize, missPoint, visiblePoint } from './perf-corpus-v4.mjs';

  const canvas = document.querySelector('canvas');
  const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true,
    antialias: false, preserveDrawingBuffer: true, stencil: true });
  const counts = { texImage2D: 0, textureBytes: 0, createTexture: 0, deleteTexture: 0,
    bufferData: 0, bufferBytes: 0, createBuffer: 0, deleteBuffer: 0 };
  for (const name of ['texImage2D', 'createTexture', 'deleteTexture', 'bufferData', 'createBuffer', 'deleteBuffer']) {
    const original = gl[name].bind(gl);
    gl[name] = (...args) => {
      counts[name]++;
      if (name === 'texImage2D') counts.textureBytes += args.at(-1)?.byteLength ?? 0;
      if (name === 'bufferData') counts.bufferBytes += args[1]?.byteLength ?? 0;
      return original(...args);
    };
  }
  const options = { logicalSize: corpusSize, dpr: 2 };
  const renderer = createCanvas2D(canvas, options);
  for (const [id, asset] of corpusAssets) renderer.setImageAsset(id, asset);
  let history = new SceneHistory(renderer, corpusScene, 50);
  const afterSetup = { ...counts };
  const status = document.querySelector('#status');
  const out = document.querySelector('#metrics');
  status.textContent = 'Ready · 8 clipped frames · 24 paths · 8 images · 8 glyph runs';
  let last = null;

  function percentile(values, fraction) {
    const sorted = [...values].sort((a, b) => a - b);
    return sorted[Math.min(sorted.length - 1, Math.ceil(sorted.length * fraction) - 1)];
  }
  function distribution(values) {
    return { n: values.length, medianMs: percentile(values, 0.5), p95Ms: percentile(values, 0.95),
      minMs: Math.min(...values), maxMs: Math.max(...values) };
  }
  function pixel(x, y) {
    const bytes = new Uint8Array(4);
    gl.readPixels(x * 2, canvas.height - y * 2 - 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    return [...bytes];
  }
  function samples() {
    return [[36,36],[157,38],[106,62],[60,160],[790,450]].map(([x,y]) =>
      ({ x, y, rgba: pixel(x,y), hit: renderer.hitTest({x,y}) }));
  }
  function measure() {
    status.textContent = 'Measuring';
    const edits = Array.from({ length: 50 }, (_, i) => {
      const next = structuredClone(corpusScene);
      next.nodes[0].children[0].transform.x = 10 + i % 5;
      return next;
    });
    const update = [], render = [], missHit = [], visibleHit = [], commit = [];
    for (let i = 0; i < 10; i++) { renderer.updateScene(edits[i]); renderer.render(); gl.finish(); }
    for (let i = 0; i < 40; i++) {
      const start = performance.now(); renderer.updateScene(edits[i]);
      update.push(performance.now() - start);
    }
    for (let i = 0; i < 30; i++) {
      const start = performance.now(); renderer.render(); gl.finish();
      render.push(performance.now() - start);
    }
    for (let repeat = 0; repeat < 20; repeat++) {
      let start = performance.now();
      for (let i = 0; i < 1000; i++) renderer.hitTest(missPoint);
      missHit.push((performance.now() - start) / 1000);
      start = performance.now();
      for (let i = 0; i < 1000; i++) renderer.hitTest(visiblePoint);
      visibleHit.push((performance.now() - start) / 1000);
    }
    history = new SceneHistory(renderer, corpusScene, 50);
    for (let i = 0; i < 20; i++) {
      const start = performance.now();
      history.commit(scene => { scene.nodes[0].children[0].transform.x = 10 + i % 5; });
      gl.finish(); commit.push(performance.now() - start);
    }
    const assetBytes = corpusAssets.reduce((total, [, asset]) => total + asset.pixels.byteLength, 0);
    const debug = gl.getExtension('WEBGL_debug_renderer_info');
    const hardware = { userAgent: navigator.userAgent,
      vendor: gl.getParameter(gl.VENDOR), renderer: gl.getParameter(gl.RENDERER),
      unmaskedVendor: debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null,
      unmaskedRenderer: debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null };
    last = { corpus: { version: 4, logicalSize: corpusSize, dpr: 2, frames: 8, paths: 24,
      images: 8, glyphRuns: 8, copiedAssetBytes: assetBytes }, hardware,
      distributions: { updateScene: distribution(update), renderFinish: distribution(render),
        missHit: distribution(missHit), visibleHit: distribution(visibleHit),
        historyCommitFinish: distribution(commit) },
      resources: { afterSetup, afterRun: { ...counts },
        additionalTextureUploads: counts.texImage2D - afterSetup.texImage2D,
        additionalTextureBytes: counts.textureBytes - afterSetup.textureBytes,
        gpuResidentBytes: null, jsHeapUsedBytes: performance.memory?.usedJSHeapSize ?? null },
      accepted: { historyPosition: history.position, historyLength: history.length,
        miss: renderer.hitTest(missPoint), visible: renderer.hitTest(visiblePoint), samples: samples() } };
    renderer.dispose();
    let disposeCode = null;
    try { renderer.render(); } catch (error) { disposeCode = error.code ?? null; }
    last.resources.afterDispose = { ...counts };
    last.resources.disposeCode = disposeCode;
    out.textContent = JSON.stringify(last, null, 2);
    status.textContent = 'Measured · Save metrics JSON';
    document.querySelector('#run').disabled = true;
    return last;
  }
  document.querySelector('#run').onclick = measure;
  document.querySelector('#save').onclick = () => {
    if (!last) return;
    const url = URL.createObjectURL(new Blob([JSON.stringify(last, null, 2)], { type: 'application/json' }));
    const a = document.createElement('a'); a.href = url; a.download = 'canvas2d-perf-v4.json';
    a.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  window.__perf = { measure, samples, get last() { return last; }, get renderer() { return renderer; },
    get gl() { return gl; }, get counts() { return { ...counts }; } };
</script>
</html>

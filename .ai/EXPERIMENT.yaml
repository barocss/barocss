# STRATEGY writes every field above `result` and sets status: ready.
# EXECUTION may change only `status` and `result` (contract is frozen; .ai/check.py enforces).
# STRATEGY alone writes `review` and sets status: evaluated.
# status: none | ready | running | done | blocked | evaluated
# While ready/running/done/blocked, the authoritative copy is on `branch` (see AGENTS.md §1).
# Previous contracts and results: git log -p -- .ai/EXPERIMENT.yaml
status: evaluated

id: E-006
outcome: O1
branch: ai/E-006-config-preserve
question: >
  On apps/barocss-site's vite dev server, where baroStart passes {preflight:true} and updateConfig replaces the
  whole config (K8), does a real LLM agent using only generic browser tools add a colour token through BaroCSS
  without regressing the page, and does its final claim agree with the grader?
  Re-verifies K7 because E-004's fixtures had no existing config, so a config-dropping call could not regress
  them; E-005 never ran agents (blocked at its bare-call positive control).
decision_it_informs: >
  All three runs pass with claims agreeing → O1's done_when is met with zero BaroCSS changes (K3, K5, K7, K8,
  this); Strategy marks O1 done and moves to O2/O3. A run that drops the page's config and claims "done"
  (claim disagrees with the grader) is the evidence for a BAROCSS gap in updateConfig's replace semantics, and
  Strategy contracts the minimum merge/keep-base change as product code. A run that drops config, notices the
  regression and recovers still passes; its extra turns and cost are recorded. Any other failure names its owner:
  module identity or getRuntime/baroStart (BAROCSS), app loading (APP), bundler (LIBRARY), or agent error (AGENT).
hypothesis: >
  The agent reads updateConfig's source (K7 discovery path), sees the assignment and spreads the existing config
  in most runs, as E-004 A1 did. At least one run passes only a theme object, as E-004 A2 did; whether it then
  notices the hero links' colour change is the open point.
builds_on: [K5, K7, K8, U5]
scenario: >
  App: apps/barocss-site unchanged, booted by index.html's baroStart({config:{preflight:true}}), served by the
  `vite` dev server (E-005's arm D). The actor is E-004's and E-005's: claude-opus-4-8[1m], a fresh context per run,
  an empty cwd, only the Playwright MCP tools. Network is limited to the app's localhost origin through E-005's
  env.mjs proxy, and every external request is blocked. The prompt is word for word E-004's: "The page is styled
  with BaroCSS, a runtime utility-class CSS engine with Tailwind-compatible class names. Make the change through
  BaroCSS in the live page (its class names and its theme configuration), not with inline styles or hand-written
  CSS. Then verify the result and report whether the task is done."
  Task Y1 (E-005's): Add a `brand` color (#5B21B6) to the page's BaroCSS theme so that `bg-brand` works, and use
  it for the hero's Live Demo button's background.
  Runs: D1, D2, D3, each a fresh context. No production-build arm (K8 already shows no route there).
method: >
  1. Build packages locally and serve apps/barocss-site with `vite`, unchanged; no build output is committed.
     Copy E-005's grader.js, env.mjs and grader-selftest.mjs into .ai/evidence/E-006/. Keep the grader unchanged.
     Change the self-test only as follows: drop arm P; the positive control is the config-preserving call
     getRuntime().updateConfig({...getRuntime().options.config, theme:{extend:{colors:{brand:'#5B21B6'}}}}) from
     the page's own BaroCSS module URL plus adding bg-brand, and it must pass Y1 with no regression; add a negative
     control, the bare getRuntime().updateConfig({theme:{extend:{colors:{brand:'#5B21B6'}}}}) plus bg-brand, which
     must fail Y1 on regression only (class and colour checks pass). Keep every other E-005 arm D expectation. Run
     the self-test before any agent run and commit its output.
  2. Adapt E-004's run.mjs so the page URL is the dev server and the network goes through env.mjs's proxy
     (app origin only). Keep the rest of the actor setup. Commit the runner before any agent run.
  3. Grade each run with E-005's grader and Y1 rule at 1024px: the target's classList contains `bg-brand`, its
     computed backgroundColor is rgb(91, 33, 182), there is no regression on any snapshotted property, and the
     detector finds no raw-CSS route. Passing a theme or config object to a BaroCSS API is a BaroCSS route.
  4. For each run record: grader result and each failing property; the final claim and whether it agrees; the
     exact object(s) passed to updateConfig (or other BaroCSS API), in order; whether the page's options.config
     still has preflight:true and the preflight rules are present after the run; whether the agent read
     updateConfig's source; what its verification checked beyond the target (elements, screenshots); the module
     URL imported and whether getRuntime() was the page's runtime; duplicate barocss <style> ids; turns and cost.
allowed:
  actions:
    - "build packages locally (dist output is gitignored or left uncommitted)"
    - "run apps/barocss-site's vite dev server on localhost; drive a browser"
    - "copy and adapt E-005's grader, env and self-test and E-004's runner into .ai/evidence/E-006/"
    - "read packages/barocss-browser or packages/barocss source only to classify a route or failure"
    - "spawn one fresh agent context per run as the actor (3 runs)"
  paths: [".ai/evidence/E-006/"]
  product_code: false
non_goals:
  - Editing apps/barocss-site or any product code, including updateConfig's semantics, baroStart or getRuntime
  - Hinting that updateConfig replaces config, that preflight exists, where the runtime lives, or that updateConfig exists
  - Changing the prompt, the task, the model or the actor's tools; a production-build arm; other tasks
  - Allowing external network access (for example a public CDN import) or source-file config editing
  - Editing the grader or runner after seeing agent results
evidence:
  level_required: L3
  proves_yes: >
    All three runs pass Y1 through a BaroCSS config route with no regression, and all three final claims agree
    with the grader.
  proves_no: >
    At least one run fails Y1, and the tool calls record the blocking step: either the config route regressed
    the page (the object passed dropped the existing config) or BaroCSS theme configuration could not be reached
    or used. Whether that run's claim agreed with the grader is recorded.
budget: >
  1 session. Three agent runs (D1, D2, D3). Retry once only for environment failures, not for agent mistakes.
  Read ≤ 10 product files.
stop_when:
  - All three runs are recorded with grader results.
  - A gating self-test expectation in step 1 fails → blocked, and record which one.
  - The site does not render styled on the dev server before any agent run → blocked, and say why.
  - No independent agent actor can be run → blocked, and say what is missing.
  - The grader would have to change after an agent run → record it in side_notes, don't change the grader.

result:
  verdict: PROVEN
  level: L3
  evidence:
    - "Self-test 11/11 gating expectations pass before any agent run (commit d180f8a): positive control {...options.config, theme.extend} + bg-brand passes Y1 with no regression; negative control bare {theme.extend} + bg-brand fails on regression only (heroInstall.color, heroGithub.color). Rerun: node .ai/evidence/E-006/grader-selftest.mjs -> selftest.json"
    - "D1, D2, D3 (claude-opus-4-8[1m], Playwright MCP only, fresh context, empty cwd, network = app origin only): all pass Y1 at 1024px, 0 regressions, 0 raw-CSS writes, 0 style-attribute changes; target bg-blue-600 -> bg-brand, rgb(91, 33, 182). Rerun: node .ai/evidence/E-006/run.mjs D1|D2|D3 -> runs/<label>.json"
    - "Config objects (one updateConfig call per run): D1 deep Object.assign of rt.options.config; D2 deep spread of runtime.options.config; D3 literal {preflight:true, theme:{extend:{colors:{brand}}}}. After every run options.config = {preflight:true, theme:{extend:{colors:{brand:'#5B21B6'}}}} and the preflight partition holds 41 rules (baseline 41)"
    - "All three read updateConfig's source before calling it: D1 toString (#6), D2 fetched browser-runtime.ts via /@fs (#10), D3 toString + options.config (#9)"
    - "Route: page module /@fs/.../barocss-browser/src/index.ts (D2: baro-boot.ts) -> getRuntime() = the page runtime; no duplicate barocss <style> ids; page-module probe sees the new config and getCss('bg-brand') after each run"
    - "Final claims: all three say done, bg = #5B21B6, preflight preserved (D1, D3 explicit); all agree with the grader. Turns/cost D1 14/$0.49, D2 16/$0.72, D3 17/$0.52. No environment failures, no retries. Table: .ai/evidence/E-006/SUMMARY.md"
  learning: >
    On the real site, where updateConfig's replace semantics can regress the page, 3/3 agents read updateConfig's source,
    preserved the existing config and passed with claims agreeing; the replace semantics did not block agents. The
    drop-then-recover path was never exercised (0/3 passed a bare theme object).
  unknown:
    - "Whether an agent that passes a bare theme object on this page notices the hero links' colour regression (0/3 did it; E-004 A2's bare call was on a page with no config)"
    - "Rate beyond n=3, and with other models or weaker actors"
  next_question: >
    With O1's scenario passing through existing capabilities (K3/K5/K7/K8 + this), which O2/O3 scenario is the next
    unresolved assumption? A config-replace merge change is not indicated by this evidence.
  pr: https://github.com/barocss/barocss/pull/117
  checks: "python3 .ai/check.py --role execution --base origin/develop: pass. No product code changed (pnpm check not required)."
  side_notes:
    - "D2 call #5 used browser_run_code_unsafe with Node require('fs') to read the CLI's saved tool-result file on the host; it failed (require is not defined). The actor's Playwright tool set includes a host-code tool the network guard does not cover."
    - "The vite dev server serves all repo source over /@fs (D2 read baro-boot.ts, context.ts, browser-runtime.ts), so on dev the discovery path includes TypeScript source, not only Function.toString()."
    - "Chromium's own Google background requests are refused by the guard (logged in runs/*.json refused_requests); none came from the agent."

review:                  # STRATEGY only
  accepted_verdict: PROVEN
  merged: true
  reason: >
    proves_yes met at L3: 3/3 Y1 pass, 0 regressions, preflight kept (41 rules), claims agree; grader/env identical to
    E-005, runner and 11/11 self-test committed before runs; check.py OK, CI green; evidence-only. Caveats: n=3, one
    model, bare-call-then-recover path unexercised, actor had a host-code tool (browser_run_code_unsafe). Self-test not
    rerun (needs install+build+Playwright; not cheap).

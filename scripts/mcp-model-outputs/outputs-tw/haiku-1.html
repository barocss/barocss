<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Card</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-400 to-blue-600 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-3xl shadow-2xl overflow-hidden">
            <!-- Header -->
            <div class="bg-gradient-to-r from-blue-500 to-cyan-500 text-white px-8 py-6">
                <div class="flex justify-between items-start mb-4">
                    <div>
                        <h2 class="text-2xl font-bold">San Francisco, CA</h2>
                        <p class="text-blue-100 text-sm">Today • Partly Cloudy</p>
                    </div>
                    <span class="text-5xl">⛅</span>
                </div>
            </div>

            <!-- Current Temperature -->
            <div class="px-8 py-6 border-b border-gray-200">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-6xl font-bold text-gray-800">72°F</span>
                    <div class="text-right">
                        <p class="text-gray-600 text-sm">Feels like</p>
                        <p class="text-2xl font-semibold text-gray-800">70°F</p>
                    </div>
                </div>
            </div>

            <!-- Details Grid -->
            <div class="px-8 py-6 border-b border-gray-200">
                <div class="grid grid-cols-3 gap-4">
                    <div class="text-center p-3 bg-gray-50 rounded-lg">
                        <p class="text-gray-600 text-xs font-semibold mb-2">HIGH</p>
                        <p class="text-2xl font-bold text-gray-800">78°F</p>
                    </div>
                    <div class="text-center p-3 bg-gray-50 rounded-lg">
                        <p class="text-gray-600 text-xs font-semibold mb-2">LOW</p>
                        <p class="text-2xl font-bold text-gray-800">62°F</p>
                    </div>
                    <div class="text-center p-3 bg-gray-50 rounded-lg">
                        <p class="text-gray-600 text-xs font-semibold mb-2">CHANCE</p>
                        <p class="text-2xl font-bold text-gray-800">10%</p>
                    </div>
                </div>
            </div>

            <!-- Additional Info -->
            <div class="px-8 py-6">
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div class="flex items-center text-gray-700">
                            <span class="text-2xl mr-3">💧</span>
                            <span class="font-medium">Humidity</span>
                        </div>
                        <span class="text-lg font-semibold text-gray-800">65%</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex items-center text-gray-700">
                            <span class="text-2xl mr-3">💨</span>
                            <span class="font-medium">Wind Speed</span>
                        </div>
                        <span class="text-lg font-semibold text-gray-800">8 mph</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex items-center text-gray-700">
                            <span class="text-2xl mr-3">👁️</span>
                            <span class="font-medium">Visibility</span>
                        </div>
                        <span class="text-lg font-semibold text-gray-800">10 mi</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="flex items-center text-gray-700">
                            <span class="text-2xl mr-3">🌡️</span>
                            <span class="font-medium">UV Index</span>
                        </div>
                        <span class="text-lg font-semibold text-gray-800">4 (Moderate)</span>
                    </div>
                </div>
            </div>

            <!-- Footer -->
            <div class="bg-gray-50 px-8 py-4 text-center text-xs text-gray-500">
                Last updated: Sep 26, 2026 at 2:30 PM UTC
            </div>
        </div>
    </div>
</body>
</html>

name: Physics manifold fallback cause
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/manifold-fallback-cause.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-manifold-fallback-cause.mjs'
      - '.github/workflows/physics-manifold-fallback-cause.yml'
  workflow_dispatch:
jobs:
  geometric-classifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/p1572-face
      - name: Classify genuine b0/b1 face-eligibility and manifold fallbacks
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-manifold-fallback-cause.mjs | tee /tmp/p1572-face/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-manifold-fallback-causes
          path: /tmp/p1572-face/results.jsonl
          if-no-files-found: ignore

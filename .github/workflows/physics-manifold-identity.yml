name: Physics manifold identity audit
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/manifold-identity.ts'
      - '.github/workflows/physics-manifold-identity.yml'
  workflow_dispatch:
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/manifold-identity
      - run: pnpm exec esbuild examples/physics-contact-impulse-audit-1572/manifold-identity.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/manifold-identity/run.mjs
      - if: github.event_name != 'pull_request'
        run: node /tmp/manifold-identity/run.mjs > /tmp/manifold-identity/results.jsonl
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: physics-manifold-identity-results
          path: /tmp/manifold-identity/results.jsonl
          if-no-files-found: ignore

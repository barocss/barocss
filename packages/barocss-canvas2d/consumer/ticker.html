<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Canvas2D public ticker consumer</title>
<style>
  body { margin: 20px; font: 14px system-ui; color: #17233c; background: #f5f7fb; }
  button { margin: 0 8px 8px 0; padding: 7px 10px; }
  canvas { width: 160px; height: 100px; display: block; background: white; }
  pre { max-width: 760px; white-space: pre-wrap; background: white; padding: 12px; }

<h1>Canvas2D frame ticker</h1>
<p>The public ticker schedules callbacks. This host edits a sprite, then submits and renders each frame.</p>
<button id="start">Start</button>
<button id="stop">Stop</button>
<button id="resume">Resume at endpoint</button>
<button id="reset">Reset sprite</button>
<button id="dispose">Dispose ticker</button>
<p id="status" role="status">Loading</p>
<canvas id="scene"></canvas>
<pre id="observation"></pre>
<script type="importmap">{"imports":{"@barocss/canvas2d":"../dist/index.js"}}</script>
<script type="module" src="./ticker.mjs"></script>

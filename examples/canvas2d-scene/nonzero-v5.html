<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Canvas2D nonzero v5</title>
<style>
  body { margin: 24px; font: 15px system-ui; color: #16213a; background: #f4f6fb; }
  main { display: flex; gap: 20px; flex-wrap: wrap; }
  figure { margin: 0; padding: 12px; background: white; border: 1px solid #ccd5e2; border-radius: 10px; }
  figcaption { margin-bottom: 8px; font-weight: 600; }
  canvas { width: 180px; height: 180px; display: block; background: #dbe3ef; }
</style>
<h1>Nonzero winding / even-odd comparison</h1>
<main>
  <figure><figcaption>Same direction · nonzero</figcaption><canvas id="same"></canvas></figure>
  <figure><figcaption>Opposite direction · nonzero</figcaption><canvas id="opposite"></canvas></figure>
  <figure><figcaption>Same direction · even-odd v2</figcaption><canvas id="parity"></canvas></figure>
</main>
<p id="status" role="status">Loading</p>
<script type="module">
  import { createCanvas2D, stringifySceneJSON } from '../../packages/barocss-canvas2d/dist/index.js';
  import { sceneFor, crossingScene } from './nonzero-v5.mjs';
  const variants = { same: sceneFor('nonzero'), opposite: sceneFor('nonzero', true),
    parity: sceneFor('evenodd') };
  const renderers = {};
  for (const [key, scene] of Object.entries(variants)) {
    const renderer = createCanvas2D(document.querySelector(`#${key}`),
      { logicalSize: { width: 180, height: 180 }, dpr: 2 });
    renderer.updateScene(scene); renderer.render(); renderers[key] = renderer;
  }
  window.__nonzeroDebug = {
    variants, renderers, crossingScene, stringifySceneJSON,
    hit(key, x, y) { return renderers[key].hitTest({ x, y }); },
    pixel(key, x, y) {
      const gl = document.querySelector(`#${key}`).getContext('webgl2');
      const bytes = new Uint8Array(4), dpr = document.querySelector(`#${key}`).width / 180;
      gl.readPixels(Math.round(x * dpr), document.querySelector(`#${key}`).height - Math.round(y * dpr) - 1,
        1, 1, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
      return [...bytes];
    },
  };
  document.querySelector('#status').textContent = 'Ready';
</script>
</html>

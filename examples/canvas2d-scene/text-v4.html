<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Canvas2D bounded text host</title>
<style>
  body { margin: 24px; font: 15px system-ui; color: #17233c; background: #f5f7fb; }
  button, input { font: inherit; margin: 4px 8px 8px 0; }
  button { padding: 7px 10px; }
  input[type=text] { padding: 7px; width: 220px; }
  canvas { width: 400px; height: 200px; display: block; background: white; border: 1px solid #c8d2e3; }
</style>
<h1>Bounded host text editing</h1>
<p>The DOM input owns its caret and selection. Supported text: 1–6 uppercase H, I or spaces, including one visible letter.</p>
<label>Text <input id="text" type="text" value="HI" maxlength="6" aria-label="Text"></label>
<button id="apply">Apply text</button><button id="undo">Undo</button><button id="redo">Redo</button>
<button id="missing">Try missing atlas</button><button id="badAtlas">Try bad atlas replacement</button>
<button id="save">Save document</button>
<label>Open document <input id="open" type="file" accept="application/json,.json"></label>
<p id="status" role="status">Loading</p>
<div id="surface"><canvas aria-label="Editable glyph run"></canvas></div>
<script type="module">
  import { Canvas2DError, createCanvas2D } from '../../packages/barocss-canvas2d/dist/index.js';
  import { serializeCanvasDocument, stageCanvasDocument } from '../../packages/barocss-canvas2d/dist/document.js';
  import { SceneHistory } from './scene-history.mjs';
  import { initialTextScene, makeTextCandidate } from './text-adapter.mjs';

  const options = { logicalSize: { width: 400, height: 200 }, dpr: 2 };
  const surface = document.querySelector('#surface'), input = document.querySelector('#text');
  const status = document.querySelector('#status');
  let canvas = surface.querySelector('canvas');
  let renderer = createCanvas2D(canvas, options);
  const initial = makeTextCandidate('HI', 'Atlas1');
  renderer.setImageAsset('Atlas1', initial.asset);
  let history = new SceneHistory(renderer, initialTextScene(initial.run), 8);
  let registered = new Set(['Atlas1']), nextAtlas = 2;
  status.textContent = 'Ready · HI · history 0/1';

  function currentRun() { return history.scene.nodes[1]; }
  function show(message) { status.textContent = message; }
  function syncInput() {
    input.value = currentRun().text;
    input.setSelectionRange(input.value.length, input.value.length);
  }
  document.querySelector('#apply').onclick = () => {
    const text = input.value, accepted = currentRun().text;
    try {
      const atlasId = `Atlas${nextAtlas}`;
      const candidate = makeTextCandidate(text, atlasId);
      if (text === accepted) { show('Text unchanged'); return; }
      if (registered.size >= 16) throw new Canvas2DError('ASSET_LIMIT', '16 atlas versions per open document');
      renderer.setImageAsset(atlasId, candidate.asset);
      try { history.commit(scene => { scene.nodes[1] = candidate.run; }); }
      catch (error) { renderer.removeImageAsset(atlasId); throw error; }
      registered.add(atlasId); nextAtlas++;
      show(`Applied ${text} · ${atlasId} · history ${history.position}/${history.length}`);
    } catch (error) {
      syncInput(); show(`${error.code ?? 'ERROR'}: ${error.message}`);
    }
  };
  document.querySelector('#undo').onclick = () => {
    history.undo(); syncInput(); show(`Undo · ${currentRun().text} · history ${history.position}/${history.length}`);
  };
  document.querySelector('#redo').onclick = () => {
    history.redo(); syncInput(); show(`Redo · ${currentRun().text} · history ${history.position}/${history.length}`);
  };
  document.querySelector('#missing').onclick = () => {
    try { history.commit(scene => { scene.nodes[1].atlasId = 'MissingAtlas'; }); }
    catch (error) { show(`${error.code ?? 'ERROR'}: ${error.message}`); }
  };
  document.querySelector('#badAtlas').onclick = () => {
    try { renderer.setImageAsset(currentRun().atlasId,
      { width: 1, height: 1, pixels: new Uint8Array(4) }); }
    catch (error) { show(`${error.code ?? 'ERROR'}: ${error.message}`); }
  };
  document.querySelector('#save').onclick = async () => {
    try {
      const text = await serializeCanvasDocument(history.scene, id => renderer.getImageAsset(id));
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const anchor = document.createElement('a'); anchor.href = url; anchor.download = 'text-document.json';
      anchor.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      show(`Saved ${new TextEncoder().encode(text).length} bytes · ${currentRun().text}`);
    } catch (error) { show(`${error.code ?? 'ERROR'}: ${error.message}`); }
  };
  document.querySelector('#open').onchange = async event => {
    const file = event.target.files?.[0]; if (!file) return;
    const fresh = document.createElement('canvas'); fresh.setAttribute('aria-label', 'Editable glyph run');
    let staged;
    try {
      staged = await stageCanvasDocument(await file.text(), fresh, options);
      const run = staged.scene.nodes[1];
      const expected = makeTextCandidate(run?.text, run?.atlasId);
      const asset = staged.assets.get(run.atlasId);
      if (JSON.stringify(staged.scene) !== JSON.stringify(initialTextScene(expected.run)) ||
          staged.assets.size !== 1 || !asset || asset.width !== expected.asset.width ||
          asset.height !== expected.asset.height ||
          !asset.pixels.every((value, index) => value === expected.asset.pixels[index])) {
        throw new Canvas2DError('UNSUPPORTED_FEATURE', 'document is outside the fixed H/I host policy');
      }
      const nextHistory = new SceneHistory(staged.renderer, staged.scene, 8);
      surface.replaceChildren(fresh); renderer.dispose();
      canvas = fresh; renderer = staged.renderer; history = nextHistory;
      registered = new Set(staged.assets.keys());
      nextAtlas = Number(run.atlasId.slice(5)) + 1;
      syncInput(); show(`Opened ${run.text} · ${run.atlasId} · history 0/1`);
    } catch (error) {
      staged?.renderer.dispose(); show(`${error.code ?? 'ERROR'}: ${error.message}`);
    }
    event.target.value = '';
  };
  window.__textDebug = {
    get canvas() { return canvas; }, get scene() { return history.scene; },
    get input() { return { value: input.value, start: input.selectionStart, end: input.selectionEnd }; },
    get history() { return { position: history.position, length: history.length,
      canUndo: history.canUndo, canRedo: history.canRedo }; },
    asset(id) { return renderer.getImageAsset(id); },
    hit(x, y) { return renderer.hitTest({ x, y }); },
    pixel(x, y) {
      const gl = canvas.getContext('webgl2'), rgba = new Uint8Array(4);
      gl.readPixels(x * 2, canvas.height - y * 2 - 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
      return [...rgba];
    },
  };
</script>
</html>

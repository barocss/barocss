# Handoff between one STRATEGY session and one EXECUTION session.
# STRATEGY writes every field above `result` and sets status: ready.
# EXECUTION may change only `status` and `result` (contract is frozen; .ai/check.py enforces).
# STRATEGY alone writes `review` and sets status: evaluated.
# status: none | ready | running | done | blocked | evaluated
# While ready/running/done/blocked, the authoritative copy is on `branch` (see AGENTS.md §1).
# Previous contracts and results: git log -p -- .ai/EXPERIMENT.yaml
status: evaluated

id: E-003
outcome: O1
branch: ai/E-003-live-theme
question: >
  When a styling task needs a theme-level change (a new color token, an extended
  radius scale) rather than a class edit, can a real LLM agent using only generic
  browser tools make that change through BaroCSS in the live page, when the page
  keeps its BrowserRuntime in a module-scoped variable? Does an app-exposed runtime
  change the outcome? Where it fails, who owns the block?
decision_it_informs: >
  If the agent completes both tasks with the runtime not exposed (arm A), live theme
  edits need no BaroCSS surface and no app help. O1 is then met with zero BaroCSS
  changes (K3, K5, this), and Strategy considers marking O1 done and moving to O2/O3.
  If arm A fails but arm B (runtime exposed by the app) passes, the gap is reaching
  the runtime instance. The owner is APP by default, and the next contract tests
  whether any BaroCSS-side handle is needed at all. If arm B also fails, the gap is
  BaroCSS config semantics (BAROCSS-owned), and the next contract targets the
  smallest fix for the recorded failure.
hypothesis: >
  Arm B passes both tasks: the agent finds the exposed runtime and learns updateConfig
  from the bundle. Arm A is harder. The agent either imports the CDN module and starts
  a second runtime with an extended theme (a pass if nothing regresses), or it falls
  back to arbitrary values (bg-[#5B21B6], rounded-[2rem]) and honestly reports that the
  token was not added. A config call that replaces the whole config (dropping defaults
  or preflight) is a likely regression.
builds_on: [K3, K5, U5]
scenario: >
  Page: an exact copy of E-002's index.html (same markup, same boot script).
  Arm A uses it unchanged, so `runtime` is module-scoped and reachable only by reading
  the page. Arm B is the same file plus one line after the observe() call:
  `window.baroRuntime = runtime;`. That line stands in for an app choosing to expose
  the runtime, and no product code changes. The actor is the E-002 actor, with the
  model pinned to claude-opus-4-8[1m]. Its prompt, word for word, replacing the E-001
  prompt because that one forbids anything but class edits: "The page is styled with
  BaroCSS, a runtime utility-class CSS engine with Tailwind-compatible class names.
  Make the change through BaroCSS in the live page (its class names and its theme
  configuration), not with inline styles or hand-written CSS. Then verify the result
  and report whether the task is done."
  Tasks, each run once per arm (4 runs):
    Y1 Add a `brand` color (#5B21B6) to the page's BaroCSS theme so that `bg-brand`
       works, and use it for the Save button's background.
    Y2 Extend the page's BaroCSS border-radius scale with `4xl` = 2rem so that
       `rounded-4xl` works, and give the pricing card that radius.
  Realism limit: an agent with repo access would edit a source config file. This
  experiment tests the live-page path only, which is BaroCSS's runtime role.
method: >
  1. Copy E-002's page, grader, runner and self-test into .ai/evidence/E-003/ and
     adapt them. Make two page files (arm A, arm B). The runner takes the arm and the
     task as arguments. The actor setup is otherwise E-002's: a fresh context per
     run, an empty cwd, only the Playwright MCP tools, and the server allowlisted to
     the page and dist/cdn.
  2. Write the grader BEFORE any agent run. At 1024px:
     Y1 passes when the save-button classList contains `bg-brand` and its computed
     backgroundColor is rgb(91, 33, 182).
     Y2 passes when the pricing-card classList contains `rounded-4xl` and all four
     radii are 32px.
     Both also require no regression: every other snapshotted property must equal
     baseline. Snapshot at least save-button padding, font-size, color and radius;
     pricing-card background, border-width, padding and shadow; intro color and
     font-size; and media height.
     A run fails when its effect came from something other than a BaroCSS config
     route. Detect a changed style attribute on a data-testid element, or agent code
     matching E-002's WRITE_PATTERNS, or code writing CSS text through any API,
     including BaroCSS internals such as updateRuleContent. Passing a theme or config
     object to a BaroCSS API (updateConfig, a new BrowserRuntime or createContext
     with config) is a BaroCSS route.
  3. Pre-run self-test, committed before any agent run, for both arms. The baseline
     fails Y1 and Y2. `bg-brand` alone and `rounded-4xl` alone fail. `bg-[#5B21B6]`
     and `rounded-[2rem]` fail, because the token class is required. An inline-CSS
     control fails through the detector. Arm B positive control: find a
     window.baroRuntime config call that makes Y1 and Y2 pass with no regression,
     and record the exact call plus any config shape that regressed (for example a
     partial config that drops defaults or preflight). Arm A: record whether any
     BaroCSS config route that does not use the page's instance passes (for example
     importing the CDN module and starting a second runtime). This is informational
     and does not gate.
  4. Run each task once per arm. For each run record: the route
     (class/arbitrary value | page runtime via global | second runtime via import |
     raw CSS | none); how it discovered the API (page source, bundle fetch or search,
     window scan, prior knowledge), with call numbers; each config call it made; how
     it verified; its final claim; the grader result, including regressions; whether
     claim and grader agree; and for any failure or disagreement a proposed owner
     (BAROCSS | BROWSER | AGENT | APP) with a one-line cause. Also record cost and
     turns.
allowed:
  actions:
    - "build packages/barocss-browser locally (dist is gitignored; nothing committed)"
    - "serve the repo root on localhost; drive a browser"
    - "copy and adapt E-002 page, grader, runner and self-test into .ai/evidence/E-003/"
    - "read packages/barocss-browser or packages/barocss source only to write the positive control or classify a route or failure"
    - "spawn one fresh agent context per run as the actor (4 runs)"
  paths: [".ai/evidence/E-003/"]
  product_code: false
non_goals:
  - Exposing the runtime, adding a global, registry or discovery API, or changing updateConfig in product code
  - Adding `brand` or radius `4xl` to BaroCSS defaults, or any parity fix
  - Hinting where the runtime lives or that updateConfig exists, or changing the prompt above
  - Tasks beyond Y1/Y2, other models, or source-file config editing
  - Editing tasks, pages or grader after seeing agent results
evidence:
  level_required: L3
  proves_yes: >
    In arm A, Y1 and Y2 both pass the grader through a BaroCSS config route with no
    regression, and both final claims agree with the grader.
  proves_no: >
    In arm A, at least one of Y1/Y2 fails because the agent could not reach or use
    BaroCSS theme configuration with generic browser tools. The tool calls record the
    blocking step, and arm B's result for the same task shows whether an app-exposed
    runtime removes the block.
budget: >
  1 session. Four agent runs (Y1/Y2 × arm A/B). Retry once only for environment
  failures, not for agent mistakes. Each page ≤ 150 lines. Read ≤ 10 product files.
stop_when:
  - All four runs are recorded with grader results.
  - The self-test finds no window.baroRuntime config call that passes Y1 and Y2 without regression in arm B → blocked, and record the config shapes tried and their failures.
  - No independent agent actor can be run → blocked, and say what is missing.
  - The grader would have to change after an agent run → record it in side_notes, don't change the grader.

result:
  verdict: INCONCLUSIVE
  level: L2
  evidence:
    - "Blocked by stop_when #2. The arm B positive control found no window.baroRuntime config call that passes Y1 AND Y2. 0 of 4 agent runs made (none started). Rerun: pnpm --filter @barocss/browser build:cdn && PW_MCP_DIR=<dir with node_modules/@playwright/mcp> node .ai/evidence/E-003/grader-selftest.mjs (exit 1; writes .ai/evidence/E-003/selftest.json)"
    - "Self-test: 22/23 expectations pass in both arms. Baseline and bg-brand / rounded-4xl alone fail. bg-[#5B21B6] and rounded-[2rem] fail on the class check. Inline-style and <style>-tag controls fail through the detector. The tool-call scan flags updateRuleContent and textContent CSS writes, not updateConfig. (selftest.json -> expectations)"
    - "Y2 fails under all 7 config routes tried, 5 via baroRuntime.updateConfig (arm B) and 2 via an imported second BrowserRuntime (arm A), with the class added or replacing rounded-md. theme.extend.borderRadius['4xl'] emits :root --radius-4xl: 2rem, but the parser logs 'ast is empty rounded-4xl'. Radius stays 6px (added) or goes to 0px (replaced). (selftest.json -> arms.*.routes.*.Y2*)"
    - "Cause, from source: packages/barocss/src/presets/border.ts hard-codes rounded-{none,sm,md,lg,xl,2xl,3xl,full} as staticUtility. The functional rounded has no theme key (bare number, arbitrary, custom property only). Config has no plugin hook (ctx.plugins is commented out in core/context.ts). Proposed owner: BAROCSS (config semantics)."
    - "Y1 is reachable: theme.extend / theme / theme.colors.brand via baroRuntime.updateConfig (arm B) pass with no regression. So does arm A's import of /packages/barocss-browser/dist/cdn/barocss.js plus new BrowserRuntime({config}).observe(document.body,{scan:true}), with or without a distinct styleId. (selftest.json -> arms.A.secondRuntimePasses is empty only because Y2 fails)"
    - "Summary table: .ai/evidence/E-003/SUMMARY.md"
  learning: >
    BaroCSS theme config reaches class generation for colors but not for border-radius. extend.borderRadius only emits
    a :root var, because rounded-* names are hard-coded. Y2 is unachievable through any config route, whatever the
    agent or app does. Y1 is reachable even without an app-exposed runtime (second runtime via CDN import).
  unknown:
    - "Blocker: the contract's Y2 cannot pass the grader under any BaroCSS config route, so agent runs could not answer the question. Unanswered: whether a real agent in arm A finds a config route for Y1 (e.g. a second runtime), and how it reports Y2's impossibility."
    - "Whether other theme namespaces are hard-coded like rounded (spacing, shadow, font-size); only colors and borderRadius were tested."
  next_question: >
    Suggestion: re-contract E-003 as Y1-only (arm A vs B), keeping the grader and self-test, which pass for Y1, and
    treat the radius finding as known. Separately, a BAROCSS-owned gap candidate is 'rounded-* does not read
    theme.borderRadius'. Strategy should first check whether agents need custom radius tokens before contracting a fix.
  pr: https://github.com/barocss/barocss/pull/111
  checks: "python3 .ai/check.py --role execution --base origin/develop: OK. No product code changed, so pnpm check is not required."
  side_notes:
    - "extend.colors.brand = {DEFAULT: '#5B21B6'} makes bg-brand throw 'TypeError: value.startsWith is not a function' in the bg handler, and emits --color-brand-DEFAULT."
    - "Arm A second runtime: the page's original runtime still logs 'ast is empty bg-brand' while the second runtime serves the rule. That console warning is misleading for an agent."
    - "theme (without extend) deep-merges over defaults instead of replacing them, so a partial theme did not regress defaults here."
    - "No runner was written: the contract stopped before any agent run. E-002's run.mjs would need arm/page arguments."
review:                  # STRATEGY only
  accepted_verdict: INCONCLUSIVE
  merged: true
  reason: >
    Blocked before any agent run, correctly per stop_when #2. U5 is unanswered (no L3). Accepted as L2 knowledge:
    theme.borderRadius does not feed rounded-* (source-confirmed: border.ts hard-codes names, the functional rounded
    has no theme key). A colour token is reachable via updateConfig (B) and via a second runtime from the CDN import (A).
    check.py OK, evidence-only diff, CI green. Strategy error: Y2 used rounded-4xl, already a K4(c) no-op.

  - id: D18
    date: 2026-09-25
    decision: >
      Human withdrew E-009 (evaluated/INCONCLUSIVE, not merged — interrupted before any result) and added the
      parity-lane directive. Contracted E-010 (work store, O2, product_code) as the first parity-lane batch: three
      measured K10 families that each drop silently because BaroCSS omits a Tailwind-v4 composition default —
      F1 ring box-shadow (starts from the proven E-008 fix, K11), F2 single-axis translate (unregistered other-axis
      --baro-translate-* var), F3 preflight border-style (universal reset lacks border-style:solid). One PR = one
      capability (Tailwind v4 parity) per the directive; evidence L2 per-token vs Tailwind 4.1.13 + pnpm check green,
      plus one G1/G2/G3 rerun. Deferred to a later batch: the theme-var --shadow-*/--leading- family (K10) and the
      PR #84 candidates (must be measured with the E-007/E-008 classifier first, per that directive).
    why: >
      The parity lane treats a family BaroCSS resolves differently from the 4.1.13 reference as a known-answer bug,
      not an open question, and prefers batching measured families while any remain. These three share one mechanism
      (missing composition default) and one-line-per-file local fixes, maximizing a mergeable first product PR;
      murkier or unmeasured families are held back so scope errors don't sink the batch. Human-approval,
      tests-in-scope and draft-when-red directives all carried into the contract.

  - id: D19
    date: 2026-09-25
    decision: >
      Reviewed E-010 (§2A of PR #141): accepted PARTIAL, decided to merge the landed part (merged: true), merge held
      on the human-approved label. F1 ring + F3 preflight border reach exact Tailwind-4.1.13 per-token L2 parity with

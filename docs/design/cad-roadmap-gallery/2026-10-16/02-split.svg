<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">한 몸체를 둘로 · Split</title><desc id="desc">잘라낸 재료를 버리는 대신 서로 다른 두 솔리드를 남깁니다. Conceptual CAD target design, not implementation evidence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#167d97" stroke-width="1.5"/></marker></defs><rect width="1440" height="900" fill="#f5f7fa"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="40" y="44" font-size="16" fill="#576b80" font-weight="700">BAROCSS / CAD ROADMAP VISUAL STUDY 02</text><text x="40" y="93" font-size="34" fill="#16283b" font-weight="700">한 몸체를 둘로 · Split</text><text x="40" y="130" font-size="19" fill="#526779" font-weight="400">잘라낸 재료를 버리는 대신 서로 다른 두 솔리드를 남깁니다.</text><rect x="40" y="154" width="1360" height="39" rx="8" fill="#fff0ce"/><text x="58" y="180" font-size="17" fill="#78531a" font-weight="700">TARGET DESIGN / NOT IMPLEMENTATION EVIDENCE · 목표 디자인 · 실제 실행 화면 아님</text><rect x="40" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="62" y="256" font-size="17" fill="#50677d" font-weight="700">01  입력 형상 / INPUT</text><g transform="translate(40,0)"><polygon transform="translate(0,-45)" points="145,375 337,447 337,527 145,455" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="49,423 241,495 325,439 133,367" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="133,367 325,439 337,447 145,375" fill="#5ba8c5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="337,527 241,591 241,495 325,439 337,447" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><text x="76" y="574" font-size="18" fill="#263445" font-weight="400">Body 01 · 모따기된 레일</text></g><rect x="500" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="522" y="256" font-size="17" fill="#50677d" font-weight="700">02  조작 / OPERATION</text><g transform="translate(500,0)"><polygon transform="translate(0,-45)" points="145,375 337,447 337,527 145,455" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="49,423 241,495 325,439 133,367" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="133,367 325,439 337,447 145,375" fill="#5ba8c5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="337,527 241,591 241,495 325,439 337,447" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="256,493 130,577 130,441 256,357" fill="#f4b654" stroke="#c08417" stroke-width="2" stroke-linejoin="round" fill-opacity=".28" stroke-dasharray="6 5"/><text x="195" y="320" font-size="18" fill="#9b650b" font-weight="700">X = 24 mm</text><text x="41" y="593" font-size="18" fill="#263445" font-weight="400">절단 평면 · 두 결과 모두 유지</text></g><rect x="960" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="982" y="256" font-size="17" fill="#50677d" font-weight="700">03  목표 결과 / RESULT</text><g transform="translate(960,0)"><polygon transform="translate(0,-45)" points="120,365 216,401 216,481 120,445" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="24,413 120,449 204,393 108,357" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="108,357 204,393 216,401 120,365" fill="#5ba8c5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="216,481 120,545 120,449 204,393 216,401" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="247,413 343,449 343,529 247,493" fill="#b5ddcb" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="151,461 247,497 331,441 235,405" fill="#e0f2e8" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="235,405 331,441 343,449 247,413" fill="#56aa89" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="343,529 247,593 247,497 331,441 343,449" fill="#82c3a6" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><text x="33" y="560" font-size="18" fill="#356180" font-weight="700">negative</text><text x="278" y="581" font-size="18" fill="#287452" font-weight="700">positive</text><text x="28" y="612" font-size="16" fill="#263445" font-weight="400">틈은 이해를 위한 분리 표시만 적용</text></g><rect x="40" y="658" width="1360" height="156" rx="14" fill="#e9eff5"/><text x="62" y="690" font-size="17" fill="#34516b" font-weight="700">선택 · 입력값 · 동작 설계 / COMMAND CONTEXT</text><text x="62" y="724" font-size="18" fill="#263445" font-weight="400">선택: Body 01 / 최종 Chamfer   |   기준: Model X   |   절단 위치: 24 mm</text><text x="62" y="753" font-size="18" fill="#263445" font-weight="400">negative는 X가 작은 쪽, positive는 큰 쪽. 각 결과를 따로 선택하고 구분합니다.</text><text x="62" y="782" font-size="18" fill="#263445" font-weight="400">분리 표시는 설명용입니다. 실제 위치 변경·일반 평면 절단·후속 편집 지원을 뜻하지 않습니다.</text><text x="40" y="849" font-size="16" fill="#526779" font-weight="400">근거: #536 DETAIL-07 · #2018 제한된 두-bevel 레일 Split · #1446 별도 Solid 세션</text><text x="40" y="877" font-size="15" fill="#6b7c8d" font-weight="400">도해는 수동 설계한 예시입니다. 형상 비례·치수는 제안이며 API 지원 범위나 검증 결과가 아닙니다.</text></g></svg>
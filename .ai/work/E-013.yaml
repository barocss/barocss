    PARITY-MISS attributed to a named family or "other" and each AGENT token to spec-author-error vs runtime-gap, in
    a reproducible table (rerun command regenerates it). (b) Recorded: each step of the flow marked covered-by-
    existing (browser/DOM/renderer/existing BaroCSS runtime) or a named gap, with every candidate gap actively tried
    and either confirmed with evidence or disproven, K-ids cited; if the only gap is K8 production-runtime, it is
    labelled the Q4 trigger. Coverage note present (flow 2 only).
  proves_no: >
    Not a yes/no; the informative outcomes are (i) json-render specs hit the SAME parity families as free-form
    classes and NO gap beyond the existing runtime is found -> flow-2 value is parity-only, no new BaroCSS code
    needed for flow 2 (progress: "no new code"); or (ii) a real flow-2-specific runtime gap IS found (something only
    BaroCSS can do that the render path needs) -> record it precisely as the seed for a minimum-gap experiment.
    Record which. INCONCLUSIVE if the runtime will not boot/serve, the classifier will not run after one environment
    retry, or the sample cannot be rendered — say exactly what blocked it.

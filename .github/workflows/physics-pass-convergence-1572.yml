name: Physics solver pass convergence 1572
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/pass-count-convergence.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-pass-count-convergence.mjs'
      - '.github/workflows/physics-pass-convergence-1572.yml'
  workflow_dispatch:
jobs:
  controlled-convergence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-convergence
      - name: Compare full 1200-step baselines and 8/16/32-pass controls
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-pass-count-convergence.mjs | tee /tmp/physics1572-convergence/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-pass-convergence-jsonl
          path: /tmp/physics1572-convergence/results.jsonl
          if-no-files-found: ignore

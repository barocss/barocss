  and contracts the next observed family (single-axis translate, theme var name, or the preflight border-style gap)
  the same way, then later reruns G1-G3 to see whether claims finally agree once every family a run uses is fixed.
  If green check still needs a change outside effects.ts + those 4 tests, or a control regresses, or the rerun still
  shows a ring token not applied → the ring fix is not as localized as E-008's L2 evidence implied, and Strategy
  rethinks scope before spending more product code.

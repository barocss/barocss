<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .weather-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 100%;
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        
        .location-info h2 {
            font-size: 24px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 4px;
        }
        
        .location-info p {
            font-size: 14px;
            color: #718096;
        }
        
        .weather-icon {
            font-size: 64px;
        }
        
        .temperature-section {
            text-align: center;
            margin-bottom: 32px;
        }
        
        .current-temp {
            font-size: 56px;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 8px;
        }
        
        .condition {
            font-size: 18px;
            color: #4a5568;
            margin-bottom: 12px;
        }
        
        .temp-range {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 14px;
        }
        
        .temp-range span {
            color: #718096;
        }
        
        .temp-range .high {
            color: #e53e3e;
            font-weight: 600;
        }
        
        .temp-range .low {
            color: #3182ce;
            font-weight: 600;
        }
        
        .details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 12px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: #2d3748;
        }
        
        .forecast {
            margin-top: 24px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
        }
        
        .forecast-title {
            font-size: 14px;
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 12px;
        }
        
        .forecast-items {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
        
        .forecast-item {
            flex: 1;
            text-align: center;
            padding: 12px;
            background: #f7fafc;
            border-radius: 12px;
            font-size: 12px;
        }
        
        .forecast-day {
            color: #718096;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .forecast-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }
        
        .forecast-temp {
            color: #2d3748;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="weather-card">
        <div class="header">
            <div class="location-info">
                <h2 id="location">San Francisco</h2>
                <p id="date">Today</p>
            </div>
            <div class="weather-icon" id="icon">☀️</div>
        </div>
        
        <div class="temperature-section">
            <div class="current-temp"><span id="temp">72</span>°F</div>
            <div class="condition" id="condition">Partly Cloudy</div>
            <div class="temp-range">
                <span>H: <span class="high" id="high">78</span>°</span>
                <span>L: <span class="low" id="low">62</span>°</span>
            </div>
        </div>
        
        <div class="details">
            <div class="detail-item">
                <div class="detail-label">Humidity</div>
                <div class="detail-value"><span id="humidity">65</span>%</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Wind Speed</div>
                <div class="detail-value"><span id="wind">12</span> mph</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">Feels Like</div>
                <div class="detail-value"><span id="feelsLike">70</span>°F</div>
            </div>
            <div class="detail-item">
                <div class="detail-label">UV Index</div>
                <div class="detail-value"><span id="uv">6</span></div>
            </div>
        </div>
        
        <div class="forecast">
            <div class="forecast-title">5-Day Forecast</div>
            <div class="forecast-items">
                <div class="forecast-item">
                    <div class="forecast-day">Mon</div>
                    <div class="forecast-icon">☀️</div>
                    <div class="forecast-temp">75°</div>
                </div>
                <div class="forecast-item">
                    <div class="forecast-day">Tue</div>
                    <div class="forecast-icon">⛅</div>
                    <div class="forecast-temp">73°</div>
                </div>
                <div class="forecast-item">
                    <div class="forecast-day">Wed</div>
                    <div class="forecast-icon">🌧️</div>
                    <div class="forecast-temp">68°</div>
                </div>
                <div class="forecast-item">
                    <div class="forecast-day">Thu</div>
                    <div class="forecast-icon">⛅</div>
                    <div class="forecast-temp">70°</div>
                </div>
                <div class="forecast-item">
                    <div class="forecast-day">Fri</div>
                    <div class="forecast-icon">☀️</div>
                    <div class="forecast-temp">76°</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Sample data - can be replaced with dynamic data
        const weatherData = {
            location: 'San Francisco',
            condition: 'Partly Cloudy',
            currentTemp: 72,
            highTemp: 78,
            lowTemp: 62,
            humidity: 65,
            windSpeed: 12,
            feelsLike: 70,
            uvIndex: 6,
            icon: '⛅'
        };
        
        // Update card with weather data
        document.getElementById('location').textContent = weatherData.location;
        document.getElementById('temp').textContent = weatherData.currentTemp;
        document.getElementById('condition').textContent = weatherData.condition;
        document.getElementById('high').textContent = weatherData.highTemp;
        document.getElementById('low').textContent = weatherData.lowTemp;
        document.getElementById('humidity').textContent = weatherData.humidity;
        document.getElementById('wind').textContent = weatherData.windSpeed;
        document.getElementById('feelsLike').textContent = weatherData.feelsLike;
        document.getElementById('uv').textContent = weatherData.uvIndex;
        document.getElementById('icon').textContent = weatherData.icon;
        
        // Update date
        const today = new Date();
        const dateStr = today.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        document.getElementById('date').textContent = dateStr;
    </script>
</body>
</html>

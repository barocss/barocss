evidence:
  level_required: L3
  proves_yes: >
    L3, actor unchanged, all arms on the pinned commit. Arm 1's first-try silent misses shipped under a "done" claim
    are clearly fewer than arm 0's E-007 baseline (7 of 8) AND clearly fewer than arm 2's (the computed-style
    control), with the per-run detail showing the reduction comes from the agent naming/fixing, before its claim,
    classes the BaroCSS report flagged as UNRESOLVED/EMPTY-RULE/UNDEFINED-VAR. That is: the report reduces silent
    generation misses and the reduction needs BaroCSS resolution data the browser computed style did not give
    (criterion 5 holds for option B).
  proves_no: >
    Arm 1 is not clearly below arm 0 (the report does not reduce first-try silent misses shipped under a "done"
    claim; the working assumption holds — DISPROVEN for option B's premise), OR arm 1 is below arm 0 but not clearly
    below arm 2 (a post-hoc report helps but the browser's computed style is enough, so the information is not
    BaroCSS-unique — criterion 5 fails for option B). Record which case, with the per-arm metric and, if arm 1 ~=
    arm 2, which specific misses the computed-style control surfaced just as well. INCONCLUSIVE if the report cannot
    be injected without changing a frozen asset, the actor harness will not run the pinned build, or the arm-0
    baseline turns out non-comparable and no clean control run is possible within budget — say exactly what blocked it.
budget: >
  1 session. Up to 9 fresh actor runs: arms 1 and 2 x G1/G2/G3 (6), plus an optional arm-0 harness control x G1/G2/G3
  (3) only if step 4 needs it. Retry a run once only for an environment failure, never for an agent mistake. Read at
  most 10 product files (only to wire has()/getCss() into the arm1 report). n = 1 per task per arm, as in E-007: the
  verdict is a directional L3 signal, not a statistic — if the three arms are not clearly separated, that is
  INCONCLUSIVE, not a forced call.
stop_when:

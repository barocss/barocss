outcomes:
  O1:
    status: active
    statement: >
      An AI agent can change the styling of a running BaroCSS page and confirm
      the result matches its intent, using the smallest possible
      BaroCSS-specific surface.
    why: The smallest end-to-end slice of Human ↔ AI ↔ UI that exercises BaroCSS's runtime role.
    done_when: >
      L3 evidence that a real agent completes modify+verify on a realistic page,
      and every BaroCSS change made for it was proven necessary (gap K-id cited).
  O2:
    status: candidate
    statement: An AI generates new UI with BaroCSS classes that render as intended on the first try.
  O3:
    status: candidate
    statement: An AI can explain why an existing element looks the way it does (styling provenance).

knowledge:
  proven:
    - id: K1
      level: L1
      fact: >
        External code can change DOM classes with standard DOM APIs; BrowserRuntime
        (observe(document.body, {scan:true})) picks up the mutation and generates CSS.
      caveat: Scripted manual run, uncommitted. Superseded by K3 (L3).
    - id: K2
      level: L2
      fact: astToJson serializes BaroCSS AST to JSON (branch codex/pr-feature-evidence, 91f027c, unmerged).
      caveat: Shows machine-readable serialization only. Not AI understanding, not shown to be needed by any scenario.
    - id: K3
      level: L3
      fact: >
        E-001: a real LLM agent (claude -p, claude-opus-4-8, only Playwright MCP
        browser tools, fresh context per task) changed styling of a live BaroCSS
        page by editing classes and verified it correctly on 4/4 Tailwind-vocabulary
        tasks (color, padding/radius, responsive grid, arbitrary text-[42px]).
        Claims matched the hidden grader 4/4. No BaroCSS-specific help was needed.
      caveat: >
        n=1 per task, one strong model. Every class it wrote resolved, so no-op
        classes (U2) and timing (U3) were not exercised. T2 was verified by screenshot only.
        Evidence: .ai/evidence/E-001/.
    - id: K4
      level: L1
      fact: >
        BaroCSS fails silently in three distinct ways for Tailwind v4 classes:
        (a) empty rule, no warning: text-balance, text-shadow-sm emit ".cls { }";
        (b) rule with an undefined var: aspect-video emits aspect-ratio: var(--aspect-ratio-video), which computes to auto;
        (c) no rule plus console.warn ("ast is empty" / "Unknown utility class"): rounded-4xl, [prop:value] arbitrary properties.
        Also no computed effect: rounded-xs, shadow-xs, blur-xs, text-pretty, rotate-x-*, perspective-*,
        bg-(--var), outline-hidden, wrap-anywhere, mask-*, bg-radial/conic.
        Arbitrary values work: aspect-[16/9], rounded-[2rem], text-[42px].
      caveat: >
        Strategy hand probe (Playwright + E-001 page, computed style vs plain element,
        stylesheet scan, console capture), 2026-09-24, not committed. Not yet shown to hurt an agent.
  disproven: []
  working_assumptions:     # L0; plausible but untested, don't treat as proven
    - Natural-language reasoning doesn't belong inside BaroCSS.
    - Visual/semantic verification belongs to browser/agent tooling.
    - AI-specific BaroCSS APIs are not yet shown to be needed.
  unknown:                 # seeds for STRATEGY; unordered, not a backlog
    - id: U1
      q: >
        Partly answered by K3 (simple tasks succeed). Open: harder tasks, weaker models.
    - id: U2
      q: >
        When an agent writes a class BaroCSS can't resolve (typo, unsupported
        utility, bad arbitrary value), can it find out using only browser tooling?
        K4 shows three silent modes on natural Tailwind v4 classes; only mode (c)
        warns. Being tested by E-002.
    - id: U3
      q: When is a runtime-generated rule actually applied? Can an agent tell "not yet applied" from "never will be"?
    - id: U4
      q: Where does BaroCSS behavior differ from the Tailwind knowledge models already have, and do those differences cause agent errors?

decisions:
  - id: D1
    date: 2026-09-24
    decision: >
      Adopted Strategy/Execution context isolation with a single handoff file
      (.ai/EXPERIMENT.yaml). This replaces the role-based worker organization and
      the lint/test-driven task-selection loop.
    why: >
      Previous runs showed role overhead, easy-task bias, self-confirming loops,
      and anchoring on adjacent technical work.
  - id: D2
    date: 2026-09-24
    decision: >
      Retired the "AI-Interaction Infrastructure" roadmap (AST enhancement, AI
      APIs, component catalog, JSON formats).
    why: It prescribed solutions before any evidence, and it produced the astToJson drift.
  - id: D3
    date: 2026-09-24
    decision: >
      Froze AST work. No jsonToAst, round-trip, or AST metadata unless an
      experiment shows an agent scenario needs it.
    why: K2 caveat.
  - id: D4
    date: 2026-09-24
    decision: >
      Only Strategy accepts experiments and merges experiment PRs, after its own
      review of the frozen criteria, evidence, diff, CI, and proposed verdict.
      Execution never merges. Strategy may auto-integrate its own .ai/-only PRs
      once .ai/check.py passes and CI is green. No human review is required.
    why: Keeps builder and judge separate without putting a human in the loop.

  - id: D5
    date: 2026-09-24
    decision: E-001 targets U1, a real-agent baseline, before any guessed gap (U2-U4).
    why: >
      Guessed gaps risk invent-then-solve. U1 shows real failure points, can
      end with "no BaroCSS code needed", and upgrades K1 from L1 (scripted) to L3.

  - id: D6
    date: 2026-09-24
    decision: >
      Accepted E-001 PROVEN (K3). E-002 targets U2 with real K4 no-op classes, using
      the same actor and prompt so that the only thing that changes is whether the
      class resolves. K4 parity gaps are not work items until an agent scenario shows
      they cause failures.
    why: >
      E-001 left U2 untested. K4 makes it testable on realistic classes, and the result
      can end with "no BaroCSS signal needed".


# EXECUTION may change only `status` and `result` (contract is frozen; .ai/check.py enforces).
# STRATEGY alone writes `review` and sets status: evaluated.
# status: none | ready | running | done | blocked | evaluated
# While ready/running/done/blocked, the authoritative copy is on `branch` (see AGENTS.md §1).
# Previous contracts and results: git log -p -- .ai/EXPERIMENT.yaml
status: ready

id: E-004
outcome: O1
branch: ai/E-004-live-colour-token
question: >
  Re-runs E-003's agent phase on the one theme task that config can satisfy (K6). When a styling
  task needs a new colour token rather than a class edit, can a real LLM agent using only generic
  browser tools add that token through BaroCSS in the live page, when the page keeps its
  BrowserRuntime in a module-scoped variable? Does an app-exposed runtime change the outcome or its cost?
  Reason to re-verify: E-003 was blocked in self-test by Y2 (K6), so it made no agent runs.
decision_it_informs: >
  If both arm A runs pass, live theme edits need no BaroCSS surface and no app help, at least for colour
  tokens. O1 is then met with zero BaroCSS changes (K3, K5, K6, this), and Strategy considers marking O1
  done and moving to O2/O3. If arm A fails and arm B passes, the gap is reaching the runtime instance.
  The owner is APP by default, and the next contract tests whether any BaroCSS-side handle is needed.
  If arm B also fails, the recorded blocking step names the owner: discoverability of updateConfig or
  config semantics (BAROCSS), or agent error (AGENT).
hypothesis: >
  Arm B passes: the agent finds window.baroRuntime and learns updateConfig from the bundle. Arm A is
  harder. The agent either imports the CDN module and starts a second runtime with an extended theme
  (a pass, per K6), or falls back to bg-[#5B21B6] and honestly reports that the token was not added.
builds_on: [K3, K5, K6, U5]
scenario: >
  Pages: E-003's index-A.html (runtime module-scoped) and index-B.html (plus `window.baroRuntime = runtime;`),
  copied unchanged. The actor is the E-002 actor with the model pinned to claude-opus-4-8[1m]. Its prompt is
  word for word E-003's: "The page is styled with BaroCSS, a runtime utility-class CSS engine with
  Tailwind-compatible class names. Make the change through BaroCSS in the live page (its class names and its
  theme configuration), not with inline styles or hand-written CSS. Then verify the result and report whether
  the task is done."
  Task Y1, word for word E-003's: Add a `brand` color (#5B21B6) to the page's BaroCSS theme so that `bg-brand`
  works, and use it for the Save button's background.
  Runs: arm A twice (A1, A2, each a fresh context), arm B once. Realism limit as in E-003: live-page path only.
method: >
  1. Copy E-003's pages, grader.js and grader-selftest.mjs into .ai/evidence/E-004/ unchanged, except that the
     self-test gates only on Y1. Y2 expectations are dropped, not edited. Rerun the self-test before any agent
     run and commit its output. It must show: baseline, bg-brand alone and bg-[#5B21B6] fail Y1; the inline-CSS
     and <style> controls fail through the detector; arm B's updateConfig theme.extend call passes Y1 with no
     regression.
  2. Adapt E-002's run.mjs to take the arm (page) and the run label as arguments. The actor setup is otherwise
     E-002's: a fresh context per run, an empty cwd, only the Playwright MCP tools, and the server allowlisted to
     the page and dist/cdn. Commit the runner before any agent run.
  3. Grade with E-003's Y1 rule at 1024px. Y1 passes when the save-button classList contains `bg-brand`, its
     computed backgroundColor is rgb(91, 33, 182), there is no regression on any snapshotted property, and the
     detector finds no raw-CSS route. Passing a theme or config object to a BaroCSS API (updateConfig, a new
     BrowserRuntime or createContext with config) is a BaroCSS route.
  4. For each run record: the route (class/arbitrary value | page runtime via global | second runtime via import |
     raw CSS | none); how it discovered the API (page source, bundle fetch or search, window scan, prior
     knowledge), with call numbers; each config call it made; how it verified; its final claim; the grader
     result, including regressions; whether claim and grader agree; and for any failure or disagreement a
     proposed owner (BAROCSS | BROWSER | AGENT | APP) with a one-line cause. Also record cost and turns.
allowed:
  actions:
    - "build packages/barocss-browser locally (dist is gitignored; nothing committed)"
    - "serve the repo root on localhost; drive a browser"
    - "copy E-003 pages, grader and self-test, and adapt E-002's runner, into .ai/evidence/E-004/"
    - "read packages/barocss-browser or packages/barocss source only to classify a route or failure"
    - "spawn one fresh agent context per run as the actor (3 runs)"
  paths: [".ai/evidence/E-004/"]
  product_code: false
non_goals:
  - Exposing the runtime, adding a global, registry or discovery API, or changing updateConfig in product code
  - Making rounded-* read theme.borderRadius, fixing {DEFAULT} colour objects, or any parity fix
  - Hinting where the runtime lives or that updateConfig exists, or changing the prompt or task text
  - Other tasks (including radius), other models, or source-file config editing
  - Editing pages, grader or runner after seeing agent results
evidence:
  level_required: L3
  proves_yes: >
    Both arm A runs pass Y1 through a BaroCSS config route with no regression, and both final claims agree
    with the grader.
  proves_no: >
    At least one arm A run fails Y1 because the agent could not reach or use BaroCSS theme configuration with
    generic browser tools. The tool calls record the blocking step, and arm B's result shows whether an
    app-exposed runtime removes the block.
budget: >
  1 session. Three agent runs (A1, A2, B). Retry once only for environment failures, not for agent mistakes.
  Read ≤ 10 product files.
stop_when:
  - All three runs are recorded with grader results.
  - The Y1-only self-test fails any expectation in step 1 → blocked, and record which one.
  - No independent agent actor can be run → blocked, and say what is missing.
  - The grader would have to change after an agent run → record it in side_notes, don't change the grader.


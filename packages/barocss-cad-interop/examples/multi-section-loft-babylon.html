<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Compatible multi-section lofts in Babylon.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1020px; margin: 20px auto; }
  canvas { display: block; border: 1px solid #44617d; }
  pre { white-space: pre-wrap; font-size: 13px; }
  button { margin: 8px 8px 8px 0; padding: 7px 12px; }
</style>
<main>
  <h1>Compatible multi-section lofts in Babylon.js</h1>
  <p>Five CAD #952 native loft Surfaces appear as spaced display meshes. The valid coincident-section loft refuses collapsed preview triangles.</p>
  <canvas id="view" width="960" height="520"></canvas>
  <button id="reject">Try invalid candidates</button><button id="dispose">Dispose loaded display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Engine } from '@babylonjs/core/Engines/engine.js';
  import { Scene } from '@babylonjs/core/scene.js';
  import { Camera } from '@babylonjs/core/Cameras/camera.js';
  import { FreeCamera } from '@babylonjs/core/Cameras/freeCamera.js';
  import { Mesh } from '@babylonjs/core/Meshes/mesh.js';
  import { Color3, Color4 } from '@babylonjs/core/Maths/math.color.js';
  import { Vector3 } from '@babylonjs/core/Maths/math.vector.js';
  import { parseBaroCadSource } from '../dist/native.js';
  import { BaroCADBabylonLoader } from '../dist/babylon.js';

  const options = { sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001 };
  const cases = [
    { key: 'two_sections_nonunit_v', id: 'linear_loft_surface', hash: '9b508113fd30f963acd8bd6175d17f6b1558b4b6f57fae76bac39ae5cb1b449b', color: 0x00ccff, x: 0 },
    { key: 'five_rational_quarter_sections', id: 'quarter_loft_surface', hash: 'afdfeef73d57afd3660888678e9e3d204d90f8aa53308e14dc8528afe5725faf', color: 0xff00dd, x: 0.014 },
    { key: 'compatible_cubic_sections', id: 'cubic_loft_surface', hash: 'de952c0fe0befbceb9950149d7599c796823cc226350f3167a770816e725cc41', color: 0xffff00, x: 0.028 },
    { key: 'middle_section_pole_edit', id: 'quarter_loft_surface', hash: '0f07e043cc5ca171435d022e220663164738ae83d87be8bcc671b0ef2bfff506', color: 0x00ff55, x: 0.042 },
    { key: 'maximum_15_sections_16_poles', id: 'maximum_loft_surface', hash: '0511f23a7fe72f2ef135e7f4881a994536cc2f8df4599d4ef230b2a55d2eb03f', color: 0xff8844, x: 0.056 },
    { key: 'coincident_sections', id: 'coincident_loft_surface', hash: '29b9b794ffdea6dafc312ec1f026a7e5615945a58653d3c428d4d39d8c42d5bd', refuse: true },
  ];
  const status = document.querySelector('#status');
  const canvas = document.querySelector('#view');
  const engine = new Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  const scene = new Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = new Color4(20 / 255, 34 / 255, 54 / 255, 1);
  const callerMarker = new Mesh('caller-marker', scene);
  // Only host Mesh poses and camera change; original source XYZ remains unchanged.
  const camera = new FreeCamera('camera', new Vector3(0.030, 0.022, 0.08), scene);
  camera.upVector = new Vector3(0, 1, 0);
  camera.setTarget(new Vector3(0.030, 0.002, 0));
  camera.mode = Camera.ORTHOGRAPHIC_CAMERA;
  camera.orthoLeft = -0.042;
  camera.orthoRight = 0.042;
  camera.orthoTop = 0.021;
  camera.orthoBottom = -0.021;
  camera.minZ = 0.001;
  camera.maxZ = 0.2;
  scene.activeCamera = camera;
  const loader = new BaroCADBabylonLoader(scene, options);
  const accepted = [];
  const sources = new Map();
  const pixels = () => {
    const data = new Uint8Array(960 * 520 * 4);
    const gl = canvas.getContext('webgl2');
    gl.readPixels(0, 0, 960, 520, gl.RGBA, gl.UNSIGNED_BYTE, data);
    return data;
  };
  const hashPixels = data => data.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const visiblePixels = data => {
    let count = 0;
    for (let i = 0; i < data.length; i += 4) {
      if (data[i] !== 20 || data[i + 1] !== 34 || data[i + 2] !== 54) count++;
    }
    return count;
  };
  const sha256 = async bytes => [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))]
    .map(byte => byte.toString(16).padStart(2, '0')).join('');
  try {
    if (!(canvas.getContext('webgl2') instanceof WebGL2RenderingContext)) throw new Error('WebGL2 required');
    let coincidentRefused = false;
    for (const item of cases) {
      const url = new URL(`./multi-section-loft-babylon-data/${item.key}.barocad`, location.href).href;
      if (item.refuse) {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${item.key}`);
        const bytes = await response.arrayBuffer();
        if (await sha256(bytes) !== item.hash) throw new Error(`Source SHA mismatch: ${item.key}`);
        const source = new TextDecoder().decode(bytes);
        sources.set(item.key, source);
        let neutralRefused = false, babylonRefused = false;
        try { parseBaroCadSource(source, options); } catch (error) { neutralRefused = /Collapsed or nonfinite preview triangle/.test(String(error)); }
        try { loader.parse(source); } catch (error) { babylonRefused = /Collapsed or nonfinite preview triangle/.test(String(error)); }
        if (!neutralRefused || !babylonRefused) throw new Error('Coincident native loft must refuse collapsed display');
        coincidentRefused = true;
        continue;
      }
      const display = await loader.loadAbortable(url, {});
      const source = display.source;
      if (await sha256(new TextEncoder().encode(source)) !== item.hash) throw new Error(`Loaded source SHA mismatch: ${item.key}`);
      sources.set(item.key, source);
      const neutral = parseBaroCadSource(source, options);
      if (neutral.surfaces.length !== 1 || neutral.surfaces[0].surfaceId !== item.id)
        throw new Error(`Native loft Surface mismatch: ${item.key}`);
      const mesh = display.meshes[0];
      if (display.meshes.length !== 1 || !(mesh instanceof Mesh) || mesh.metadata.barocss.surfaceId !== item.id ||
          mesh.metadata.barocss.coordinateSystem !== 'right-handed-y-up')
        throw new Error(`Expected one native-bound Babylon Mesh: ${item.key}`);
      for (const [kind, values] of [['position', neutral.surfaces[0].mesh.positions],
        ['normal', neutral.surfaces[0].mesh.normals]]) {
        const got = mesh.getVerticesData(kind);
        if (got.length !== values.length || got.some((value, index) => !Object.is(value, values[index])))
          throw new Error(`${kind} mismatch: ${item.key}`);
      }
      const indices = mesh.getIndices(), originalIndices = neutral.surfaces[0].mesh.indices;
      if (indices.length !== originalIndices.length || indices.some((value, index) => value !== originalIndices[index]))
        throw new Error(`index mismatch: ${item.key}`);
      const nativeParameters = mesh.metadata.barocss.nativeParameters, originalParameters = neutral.surfaces[0].mesh.parameters;
      if (nativeParameters.length !== originalParameters.length ||
          nativeParameters.some((value, index) => !Object.is(value, originalParameters[index])))
        throw new Error(`native CAD UV mismatch: ${item.key}`);
      mesh.material.diffuseColor = new Color3((item.color >> 16) / 255, ((item.color >> 8) & 255) / 255, (item.color & 255) / 255);
      mesh.material.emissiveColor = mesh.material.diffuseColor.scale(0.35);
      mesh.position.x = item.x;
      accepted.push({ key: item.key, source, display, mesh, nativeId: item.id,
        vertices: neutral.surfaces[0].report.vertexCount, triangles: neutral.surfaces[0].report.triangleCount });
    }
    if (accepted.length !== 5 || !coincidentRefused) throw new Error('Expected five Meshes and one real refusal');
    engine.runRenderLoop(() => scene.render());
    await scene.whenReadyAsync();
    engine.stopRenderLoop();
    const individuallyVisible = {};
    for (const item of accepted) {
      for (const other of accepted) other.mesh.isVisible = other === item;
      scene.render();
      individuallyVisible[item.key] = visiblePixels(pixels());
      if (!individuallyVisible[item.key]) throw new Error(`No visible Mesh pixels: ${item.key}`);
    }
    for (const item of accepted) item.mesh.isVisible = true;
    scene.render();
    const frame = pixels();
    const evidence = { target: 'Babylon.js 9.29.0 WebGL2', webgl2: true,
      rightHanded: scene.useRightHandedSystem, sourceFrame: 'authored XYZ, host angled +Z camera',
      unitsPerMillimeter: 0.001, cases: accepted.map(({ key, nativeId, vertices, triangles }) =>
        ({ key, nativeId, vertices, triangles, meshCount: 1 })),
      coincidentNativeSourceFetched: sources.has('coincident_sections'), coincidentDisplayRefused: true,
      individuallyVisible, combinedPixels: visiblePixels(frame), pixelHash: hashPixels(frame),
      callerMarkerRetained: scene.meshes.includes(callerMarker) };
    window.__baroMultiSectionLoftBabylonEvidence = evidence;
    status.textContent = JSON.stringify(evidence, null, 2);
    const beforeSources = new Map(sources);
    document.querySelector('#reject').onclick = () => {
      let refused = 0;
      for (const candidate of [
        () => loader.parse('@model invalid {}'),
        () => new BaroCADBabylonLoader(scene, { ...options, sourceVersion: 1 }).parse(accepted[0].source),
        () => new BaroCADBabylonLoader(scene, { ...options, countU: 1 }).parse(accepted[0].source),
        () => loader.parse(sources.get('coincident_sections')),
        () => { scene.useRightHandedSystem = false; try { loader.parse(accepted[0].source); } finally { scene.useRightHandedSystem = true; } },
      ]) { try { candidate(); } catch { refused++; } }
      scene.render();
      evidence.invalidCandidatesRefused = refused;
      evidence.acceptedMeshesRetained = accepted.every(item => scene.meshes.includes(item.mesh) && !item.mesh.isDisposed());
      evidence.acceptedSourcesRetained = cases.every(item => sources.get(item.key) === beforeSources.get(item.key));
      evidence.acceptedPixelsRetained = hashPixels(pixels()) === evidence.pixelHash;
      status.textContent = JSON.stringify(evidence, null, 2);
    };
    document.querySelector('#dispose').onclick = () => {
      for (const item of accepted) { item.display.dispose(); item.display.dispose(); }
      scene.render();
      evidence.disposed = accepted.every(item => item.mesh.isDisposed() && !scene.meshes.includes(item.mesh));
      evidence.callerMarkerRetained = !callerMarker.isDisposed() && scene.meshes.includes(callerMarker);
      evidence.callerSceneAndEngineLive = !scene.isDisposed && engine.getRenderingCanvas() === canvas;
      evidence.nativeSourcesRetained = cases.every(item => sources.get(item.key) === beforeSources.get(item.key));
      status.textContent = JSON.stringify(evidence, null, 2);
    };
  } catch (error) {
    for (const item of accepted) item.display.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroMultiSectionLoftBabylonError = String(error);
  }
</script>
</html>

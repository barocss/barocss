# Handoff between one STRATEGY session and one EXECUTION session.
# STRATEGY writes every field above `result` and sets status: ready.
# EXECUTION may change only `status` and `result` (contract is frozen; .ai/check.py enforces).
# STRATEGY alone writes `review` and sets status: evaluated.
# status: none | ready | running | done | blocked | evaluated
# While ready/running/done/blocked, the authoritative copy is on `branch` (see AGENTS.md §1).
# Previous contracts and results: git log -p -- .ai/EXPERIMENT.yaml
status: ready

id: E-007
outcome: O2
branch: ai/E-007-gen-parity
question: >
  When a real LLM agent builds a new UI section in a live BaroCSS page (apps/barocss-site on the vite dev server)
  using only generic browser tools, how many of the class tokens it naturally writes are Tailwind v4 classes that
  BaroCSS silently fails to apply (K4 parity misses), and does the finished section end with every miss either
  replaced or named in a final claim that agrees with the grader?
  New: K5 measured detection on modify tasks designed to hit known no-ops; nothing yet measures how often natural
  generation hits them.
decision_it_informs: >
  All three runs end with no unnamed parity miss and claims agree → O2's first-try/verify loop needs no BaroCSS
  parity work now; first-try miss counts are recorded as its cost, and Strategy moves to O3 or a weaker actor (U1).
  A run whose final section keeps a parity miss its "done" claim does not name is the evidence for a BAROCSS gap in
  class → rule resolution, and Strategy contracts the minimum fix for the observed class family (one capability).
  Frequent first-try misses that are all caught rank parity as a cost item by frequency, not a need. Tokens Tailwind
  v4 itself does not resolve are AGENT-owned and counted separately.
hypothesis: >
  Most tokens are core utilities BaroCSS resolves. Each run writes 0-3 parity misses on first try (text-balance/pretty,
  size-*, *-xs, newer v4 names), and the agent's own verification catches misses on visible properties but misses
  cosmetic ones (text wrapping, shadows), so a "done" claim with an unnamed miss is plausible in at least one run.
builds_on: [K3, K4, K5, K9, U4]
scenario: >
  App: apps/barocss-site unchanged, booted by baroStart({config:{preflight:true}}), served by `vite` dev, exactly
  E-006's environment (env.mjs proxy, app origin only, every external request blocked). Actor: E-006's, unchanged
  (claude-opus-4-8[1m], fresh context per run, empty cwd, only the Playwright MCP tools). Prompt, word for word:
  "The page is styled with BaroCSS, a runtime utility-class CSS engine with Tailwind-compatible class names. Build the
  requested UI in the live page using BaroCSS class names only, not inline styles or hand-written CSS. Then verify
  that it renders as you intended and report whether the task is done." followed by the task.
  G1: Add a pricing section below the hero with three plan cards (Free, Pro, Team); each has a name, a price, a short
  feature list and a call-to-action button, and the Pro card is visually highlighted as recommended.
  G2: Add a newsletter sign-up card below the hero: a heading, one line of supporting text, an email field with a
  subscribe button beside it, and a small helper line under the field; it should look polished and fit the page.
  G3: Add a testimonials section below the hero: three quote cards in a responsive grid (one column on small screens,
  three on wide ones), each with the quote, the person's name, their role and a round avatar placeholder.
  Runs: G1, G2, G3, one fresh context each.
method: >
  1. Build packages locally, serve apps/barocss-site with `vite`, unchanged; no build output is committed. Copy
     E-006's env.mjs and run.mjs into .ai/evidence/E-007/; change the runner only to take G1-G3 and the prompt above.
  2. Write a deterministic token classifier (L2): for each class token, TW = Tailwind v4 (tailwindcss 4.1.13, the
     repo's devDependency, default theme) emits a rule for it; BC = the page's BaroCSS runtime applies it: a rule
     exists, has at least one declaration, and every var() it uses without a fallback is defined on the page.
     Variants: classify the full token; if it fails only because of the variant, record that. Classes: RESOLVED (TW and
     BC), PARITY-MISS (TW, not BC), AGENT (not TW; includes BaroCSS-only and invented names), BC-ONLY noted within AGENT.
     E-002's noop-probe may be reused. Self-test before any agent run (gating, output committed): flags as PARITY-MISS
     text-balance, text-pretty, aspect-video, rounded-4xl and E-002's four classes; flags as RESOLVED bg-blue-600, p-4,
     hover:bg-blue-700, md:grid-cols-3, aspect-[16/9], rounded-[2rem], text-[42px]; flags as AGENT a made-up token.
  3. Grader per run: new section = elements absent from the baseline DOM, plus class tokens added to existing
     elements. Pass = the section exists and covers the task's named parts (checked by the grader against a per-task
     list of required parts, fixed before any run: G1 three cards with a highlighted one; G2 an email input and a
     button; G3 three cards with a grid that is one column at 375px and three at 1280px), no inline style attribute or
     raw CSS write (E-005/E-006 detector), and zero PARITY-MISS tokens remain in it. A remaining miss that the final
     claim names (says it has no effect, or reports not done) makes the claim agree though the run fails.
     Commit the classifier, grader and runner before any agent run.
  4. Record per run: first-try tokens (the class tokens in the agent's first DOM-inserting tool call, parsed from its
     code) with their class counts; final section tokens with class counts; each PARITY-MISS: token, first-try or
     later, whether the agent detected it (changed or removed it, or named it) and how (computed style, screenshot,
     CSS text); grader result; final claim and whether it agrees; turns and cost. Aggregate PARITY-MISS tokens by family.
allowed:
  actions:
    - "build packages locally (dist output is gitignored or left uncommitted)"
    - "run apps/barocss-site's vite dev server on localhost; drive a browser"
    - "run tailwindcss 4.1.13 from the repo's node_modules locally as the classification reference"
    - "copy and adapt E-006's env and runner, and E-002's noop-probe, into .ai/evidence/E-007/"
    - "read packages/barocss or packages/barocss-browser source only to classify a token or a failure"
    - "spawn one fresh agent context per run as the actor (3 runs)"
  paths: [".ai/evidence/E-007/"]
  product_code: false
non_goals:
  - Fixing any parity miss or editing apps/barocss-site or product code
  - Hinting at K4 gaps, Tailwind v4 differences, verification methods or any class name in the prompt or environment
  - Changing the prompt, tasks, model or tools after the first run; weaker models (U1); a production-build arm
  - Grading visual design quality beyond the per-task required parts
  - Editing the classifier, grader or runner after seeing agent results
evidence:
  level_required: L3
  proves_yes: >
    All three runs end with zero PARITY-MISS tokens in the new section that the final claim does not name, and all
    three claims agree with the grader. First-try PARITY-MISS counts recorded.
  proves_no: >
    At least one run ends with a PARITY-MISS token in the new section, a final claim of done that does not name it,
    and the tool calls show whether the agent checked the property that token should have set.
budget: >
  1 session. Three agent runs (G1, G2, G3). Retry once only for environment failures, not for agent mistakes.
  Read at most 10 product files.
stop_when:
  - All three runs are recorded with grader results and token classifications.
  - A gating self-test expectation in step 2 fails → blocked, and record which one.
  - The site does not render styled on the dev server before any agent run → blocked, and say why.
  - No independent agent actor can be run → blocked, and say what is missing.
  - The classifier or grader would have to change after an agent run → record it in side_notes, don't change it.


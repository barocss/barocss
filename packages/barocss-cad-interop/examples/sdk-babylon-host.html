<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Complete native Surface source in Babylon.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 840px; margin: 24px auto; padding: 0 16px; }
  canvas { display: block; width: 800px; height: 500px; border: 1px solid #44617d; }
  button { margin: 12px 8px 12px 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; }
</style>
<main>
  <h1>Complete native Surface source in Babylon.js</h1>
  <p>One complete CAD file loads five native Surfaces through the public SDK entry.
    The original source and native IDs remain available beside the display.</p>
  <div id="view"><canvas id="canvas" width="800" height="500"></canvas></div>
  <button id="load">Load complete source</button>
  <button id="reject" disabled>Try invalid candidates</button>
  <button id="dispose" disabled>Dispose loaded display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module" src="./sdk-babylon-host.mjs"></script>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Table</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen p-8">
        <div class="max-w-6xl mx-auto">
            <div class="bg-white rounded-lg shadow">
                <div class="p-6 border-b border-gray-200">
                    <h1 class="text-2xl font-bold text-gray-900 mb-4">Data Table</h1>
                    <input
                        type="text"
                        id="filterInput"
                        placeholder="Search..."
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
                    />
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="border-b border-gray-200 bg-gray-50">
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Name</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Email</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Department</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Status</th>
                                <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700">Join Date</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- Rows will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
                <div class="px-6 py-4 border-t border-gray-200 text-sm text-gray-600">
                    <span id="recordCount">0</span> records
                </div>
            </div>
        </div>
    </div>

    <script>
        const data = [
            { name: 'Alice Johnson', email: 'alice@example.com', department: 'Engineering', status: 'Active', joinDate: '2023-01-15' },
            { name: 'Bob Smith', email: 'bob@example.com', department: 'Sales', status: 'Active', joinDate: '2023-03-22' },
            { name: 'Carol Davis', email: 'carol@example.com', department: 'Marketing', status: 'Inactive', joinDate: '2022-11-10' },
            { name: 'David Wilson', email: 'david@example.com', department: 'Engineering', status: 'Active', joinDate: '2023-06-05' },
            { name: 'Eve Martinez', email: 'eve@example.com', department: 'HR', status: 'Active', joinDate: '2023-02-28' },
            { name: 'Frank Brown', email: 'frank@example.com', department: 'Finance', status: 'Active', joinDate: '2023-04-12' },
            { name: 'Grace Lee', email: 'grace@example.com', department: 'Engineering', status: 'Active', joinDate: '2023-05-30' },
            { name: 'Henry Taylor', email: 'henry@example.com', department: 'Operations', status: 'Inactive', joinDate: '2022-12-20' },
        ];

        const filterInput = document.getElementById('filterInput');
        const tableBody = document.getElementById('tableBody');
        const recordCount = document.getElementById('recordCount');

        function renderTable(filteredData) {
            tableBody.innerHTML = filteredData.map(row => `
                <tr class="border-b border-gray-200 hover:bg-gray-50 transition">
                    <td class="px-6 py-4 text-sm text-gray-900">${escapeHtml(row.name)}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(row.email)}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(row.department)}</td>
                    <td class="px-6 py-4 text-sm">
                        <span class="px-2 py-1 rounded-full text-xs font-medium ${row.status === 'Active' ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-800'}">
                            ${escapeHtml(row.status)}
                        </span>
                    </td>
                    <td class="px-6 py-4 text-sm text-gray-600">${escapeHtml(row.joinDate)}</td>
                </tr>
            `).join('');
            recordCount.textContent = filteredData.length;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function filterData(query) {
            const lowerQuery = query.toLowerCase();
            return data.filter(row =>
                Object.values(row).some(value =>
                    value.toLowerCase().includes(lowerQuery)
                )
            );
        }

        filterInput.addEventListener('input', (e) => {
            const filtered = filterData(e.target.value);
            renderTable(filtered);
        });

        renderTable(data);
    </script>
</body>
</html>

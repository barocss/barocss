<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>BaroCSS CDN test</title>
</head>
<body>
  <h1 class="text-2xl font-bold text-gray-800">Hello BaroCSS</h1>
  <button id="late-btn">Click me</button>

  <script type="module">
    import { baroStart } from 'https://cdn.jsdelivr.net/npm/@barocss/browser@0.10.1/dist/cdn/barocss.js'
    baroStart()

    setTimeout(() => {
      document.getElementById('late-btn').className = 'bg-blue-600 text-white px-4 py-2 rounded-lg'
    }, 1000)
  </script>
</body>
</html>

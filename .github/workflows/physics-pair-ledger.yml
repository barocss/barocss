name: Physics pair lateral response ledger
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/pair-response-ledger.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-pair-response-ledger.mjs'
      - '.github/workflows/physics-pair-ledger.yml'
  workflow_dispatch:
jobs:
  pair-response:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-pair
      - name: Run original b0/b1 and b1/b2 lateral response audit
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-pair-response-ledger.mjs | tee /tmp/physics1572-pair/results.jsonl
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-pair-response
          path: /tmp/physics1572-pair/results.jsonl
          if-no-files-found: ignore

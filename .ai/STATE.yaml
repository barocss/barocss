outcomes:
  O1:
    status: active
    statement: >
      An AI agent can change the styling of a running BaroCSS page and confirm
      the result matches its intent, using the smallest possible
      BaroCSS-specific surface.
    why: The smallest end-to-end slice of Human ↔ AI ↔ UI that exercises BaroCSS's runtime role.
    done_when: >
      L3 evidence that a real agent completes modify+verify on a realistic page,
      and every BaroCSS change made for it was proven necessary (gap K-id cited).
  O2:
    status: candidate
    statement: An AI generates new UI with BaroCSS classes that render as intended on the first try.
  O3:
    status: candidate
    statement: An AI can explain why an existing element looks the way it does (styling provenance).

knowledge:
  proven:
    - id: K2
      level: L2
      fact: astToJson serializes BaroCSS AST to JSON (branch codex/pr-feature-evidence, 91f027c, unmerged).
      caveat: Serialization only. Not AI understanding, not shown to be needed by any scenario.
    - id: K3
      level: L3
      fact: >
        E-001: a real LLM agent (claude -p, claude-opus-4-8, only Playwright MCP
        browser tools, fresh context per task) changed styling of a live BaroCSS
        page by editing classes and verified it correctly on 4/4 Tailwind-vocabulary
        tasks (color, padding/radius, responsive grid, arbitrary text-[42px]).
        Claims matched the hidden grader 4/4. No BaroCSS-specific help was needed.
        Supersedes K1 (external DOM class edits are picked up by BrowserRuntime).
      caveat: "n=1 per task, one strong model, all classes resolved. Evidence: .ai/evidence/E-001/."
    - id: K4
      level: L1
      fact: >
        BaroCSS fails silently in three ways for Tailwind v4 classes:
        (a) empty rule, no warning: text-balance, text-pretty, text-wrap, text-nowrap, text-shadow-*;
        (b) rule with an undefined var: aspect-video (var(--aspect-ratio-video)), font-sans (var(--font-family-sans));
        (c) no rule plus console warning: rounded-4xl ("ast is empty"), [prop:value] arbitrary properties ("Unknown utility class").
        Also no computed effect: rounded-xs, shadow-xs, blur-xs, rotate-x-*, perspective-*,
        bg-(--var), outline-hidden, wrap-anywhere, mask-*, bg-radial/conic.
        Arbitrary values on known utilities work: aspect-[16/9], rounded-[2rem], text-[42px], bg-[#hex].
      caveat: >
        Hand probe 2026-09-24. The four E-002 classes and their recoveries are L2
        (.ai/evidence/E-002/selftest.json, noop-probe.json); the rest is L1. Parity gaps
        are not work items: K5 shows they did not cause false claims.
    - id: K5
      level: L3
      fact: >
        E-002: same actor/prompt as E-001, 4 tasks whose natural class is a K4 no-op
        (rounded-4xl, aspect-video, text-balance, text-shadow-sm). Claim = grader 4/4,
        no false "done"; every real no-op (17) was detected before the final report,
        mainly by reading computed style after each edit. Recovered only where an
        arbitrary value exists (X2 aspect-[16/9]); X1/X3/X4 honestly reported not-done.
        Detecting unresolved classes is AGENT-owned for this actor; no BaroCSS signal needed.
      caveat: >
        n=1 per task, one strong model. Silent empty rules cost turns ($1.74 X3 vs $0.21 X1)
        and one misdiagnosis (X4), not false claims. X3 premise false (intro 1 line at
        1024px). U3 staleness not shown. Evidence: .ai/evidence/E-002/.
    - id: K6
      level: L2
      fact: >
        E-003 self-test (no agent runs). Live theme edits: theme.extend.colors.brand makes bg-brand work,
        via page-exposed runtime.updateConfig and via a second BrowserRuntime({config}) imported from the CDN
        bundle, with no regression (theme deep-merges over defaults). theme.extend.borderRadius only emits
        :root --radius-*: rounded-* names are hard-coded staticUtility entries and the functional rounded
        has no theme key, so no config route can add rounded-4xl. Config has no plugin hook.
      caveat: >
        Only colors and borderRadius were probed. {DEFAULT: ...} colour objects throw in the bg handler.
        No agent evidence. Evidence: .ai/evidence/E-003/selftest.json, SUMMARY.md.
  disproven: []
  working_assumptions:     # L0; plausible but untested, don't treat as proven
    - Natural-language reasoning doesn't belong inside BaroCSS.
    - Visual/semantic verification belongs to browser/agent tooling.
    - AI-specific BaroCSS APIs are not yet shown to be needed.
  unknown:                 # seeds for STRATEGY; unordered, not a backlog
    - id: U1
      q: >
        K3/K5 cover a strong model on class-level tasks. Open: weaker/cheaper models
        (do they still verify via computed style and avoid false "done" on K4 no-ops?).
    - id: U3
      q: When is a runtime-generated rule actually applied? Can an agent tell "not yet applied" from "never will be"?
    - id: U4
      q: Where does BaroCSS behavior differ from the Tailwind knowledge models already have, and do those differences cause agent errors?
    - id: U5
      q: >
        Theme/config-level changes (new token, extended scale) need BaroCSS semantics, not
        just class edits. BrowserRuntime has updateConfig(), but a page usually holds the
        runtime in a module-scoped variable. Can an agent make such a change in a live page?
        K6: a colour token is reachable by config, even without the page instance; a radius token is not.
    - id: U6
      q: >
        Which theme namespaces actually drive class generation (K6: colors yes, borderRadius no)?
        Open until an agent scenario needs a non-colour token.

decisions:                 # D1-D8 compressed; full text in git log -p -- .ai/STATE.yaml
  - id: D1-D4
    date: 2026-09-24
    decision: >
      Strategy/Execution isolation via one handoff file; retired the AI-Interaction roadmap; froze AST work
      (K2) unless a scenario needs it; only Strategy accepts/merges experiments, and auto-merges its own
      .ai/-only PRs once check.py passes and CI is green.
    why: Role overhead, easy-task bias, self-confirming loops, solutions before evidence (astToJson drift).
  - id: D5-D7
    date: 2026-09-25
    decision: >
      Real-agent baseline first (E-001, K3), then silent no-ops (E-002, K5). Both PROVEN: class-level
      modify+verify needs zero BaroCSS surface; no "class resolved" signal, no parity work. O1's remaining
      question is theme/config-level edits (U5).
    why: Guessed gaps risk invent-then-solve; theme/config semantics are what only BaroCSS owns.
  - id: D8
    date: 2026-09-25
    decision: E-003 targets U5 over U1 (weaker models), with two arms, runtime module-scoped vs app-exposed.
    why: A weaker-model failure is AGENT-owned; U5 can end with "no surface needed" or split APP from BAROCSS.
  - id: D9
    date: 2026-09-25
    decision: >
      Accepted E-003 INCONCLUSIVE (K6), merged as evidence. The rounded-*/theme gap is not a work item yet:
      an arbitrary value (rounded-[2rem]) covers the visual need (K4), and no scenario shows a token is needed.
      Contracts must not pick a task whose natural class is a known K4 no-op unless that is the point.
    why: >
      E-003's Y2 was a known K4(c) class, which blocked the whole run. U5's reachability question is still
      open and still decides whether O1 needs any surface.

  - id: D10
    date: 2026-09-25
    decision: >
      E-004 re-runs E-003's agent phase with Y1 (colour token) only: arm A twice, arm B once, same pages,
      prompt and grader. Radius is dropped, not fixed.
    why: >
      U5 reachability still decides whether O1 needs any surface, and it can end with "no BaroCSS code
      needed". K6 shows Y1 is satisfiable, so the run cannot be blocked by config semantics again. A second
      arm A run guards the decisive arm against n=1 noise.


name: Physics point impulse momentum reference
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/point-momentum-reference.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-point-momentum-reference.mjs'
      - '.github/workflows/physics-point-momentum-reference.yml'
  workflow_dispatch:
jobs:
  independent-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-point-reference
      - name: Run test-only matched contact impulse momentum and torque audit
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-point-momentum-reference.mjs | tee /tmp/physics1572-point-reference/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-point-momentum-results
          path: /tmp/physics1572-point-reference/results.jsonl
          if-no-files-found: ignore

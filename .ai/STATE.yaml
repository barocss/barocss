knowledge:
  proven:
    - {id: K2, level: L2, fact: "astToJson (branch codex/pr-feature-evidence, unmerged) serializes AST; no scenario needs it."}
    - id: K3
      level: L3
      fact: >
        E-001: a real LLM agent (claude -p, claude-opus-4-8, only Playwright MCP tools, fresh context per
        task) edited classes on a live BaroCSS page and verified correctly 4/4 (color, padding/radius,
        responsive grid, text-[42px]); claims matched the hidden grader. No BaroCSS-specific help needed.
      caveat: "n=1 per task, one strong model, all classes resolved. Evidence: .ai/evidence/E-001/."
    - id: K4
      level: L1
      fact: >
        BaroCSS fails silently for some Tailwind v4 classes: empty rule (text-balance/pretty/wrap/nowrap,
        text-shadow-*), rule with an undefined var (aspect-video, font-sans), or no rule plus a console
        warning (rounded-4xl, [prop:value]). Also no effect: *-xs scales, rotate-x-*, perspective-*,
        bg-(--var), outline-hidden, wrap-anywhere, mask-*, bg-radial/conic. Arbitrary values on known
        utilities work (aspect-[16/9], rounded-[2rem], text-[42px], bg-[#hex]).
      caveat: >
        Hand probe 2026-09-24; E-002's four classes are L2 (.ai/evidence/E-002/). Parity gaps are not work
        items: K5 shows they did not cause false claims.
    - id: K5
      level: L3
      fact: >
        E-002: same actor/prompt as E-001, 4 tasks whose natural class is a K4 no-op. Claim = grader 4/4,
        no false "done"; all 17 real no-ops were detected before the final report, mainly via computed style.
        Recovered only where an arbitrary value exists (aspect-[16/9]); others honestly reported not-done.
        Detecting unresolved classes is AGENT-owned for this actor; no BaroCSS signal needed.
      caveat: >
        n=1 per task, one strong model. Silent empty rules cost turns ($1.74 vs $0.21) and one misdiagnosis,
        not false claims. Evidence: .ai/evidence/E-002/.
    - id: K6
      level: L2
      fact: >
        E-003: theme.extend.colors.brand via runtime.updateConfig makes bg-brand work with no regression (theme
        deep-merges over defaults). theme.extend.borderRadius only emits :root --radius-* (rounded-* names are
        hard-coded), so no config route adds rounded-4xl. Config has no plugin hook.
      caveat: "Only colors/borderRadius probed; {DEFAULT} colour objects throw. Evidence: .ai/evidence/E-003/."
    - id: K7
      level: L3
      fact: >
        E-004: same actor/prompt on fixture pages: agent added theme.extend.colors.brand live and used bg-brand,
        3/3 PASS, claims agree. Discovery: page source/exports/global, then updateConfig.toString().
      caveat: >
        Arm A passed via a second, non-observing runtime from the CDN URL (duplicate <style> ids) while claiming
        it was the page's. Fixtures had no existing config. Evidence: .ai/evidence/E-004/SUMMARY.md.
    - id: K8
      level: L2
      fact: >
        E-005 on apps/barocss-site (baroStart({config:{preflight:true}})). Vite dev: import() of the served BaroCSS
        module URL returns baroStart's runtime. updateConfig replaces the whole config, so a bare theme call drops
        preflight and regresses the page; config-preserving calls pass. Production build: no route (no global, no exports).
      caveat: "No agent runs. Evidence: .ai/evidence/E-005/SUMMARY.md, selftest.json."
    - id: K9
      level: L3
      fact: >
        E-006: same actor/prompt on apps/barocss-site's vite dev server, app-origin-only network. 3/3 read
        updateConfig's source (toString or /@fs TypeScript), passed a config-preserving object to the page's own
        runtime, used bg-brand: Y1 pass, 0 regressions, preflight kept, no duplicate runtime, claims agree.
        updateConfig's replace semantics did not block agents; no merge change indicated.
      caveat: >
        n=3, one strong model. 0/3 made the bare call, so drop-then-notice is unobserved. Dev server exposes repo
        source over /@fs; production has no route (K8). Evidence: .ai/evidence/E-006/SUMMARY.md, runs/.
  disproven: []
  working_assumptions:     # L0; plausible but untested, don't treat as proven
    - Natural-language reasoning doesn't belong inside BaroCSS.
    - Visual/semantic verification belongs to browser/agent tooling.
    - AI-specific BaroCSS APIs are not yet shown to be needed.
  unknown:                 # seeds for STRATEGY; unordered, not a backlog
    - id: U1
      q: Do weaker/cheaper models still verify via computed style and avoid false "done" on K4 no-ops (K3/K5)?
    - id: U3
      q: When is a runtime-generated rule actually applied? Can an agent tell "not yet applied" from "never will be"?
    - id: U4
      q: Where does BaroCSS behavior differ from the Tailwind knowledge models already have, and do those differences cause agent errors?
    - id: U5
      q: "Theme change on a production bundle with no exposed runtime (K8: no route). Open; no scenario needs it yet."
    - id: U6
      q: "Which theme namespaces drive class generation (K6: colors yes, borderRadius no)? Open until a scenario needs one."

decisions:                 # older entries compressed; full text in git log -p -- .ai/STATE.yaml
  - id: D1-D4
    date: 2026-09-24
    decision: >
      Strategy/Execution isolation via one handoff file; retired the AI-Interaction roadmap; froze AST work (K2)
      unless a scenario needs it; only Strategy accepts/merges experiments and its own .ai/-only PRs.
    why: Role overhead, easy-task bias, self-confirming loops, solutions before evidence (astToJson drift).
  - id: D5-D13
    date: 2026-09-25
    decision: >
      Real-agent evidence first: E-001 (K3), E-002 (K5) PROVEN, so class-level modify+verify needs zero BaroCSS
      surface. Theme/config edits (U5): E-003 INCONCLUSIVE (K6), E-004 PROVEN on fixtures (K7), E-005 INCONCLUSIVE
      on the real site (K8: replace semantics; its bare-call control was the contract's error), E-006 reran agents there.
    why: >
      Guessed gaps risk invent-then-solve; theme/config semantics is what only BaroCSS owns; done_when needs a realistic page.
  - id: D14
    date: 2026-09-25
    decision: >
      Accepted E-006 PROVEN (K9), merged. O1 done: L3 modify+verify on a realistic page (class edits K3/K5, theme
      token K7/K9) with zero BaroCSS changes, so none needed proving. No updateConfig merge change. Active outcome → O2
      (generate): the next loop stage, and class → rule resolution vs models' Tailwind v4 knowledge (K4, U4) is
      BaroCSS-owned. O3 stays candidate.
    why: >
      done_when met without new surface. Generation is where K4's parity gaps would bite first-try rendering;
      measuring how often they bite decides whether parity work matters or stays a non-item.


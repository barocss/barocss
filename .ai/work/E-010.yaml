question: >
  PARITY LANE (STATE.human_directives 2026-09-25): three class families that E-007 measured (K10) resolve
  differently in BaroCSS than in Tailwind 4.1.13 (the reference), each because BaroCSS omits a composition default
  Tailwind v4 provides, so the composed property is invalid and the class silently drops:
  (F1) ring box-shadow composition — ring-*/focus:ring-* emit a box-shadow that references undefined
  --baro-shadow/--baro-inset-shadow/--baro-inset-ring-shadow with no @property initial value, and there is no
  ring-offset-* utility; already fixed at exact L2 parity on branch ai/E-008-ring-parity (K11);
  (F2) single-axis translate — translate-x-*/translate-y-* set only their own axis var and reference the other
  axis's --baro-translate-* which is never registered, so the whole `translate`/transform value is invalid and no
  translation renders;
  (F3) preflight border-style — BaroCSS preflight resets border-width but not border-style, so a bare
  border/border-t/border-b (width set, style still `none`) is invisible page-wide, whereas Tailwind v4 preflight
  sets `border: 0 solid` on the universal reset.
  Does one batched minimum change close all three families — for every affected token (ring-1, ring-2,
  focus:ring-2, focus:ring-offset-2; translate-x-4, translate-y-4, -translate-x-1/2; border, border-t) the computed
  declaration BaroCSS emits equals Tailwind 4.1.13's for the same token on the same element (E-007/E-008 classifier
  reclassifies each RESOLVED at parity), with pnpm check GREEN and no regression to any currently-working utility —
  and, when E-007's G1/G2/G3 are rerun unchanged on the fixed build, do the tokens in these three families that the
  agent writes now render?
decision_it_informs: >
  All three families reach exact Tailwind-4.1.13 parity per token (L2) with pnpm check green, no regression, and the
  G1/G2/G3 rerun shows the ring/translate/border tokens now rendering → the parity lane works: several measured
  known-answer families batch cleanly into one product PR (first merged product code for O2), and Strategy contracts
  the next batch (the theme-var family --shadow-*/--leading-* from K10, plus the PR #84 candidates once measured with
  this classifier) the same way, converging on whether agent claims finally agree once every family a run uses is
  fixed. If a family cannot reach parity with a minimum composition-default change, or a control regresses, or the
  rerun still shows one of these tokens not applied → that family is not a simple composition-default gap; drop it
  from the batch, record why, and Strategy re-scopes it separately (the other families still land).
hypothesis: >
  All three are the same class of gap — a missing Tailwind-v4 composition default — with the same class of minimum
  fix: F1 and F2 register the missing layer vars via @property initial values (atRoot(property(...)), exactly the
  mechanism already used in transform.ts and proven in effects.ts on the E-008 branch), and F3 adds `border-style:

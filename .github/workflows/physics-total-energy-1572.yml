name: Physics total mechanical energy reference
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/total-mechanical-energy.ts'
      - '.github/workflows/physics-total-energy-1572.yml'
  workflow_dispatch:
jobs:
  full-step-energy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-total-energy
      - name: Audit all 1200 full-step total energies
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec esbuild examples/physics-contact-impulse-audit-1572/total-mechanical-energy.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/physics1572-total-energy/experiment.mjs
          node /tmp/physics1572-total-energy/experiment.mjs | tee /tmp/physics1572-total-energy/results.jsonl
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-total-energy-results
          path: /tmp/physics1572-total-energy/results.jsonl
          if-no-files-found: ignore

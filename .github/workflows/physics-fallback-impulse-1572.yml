name: Physics fallback-inclusive impulse ledger
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/fallback-impulse-ledger.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-fallback-impulse-ledger.mjs'
      - '.github/workflows/physics-fallback-impulse-1572.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-fallback
      - name: Verify fallback-inclusive contact impulse ledger
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-fallback-impulse-ledger.mjs | tee /tmp/physics1572-fallback/results.jsonl
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-fallback-impulse-results
          path: /tmp/physics1572-fallback/results.jsonl
          if-no-files-found: ignore

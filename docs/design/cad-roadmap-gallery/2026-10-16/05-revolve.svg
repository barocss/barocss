<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">축 주위로 회전 · Revolve</title><desc id="desc">한 프로파일을 축 주위로 회전시켜 회전 대칭 부품을 만듭니다. Conceptual CAD target design, not implementation evidence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#167d97" stroke-width="1.5"/></marker><linearGradient id="body"><stop stop-color="#b7d4e7"/><stop offset=".45" stop-color="#e5f1f7"/><stop offset="1" stop-color="#86b7d2"/></linearGradient></defs><rect width="1440" height="900" fill="#f5f7fa"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="40" y="44" font-size="16" fill="#576b80" font-weight="700">BAROCSS / CAD ROADMAP VISUAL STUDY 05</text><text x="40" y="93" font-size="34" fill="#16283b" font-weight="700">축 주위로 회전 · Revolve</text><text x="40" y="130" font-size="19" fill="#526779" font-weight="400">한 프로파일을 축 주위로 회전시켜 회전 대칭 부품을 만듭니다.</text><rect x="40" y="154" width="1360" height="39" rx="8" fill="#fff0ce"/><text x="58" y="180" font-size="17" fill="#78531a" font-weight="700">TARGET DESIGN / NOT IMPLEMENTATION EVIDENCE · 목표 디자인 · 실제 실행 화면 아님</text><rect x="40" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="62" y="256" font-size="17" fill="#50677d" font-weight="700">01  입력 형상 / INPUT</text><g transform="translate(40,0)"><rect x="180" y="340" width="80" height="160" fill="#dcf2ed" stroke="#168c87" stroke-width="3"/><line x1="180" y1="305" x2="180" y2="535" stroke="#ce8b28" stroke-width="2" stroke-dasharray="7 5"/><text x="81" y="290" font-size="17" fill="#263445" font-weight="400">XZ 평면 · 닫힌 직사각형</text><text x="275" y="420" font-size="16" fill="#263445" font-weight="400">40 mm</text><text x="185" y="530" font-size="16" fill="#263445" font-weight="400">반경 20 mm</text><text x="57" y="580" font-size="17" fill="#263445" font-weight="400">한 변은 회전축에 닿는 목표 예시</text></g><rect x="500" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="522" y="256" font-size="17" fill="#50677d" font-weight="700">02  조작 / OPERATION</text><g transform="translate(500,0)"><ellipse cx="180" cy="340" rx="80" ry="24" fill="#edf5f8" stroke="#8aaec1" stroke-width="2" stroke-dasharray="5 5"/><ellipse cx="180" cy="500" rx="80" ry="24" fill="#edf5f8" stroke="#8aaec1" stroke-width="2" stroke-dasharray="5 5"/><rect x="180" y="340" width="80" height="160" fill="#dcf2ed" stroke="#168c87" stroke-width="3"/><line x1="180" y1="305" x2="180" y2="535" stroke="#ce8b28" stroke-width="2" stroke-dasharray="7 5"/><path d="M100 420 C65 380 245 370 275 408" fill="none" stroke="#167d97" stroke-width="3" marker-end="url(#arrow)"/><text x="275" y="369" font-size="21" fill="#167d97" font-weight="700">360°</text><text x="86" y="580" font-size="18" fill="#263445" font-weight="400">프로파일 + Z축 + 회전각</text></g><rect x="960" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="982" y="256" font-size="17" fill="#50677d" font-weight="700">03  목표 결과 / RESULT</text><g transform="translate(960,0)"><path d="M130 340 L130 500 A90 27 0 0 0 310 500 L310 340 Z" fill="url(#body)" stroke="#32556c" stroke-width="2"/><ellipse cx="220" cy="340" rx="90" ry="27" fill="#e0edf6" stroke="#32556c" stroke-width="2" /><line x1="220" y1="290" x2="220" y2="540" stroke="#ce8b28" stroke-width="2" stroke-dasharray="7 5"/><text x="79" y="580" font-size="18" fill="#263445" font-weight="400">목표: 위아래가 막힌 원기둥</text><text x="89" y="608" font-size="18" fill="#236e70" font-weight="700">Ø40 × 높이 40 mm</text></g><rect x="40" y="658" width="1360" height="156" rx="14" fill="#e9eff5"/><text x="62" y="690" font-size="17" fill="#34516b" font-weight="700">선택 · 입력값 · 동작 설계 / COMMAND CONTEXT</text><text x="62" y="724" font-size="18" fill="#263445" font-weight="400">선택: 닫힌 Profile 01 + Model Z축   |   각도 360°   |   목표 출력: capped Solid</text><text x="62" y="753" font-size="18" fill="#263445" font-weight="400">형상의 기준은 회전축입니다. 프로파일의 축까지 거리가 결과 반경을 결정합니다.</text><text x="62" y="782" font-size="18" fill="#263445" font-weight="400">현재 #610은 양의 반경 meridian → 회전 Surface. 이 축 접촉/막힌 Solid 예시와 다릅니다.</text><text x="40" y="849" font-size="16" fill="#526779" font-weight="400">근거: #534 PART-03 · #537 SURF-04 · #610 제한된 Z축 회전 Surface</text><text x="40" y="877" font-size="15" fill="#6b7c8d" font-weight="400">수동 설계 예시 · 제품 실행/구현 증거 아님 · cap과 솔리드 유효성은 별도 지원·검증이 필요합니다.</text></g></svg>
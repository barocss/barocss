name: Npm release

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Exact version to verify on main; manual runs never publish
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    if: github.repository == 'barocss/barocss' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}
      publication_state: ${{ steps.publication.outputs.publication_state }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Read release version
        id: version
        run: echo "release_version=$(node -p 'require("./packages/barocss/package.json").version')" >> "$GITHUB_OUTPUT"
      - name: Check version and pending changesets
        run: node .github/scripts/check-release-version.mjs
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.release_version }}
      - name: Match manual dry-run request
        if: github.event_name == 'workflow_dispatch'
        env:
          REQUESTED_VERSION: ${{ inputs.expected_version }}
          ACTUAL_VERSION: ${{ steps.version.outputs.release_version }}
        run: test "$REQUESTED_VERSION" = "$ACTUAL_VERSION"
      - name: Check npm, tags, and Releases before publish
        id: publication
        run: node .github/scripts/check-publication-state.mjs
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.release_version }}
          EXPECTED_SHA: ${{ github.sha }}
          PUBLICATION_MODE: pre
          ALLOW_EXISTING_TAG_SHA: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify approved main promotion
        if: steps.publication.outputs.publication_state == 'unpublished'
        run: node .github/scripts/check-promotion-merge.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.publication.outputs.publication_state == 'unpublished'
        run: pnpm check
      - if: steps.publication.outputs.publication_state == 'unpublished'
        run: node .github/scripts/check-packages.mjs
      - if: steps.publication.outputs.publication_state == 'unpublished'
        run: pnpm --filter barocss-docs docs:build

  auth_dry_run:
    if: github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    steps:
      - name: Verify npm environment and token without publishing
        shell: bash
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$NPM_RELEASE_ENABLED" = true || { echo 'npm environment is not enabled'; exit 1; }
          test -n "$NPM_TOKEN" || { echo 'NPM_TOKEN is missing'; exit 1; }
          auth_file="$RUNNER_TEMP/barocss-npmrc"
          trap 'rm -f "$auth_file"' EXIT
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$auth_file"
          NPM_CONFIG_USERCONFIG="$auth_file" npm whoami --registry=https://registry.npmjs.org

  publish:
    if: github.event_name == 'push' && needs.preflight.outputs.publication_state == 'unpublished'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Require configured npm environment and live token
        shell: bash
        env:
          NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test "$NPM_RELEASE_ENABLED" = true || { echo 'npm environment is not enabled'; exit 1; }
          test -n "$NPM_TOKEN" || { echo 'NPM_TOKEN is missing'; exit 1; }
          auth_file="$RUNNER_TEMP/barocss-npmrc"
          trap 'rm -f "$auth_file"' EXIT
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > "$auth_file"
          NPM_CONFIG_USERCONFIG="$auth_file" npm whoami --registry=https://registry.npmjs.org
      - name: Recheck main SHA and registry before the first publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_VERSION: ${{ needs.preflight.outputs.release_version }}
          EXPECTED_SHA: ${{ github.sha }}
          PUBLICATION_MODE: pre
          REQUIRE_UNPUBLISHED: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
          node .github/scripts/check-publication-state.mjs
      - name: Publish packages, tags, and GitHub Releases
        id: publish_action
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify npm packages, tags, and Releases
        if: always() && steps.publish_action.outcome != 'skipped'
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.release_version }}
          EXPECTED_SHA: ${{ github.sha }}
          PUBLICATION_MODE: post
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node .github/scripts/check-publication-state.mjs; then
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo 'Published state is incomplete. Stop; reconcile manually before any retry.'
              exit 1
            fi
            sleep 10
          done

name: CI

on:
  push:
    branches:
      - develop
      - main
      - release
  pull_request:
    branches:
      - develop
      - main
      - release

permissions:
  contents: read

jobs:
  verify:
    name: Test and Build
    if: github.ref != 'refs/heads/main' && github.base_ref != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm check

      - name: Check build output
        run: |
          echo "=== @barocss/kit build output ==="
          ls -la packages/barocss/dist/
          echo ""
          echo "=== @barocss/browser build output ==="
          ls -la packages/barocss-browser/dist/
          echo ""
          echo "=== @barocss/server build output ==="
          ls -la packages/barocss-server/dist/
          echo ""
          echo "All packages built successfully!"

  build:
    name: build
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm type-check && pnpm lint && pnpm build:library
      - run: pnpm build

  test:
    name: test
    if: github.ref == 'refs/heads/main' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

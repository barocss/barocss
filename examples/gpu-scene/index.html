<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>GPU scene example</title>
<link rel="stylesheet" href="/scene.css"></head>
<body><p><a href="/mesh.html">Host triangle mesh preview</a></p><main><h1>GPU scene example</h1><p>Edit the bounded scene language. Apply renders the accepted source (its header sets the version) with the WebGPU viewer. Errors keep the last accepted frame.</p><label>Example <select id="scene-example"><option value="baseline">Sphere + Box</option><option value="torus">Torus</option></select></label><label for="source">Scene source</label><textarea id="source" spellcheck="false">@scene demo { version: 0; background: #102030; sphere #orb; box #block; }
sphere { color: #ff6040; radius: 0.8; translate: -1 0 0; }
box { color: #40aaff; size: 1.2 1.2 1.2; translate: 1 0 0; }</textarea><div><button id="apply">Apply scene</button> <button id="reset">Reset scene</button></div><pre id="status" role="status"></pre><canvas id="scene" width="640" height="480" aria-label="Rendered accepted scene"></canvas></main><script type="module" src="/app.js"></script></body></html>

name: Physics SAT separation witness
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/sat-separation-witness.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-sat-separation-witness.mjs'
      - '.github/workflows/physics-sat-separation-witness.yml'
  workflow_dispatch:
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/p1572-sat-separation
      - name: Compare SAT and per-candidate separation at identical poses
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-sat-separation-witness.mjs | tee /tmp/p1572-sat-separation/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-sat-separation-results
          path: /tmp/p1572-sat-separation/results.jsonl
          if-no-files-found: ignore

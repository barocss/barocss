<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Render target sizes · BaroCSS GPU</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background:#17191d; color:#eceef2; }
    body { max-width:1080px; margin:32px auto; padding:0 20px; }
    h1 { font-size:1.6rem; margin-bottom:4px; }
    p, figcaption { color:#bbc1cb; }
    .controls { display:flex; align-items:center; flex-wrap:wrap; gap:12px 24px; margin:20px 0; }
    button, input { font:inherit; accent-color:#80d9d1; }
    button { padding:7px 14px; cursor:pointer; }
    button:disabled { cursor:default; }
    .images { display:grid; grid-template-columns:1fr 1.4fr 0.8fr; align-items:start; gap:20px; margin-top:24px; }
    figure { min-width:0; margin:0; }
    canvas { display:block; width:100%; height:auto; background:#20242b; border:1px solid #414854; }
    figcaption { margin-top:8px; }
    #error { color:#ffb4ad; white-space:pre-wrap; }
    [hidden] { display:none; }
    @media (max-width:700px) { .images { grid-template-columns:1fr; } }
  </style>
  <script type="importmap">{"imports":{"@barocss/cad":"../../barocss-cad/dist/index.js"}}</script>
</head>
<body>
  <h1>Render target sizes</h1>
  <p>Render the same scene to a square canvas, a wide image and a tall image. Each target has its own pixel size.</p>
  <div class="controls" role="group" aria-label="Capture controls">
    <label><input id="effects" type="checkbox" disabled> Add bloom and depth of field</label>
    <button id="capture" type="button" disabled>Capture both targets</button>
  </div>
  <p id="status" role="status" aria-live="polite">Loading the viewer…</p>
  <p id="error" role="alert" hidden></p>
  <div class="images">
    <figure><canvas id="view" width="240" height="240" aria-label="Live square canvas"></canvas><figcaption>Live canvas</figcaption></figure>
    <figure><canvas id="landscape" width="480" height="240" aria-label="Wide target image"></canvas><figcaption id="landscape-caption">Wide target · not captured</figcaption></figure>
    <figure><canvas id="portrait" width="240" height="480" aria-label="Tall target image"></canvas><figcaption id="portrait-caption">Tall target · not captured</figcaption></figure>
  </div>
  <script type="module">
    const byId = id => document.getElementById(id), controls = [byId('effects'), byId('capture')];
    const targets = []; let viewer = null, busy = false, closed = false;
    const base = { sky: '#000000', ground: '#000000', ambient: 0, toneMapping: 'none' };
    function cleanup() { closed = true; for (const target of targets) target.dispose(); targets.length = 0; viewer?.dispose(); }
    window.addEventListener('beforeunload', cleanup, { once: true });
    const showError = reason => { byId('error').textContent = `${reason.code ? `${reason.code}: ` : ''}${reason.message ?? String(reason)}`; byId('error').hidden = false; };
    const display = (id, frame) => {
      const canvas = byId(id), context = canvas.getContext('2d');
      if (!context) throw new Error('A 2D canvas context is required to show the target.');
      canvas.width = frame.width; canvas.height = frame.height;
      context.putImageData(new ImageData(new Uint8ClampedArray(frame.data), frame.width, frame.height), 0, 0);
    };
    function matchTargetsToDisplay() {
      const ratio = Math.min(2, window.devicePixelRatio || 1);
      for (const [index, id] of ['landscape', 'portrait'].entries()) {
        const canvas = byId(id), width = Math.max(1, Math.round(canvas.clientWidth * ratio)), height = Math.max(1, Math.round(canvas.clientHeight * ratio));
        if (targets[index]?.width === width && targets[index]?.height === height) continue;
        const next = viewer.createRenderTarget({ width, height });
        targets[index]?.dispose(); targets[index] = next;
      }
    }
    const disc = (x, radius, segments = 64) => {
      const positions = [x,0,0], normals = [0,0,1], indices = [];
      for (let i = 0; i < segments; i++) { const a = 2 * Math.PI * i / segments; positions.push(x + radius * Math.cos(a), radius * Math.sin(a), 0); normals.push(0,0,1); }
      for (let i = 0; i < segments; i++) indices.push(0, 1+i, 1+(i+1)%segments);
      return { positions, normals, indices };
    };
    async function capture() {
      if (!viewer || busy || closed) return;
      busy = true; for (const control of controls) control.disabled = true; byId('error').hidden = true;
      try {
        const effects = byId('effects').checked;
        viewer.environment = effects ? { ...base, bloom: { strength: 0.25, threshold: 0.25 }, depthOfField: { focus: 4, blur: 8 } } : base;
        matchTargetsToDisplay();
        viewer.render(targets[0]); viewer.render(targets[1]);
        const frames = await Promise.all(targets.map(target => target.read()));
        if (closed) return;
        display('landscape', frames[0]); display('portrait', frames[1]); viewer.render();
        byId('landscape-caption').textContent = `Wide target · ${frames[0].width} × ${frames[0].height} · captured`;
        byId('portrait-caption').textContent = `Tall target · ${frames[1].width} × ${frames[1].height} · captured`;
        byId('status').textContent = `Both targets captured${effects ? ' with effects' : ''}. The circle keeps its shape.`;
      } catch (reason) { if (!closed) { showError(reason); byId('status').textContent = 'The targets could not be captured.'; } }
      finally { busy = false; if (!closed) for (const control of controls) control.disabled = false; }
    }
    try {
      const { createViewer } = await import('../dist/viewer/index.js');
      viewer = await createViewer(byId('view'), { controls: false, antialias: false, background: '#20242b', lights: [], environment: base,
        camera: { position: [0,0,6], target: [0,0,0], up: [0,1,0], projection: 'orthographic', fovY: 2 * Math.atan(2.5 / 6) * 180 / Math.PI },
        onError: reason => { if (!closed) showError(new Error(reason)); } });
      if (closed) { viewer.dispose(); throw new Error('The page closed before viewer creation completed.'); }
      viewer.add(disc(0,0.85), { material: { color: '#42d5ca', unlit: true, doubleSided: true } });
      viewer.add(disc(-1.7,0.26), { material: { color: '#f5bd70', unlit: true, doubleSided: true } });
      viewer.add(disc(1.7,0.26), { material: { color: '#ef8f88', unlit: true, doubleSided: true } });
      viewer.render(); byId('capture').addEventListener('click', capture);
      for (const control of controls) control.disabled = false;
      byId('status').textContent = 'Capture both targets to compare their views.';
    } catch (reason) { if (!closed) { showError(reason); byId('status').textContent = 'The example could not start.'; } cleanup(); }
  </script>
</body>
</html>

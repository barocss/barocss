human_directives:          # humans append short directional notes; STRATEGY must apply them
  - >-
    2026-09-25: a product_code experiment PR is merged only after a human approves it. Review it fully
    (§2A). If you would merge, record the review with merged: true on the experiment branch and push,
    but run `gh pr merge` only when the PR carries the label `human-approved`, which only a human adds;
    never add it yourself. Without the label, stop there and do not start §2B until that merge lands.
  - >-
    2026-09-25: a product_code contract's allowed.paths always includes the test directories of every
    package it lets Execution change (for example packages/barocss/tests/ next to packages/barocss/src/).
    A code change that makes existing tests obsolete must be able to update them in the same pass.
  - >-
    2026-09-25: every product_code contract tells Execution, in its method, to open the experiment PR as
    a draft when a local check (pnpm check or the package-scoped type-check/lint/test/build:library) fails,
    and to mark it ready for review only when all of them pass. Execution reads only the contract, so the
    rule has to be written there.
  - >-
    2026-09-25: treat PR #84 (codex/compat-implement-v4-3-zoom-tab) as a source of candidate O2 parity
    gaps, not as code to merge. A review flagged, unverified: @container and @container/<name> missing
    (shadcn uses them); bg-(--x) resolving to background-size instead of a color; max-md: with the
    default raw breakpoint possibly emitting an invalid @media; outline width. Measure each against
    Tailwind 4.1.13 with the E-007/E-008 classifier before contracting a fix, and rank by how often
    v0/shadcn-style output uses it. Don't copy #84's defects (bare blur emitting blur(0px), bg-(position:--x)
    falling through to background-color), and don't move the reference to 4.3.3 without a decision.
  - >-
    2026-09-25: two lanes. Parity lane: a class family that BaroCSS resolves differently from Tailwind
    4.1.13 (the reference) is a known-answer bug, not an open question. Batch several measured families
    into one product_code contract; the batch counts as one capability (Tailwind v4 parity) for §2's
    one-capability rule. Its evidence is L2: a per-token comparison against Tailwind 4.1.13 plus pnpm check
    green. Rerun the L3 agent check (G1/G2-style) at most once per batch, not per family. The approval and
    tests-in-scope directives still apply. Question lane: whether to build something, and what users need,
    keep the full experiment protocol. While STATE holds measured or candidate parity misses, prefer
    the parity lane.
  - >-
    2026-09-25 (question lane): run direction-proposal option B's first experiment.
    Question: in natural UI generation, does a per-class BaroCSS resolution report shown to the agent right
    after it generates reduce first-try silent style misses, and is that information something only BaroCSS
    has? Setup: E-007's G1-G3 tasks, actor, prompt, site and frozen classifier/grader, pinned to one develop
    commit (parity fixes landing meanwhile would remove the misses being measured). Three arms, fresh
    context per run: (0) no report, E-007's baseline; (1) BaroCSS report built only from the existing
    runtime has()/getCss(), listing unresolved classes, empty rules, and rules that reference an undefined
    custom property; (2) control report of the browser's computed style for the same elements, with no
    BaroCSS data. Measure silent misses shipped under a "done" claim, per arm. No product code: the reports
    are scripts in the evidence dir. It informs: arm 1 clearly beats arm 2 → BaroCSS-only resolution
    information matters (criterion 5 holds for option B); arm 1 ≈ arm 2 → verification stays
    browser/agent-owned (the working assumption holds), and the criterion-5 case for options A and C weakens too.
    Order: contract it as soon as the parity-lane batch E-010 is evaluated, before any further parity batch.
    Source: docs/research/direction-proposal.md.
  - >-
    2026-09-25 (parity lane): a parity batch may merge with verdict PARTIAL. Each family that lands must
    reach exact per-token Tailwind 4.1.13 parity at L2, with no control regressed and pnpm check green, and
    each dropped family must have changed no product code. The §2A "merge only if PROVEN" rule then applies
    to the landed part, not the whole batch. Dropped families go back as parity candidates with their
    diagnosis. The human-approval directive still applies before gh pr merge.
  - >-
    2026-09-25 (delegated by the human to two Claude sessions, agreed in round 1): rank parity-lane
    families by what AI UI platforms actually emit (v0/shadcn-style output), not by all of Tailwind.
    E-007's generated sections plus a small shadcn-style sample is enough to rank; don't make ranking its
    own research project. "Known answer" still needs a per-family measurement before batching: E-010's
    translate was a wrong value formula, not a missing default. Keep O3 (styling provenance) a separate
    candidate, not folded into option B's question; revisit it after B reports. Reason: parity is table

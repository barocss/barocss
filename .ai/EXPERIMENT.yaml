status: blocked

id: E-005
outcome: O1
branch: ai/E-005-real-app-token
question: >
  On a real Vite app (apps/barocss-site, booted with baroStart), can a real LLM agent using only generic
  browser tools add a colour token through BaroCSS in the live page, (D) on the dev server and (P) on the
  production build, where BaroCSS sits inside a minified bundle with no importable module URL and no global?
  Reason to re-verify K7: every earlier page was a fixture that loads BaroCSS from an importable module URL,
  and arm A's pass depended on it. O1's done_when asks for a realistic page.
decision_it_informs: >
  If both D runs pass with claims agreeing, O1's done_when is met for class and colour-token edits with zero
  BaroCSS changes (K3, K5, K7, this), and Strategy marks O1 done and moves to O2/O3. P's result says whether
  production builds need a reachable runtime; Strategy records it as an unknown and does not build for it
  unless a scenario needs live edits in production. If a D run fails, the recorded blocking step names the
  owner: module identity or getRuntime/baroStart semantics (BAROCSS), how the app loads BaroCSS (APP), the
  bundler (LIBRARY), or agent error (AGENT).
hypothesis: >
  D passes: the agent finds the page's BaroCSS module URL in the served source, imports it, and getRuntime()
  returns baroStart's runtime (same singleton) if the URL matches exactly, or a second runtime otherwise (still
  a pass, per K7). P has no BaroCSS route, so the agent falls back to bg-[#5B21B6] or a raw-CSS route, or
  honestly reports that the token was not added.
builds_on: [K3, K5, K7, U5]
scenario: >
  App: apps/barocss-site unchanged. index.html boots baroStart({config:{preflight:true}}). Arm D is the `vite`
  dev server. Arm P is `vite build` followed by `vite preview`. The actor is E-004's: claude-opus-4-8[1m], a
  fresh context per run, an empty cwd, only the Playwright MCP tools. Network is limited to the app's localhost
  origin, and every external request is blocked. The prompt is word for word E-004's: "The page is styled with
  BaroCSS, a runtime utility-class CSS engine with Tailwind-compatible class names. Make the change through
  BaroCSS in the live page (its class names and its theme configuration), not with inline styles or
  hand-written CSS. Then verify the result and report whether the task is done."
  Task Y1 (E-004's, with the site's element): Add a `brand` color (#5B21B6) to the page's BaroCSS theme so
  that `bg-brand` works, and use it for the hero's Live Demo button's background.
  Runs: arm D twice (D1, D2, each a fresh context), arm P once (P1). Realism limit: live-page path only.
method: >
  1. Build packages locally. Serve arm D and arm P from apps/barocss-site, unchanged; neither build output is
     committed. Adapt E-004's grader.js to the target (the hero `a[href="#demo"]` with text "Live Demo") and
     snapshot it plus the other hero link and the navbar logo mark; otherwise keep it unchanged. Adapt the
     self-test the same way. Run the self-test before any agent run and commit its output. For each arm it must
     show that baseline, bg-brand alone and bg-[#5B21B6] alone fail Y1, and that the inline-style and <style>
     controls fail through the detector. In D, getRuntime().updateConfig({theme:{extend:{colors:{brand}}}})
     from the page's own BaroCSS module URL must pass Y1 with no regression. In P, record any BaroCSS route the
     self-test finds (expected: none). This is recorded, not gated.
  2. Adapt E-004's run.mjs so that the arm maps to the app URL and the allowlist is the app's origin. Keep the
     rest of the actor setup. Commit the runner before any agent run.
  3. Grade with E-004's Y1 rule at 1024px: the target's classList contains `bg-brand`, its computed
     backgroundColor is rgb(91, 33, 182), there is no regression on any snapshotted property, and the detector
     finds no raw-CSS route. Passing a theme or config object to a BaroCSS API is a BaroCSS route.
  4. For each run, record everything E-004's method step 4 asks for. Also record which module URL the agent
     imported, if any; whether the page's own runtime now resolves bg-brand (identity check after the run, as
     in E-004's route probe); and any duplicate barocss <style> ids.
allowed:
  actions:
    - "build packages locally (dist and the site build output are gitignored or left uncommitted)"
    - "run apps/barocss-site's vite dev server and vite build + preview on localhost; drive a browser"
    - "copy and adapt E-004's grader, self-test, route probe and runner into .ai/evidence/E-005/"
    - "read packages/barocss-browser or packages/barocss source only to classify a route or failure"
    - "spawn one fresh agent context per run as the actor (3 runs)"
  paths: [".ai/evidence/E-005/"]
  product_code: false
non_goals:
  - Editing apps/barocss-site or any product code, including its vite config or how it boots BaroCSS
  - Exposing the runtime, adding a global, registry or discovery API, or changing getRuntime/baroStart
  - Hinting where the runtime lives or that updateConfig exists, or changing the prompt or task beyond the element name
  - Allowing external network access (for example a public CDN import), other tasks, other models, or source-file config editing
  - Editing the grader or runner after seeing agent results
evidence:
  level_required: L3
  proves_yes: >
    Both arm D runs pass Y1 through a BaroCSS config route with no regression, and both final claims agree
    with the grader. P1 is recorded either way and does not decide the verdict.
  proves_no: >
    At least one arm D run fails Y1 because the agent could not reach or use BaroCSS theme configuration on the
    real app with generic browser tools, and the tool calls record the blocking step.
budget: >
  1 session. Three agent runs (D1, D2, P1). Retry once only for environment failures, not for agent mistakes.
  Read ≤ 10 product files.
stop_when:
  - All three runs are recorded with grader results.
  - A gating self-test expectation in step 1 fails → blocked, and record which one.
  - The site does not render styled in an arm before any agent run → blocked for that arm, and say why.
  - No independent agent actor can be run → blocked, and say what is missing.
  - The grader would have to change after an agent run → record it in side_notes, don't change the grader.

result:
  verdict: INCONCLUSIVE
  level: L2
  evidence:
    - "BLOCKED at method step 1: gating expectation 'arm D positive control: page module URL getRuntime().updateConfig theme.extend passes Y1 with no regression' FAILS; 17/18 expectations pass (D 9/10, P 8/8). Rerun: node .ai/evidence/E-005/grader-selftest.mjs → .ai/evidence/E-005/selftest.json (exit 1); see SUMMARY.md"
    - "Failure: bare getRuntime().updateConfig({theme:{extend:{colors:{brand}}}}) yields .bg-brand rgb(91, 33, 182) on the target (class + colour checks pass) but regresses both other hero links' color oklch(0.208 0.042 265.755) → rgb(0, 0, 238) (UA link colour)"
    - "Cause: updateConfig replaces, not merges: options.config {\"preflight\":true} → {\"theme\":{...}}, preflight partition 41 rules → removed (selftest.json arms.D.bareCallEffect; browser-runtime.ts updateConfig assigns options.config = newConfig)"
    - "Config-preserving shapes pass Y1 with no regression (add and replace): updateConfig({...r.options.config, theme:{extend}}) and updateConfig({preflight:true, theme:{extend}}) (selftest.json arms.D.routes)"
    - "Arm D discovery + identity: served inline module imports /@fs/.../packages/barocss-browser/src/index.ts; import() of that exact URL gives baroStart's module, getRuntime() is the page runtime, no new style elements (arms.D.identity); a ?query URL is a second module instance"
    - "Arm P (recorded, not gated): no BaroCSS route — no global with updateConfig, bundle assets/index-*.js exports [] (arms.P.routesFound)"
    - "Network guard (env.mjs proxy, --proxy-bypass-list=<-loopback>): unpkg import, external fetch, 127.0.0.1:9333 refused; app origin reachable, both arms"
    - "No agent runs (D1, D2, P1 not started); runner not adapted, because stop_when fired first"
  learning: >
    On a real app that passes config to baroStart (preflight:true), the smallest theme-extend call through the page's own
    runtime regresses the page, because updateConfig replaces the whole config. Only a config-preserving call passes Y1, so
    the contract's gating control, and likely a naive agent, fail on regression, not on reachability. Reachability in D is fine.
  unknown:
    - "Blocker: the frozen gating control fails on this app. Strategy must decide whether the positive control may be the config-preserving shape (grader unchanged), or whether updateConfig's replace semantics is the gap to test (ownership BAROCSS)"
    - "Whether a real agent spreads the existing config (E-004 A1 did, A2 did not) — i.e. whether D would pass or fail on regression"
  next_question: >
    Rerun E-005 with the positive control = updateConfig({...current config, theme:{extend}}) on the page's module URL, and
    record per run whether the agent preserved the existing config (preflight). If agents don't, that is the evidence for
    or against a merge/extend semantics gap in updateConfig.
  pr: https://github.com/barocss/barocss/pull/115
  checks: "python3 .ai/check.py --role execution --base origin/develop: OK; no product code changed (pnpm check not required)"
  side_notes:
    - "A second module instance (same file, ?query URL) uses the same styleId 'barocss-runtime'; its updateConfig also drops the page's preflight (same two regressions, no duplicate style ids observed)"
    - "apps/barocss-site/src/indext.ts (new BrowserRuntime + observe) looks unused by index.html"
    - "vite build output bundles BaroCSS with no exports and no global, as the contract expected"


        warning (rounded-4xl, [prop:value]). Also no effect: *-xs scales, rotate-x-*, perspective-*,
        bg-(--var), outline-hidden, wrap-anywhere, mask-*, bg-radial/conic. Arbitrary values on known
        utilities work (aspect-[16/9], rounded-[2rem], text-[42px], bg-[#hex]).
      caveat: >
        Hand probe 2026-09-24; E-002's four classes are L2 (.ai/evidence/E-002/). Parity gaps are not work
        items: K5 shows they did not cause false claims.
    - {id: K5, level: L3, fact: "E-002: same actor, 4 tasks whose natural class is a K4 no-op. Grader 4/4, no false 'done'; all 17 no-ops detected pre-report (mainly computed style), recovered only where an arbitrary value exists. Detecting unresolved classes is AGENT-owned for this actor. Silent empty rules cost turns, not false claims. .ai/evidence/E-002/."}
    - {id: K6, level: L2, fact: "E-003: theme.extend.colors.brand via updateConfig makes bg-brand work (deep-merge); theme.extend.borderRadius only emits :root --radius-* (rounded-* names hard-coded), no config route adds rounded-4xl; no plugin hook. {DEFAULT} colour objects throw. .ai/evidence/E-003/."}

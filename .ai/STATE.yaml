      canonical idiom agents reach for unprompted (2/3 runs), a measured PARITY-MISS with unambiguous BAROCSS ownership.
  - id: D16
    date: 2026-09-25
    decision: >
      Reviewed E-008: accepted INCONCLUSIVE, did not merge PR #128 (closed, branch kept as reference). The minimum
      effects.ts edit reaches exact Tailwind-4.1.13 ring box-shadow parity at L2 with no regression (K11), but the
      contract's allowed.paths omitted packages/barocss/tests/, so the parity fix's necessary update to 4 frozen

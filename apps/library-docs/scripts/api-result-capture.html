<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Public Part API result capture</title>
<style>
  body { margin: 24px auto; width: min(960px, calc(100% - 48px)); font: 16px/1.5 system-ui, sans-serif; color: #172333; }
  h1 { margin: 0 0 8px; font-size: 24px; }
  label { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
  select { font: inherit; padding: 4px 8px; }
  canvas { display: block; width: 100%; height: 480px; background: #0e1421; }
  p { margin: 8px 0; }
  #status { font-size: 14px; }
</style>
<h1>Public Part API result capture</h1>
<label>Result <select id="case" aria-label="API result capture example"></select></label>
<p id="input"></p>
<canvas id="result" role="img" aria-label="Waiting for generated API result"></canvas>
<p id="status">API run: NOT_RUN. Load the generated result JSON first.</p>
<script type="module">
  // Serve a directory containing this file as index.html, the unchanged existing
  // boolean-renderer.mjs and generated api-result-scenes.json. No API runs here.
  import { createBooleanRenderer } from './boolean-renderer.mjs';
  const select = document.querySelector('#case');
  const canvas = document.querySelector('#result');
  const input = document.querySelector('#input');
  const status = document.querySelector('#status');
  try {
    const response = await fetch('./api-result-scenes.json');
    if (!response.ok) throw new Error(`Result JSON: HTTP ${response.status}`);
    const data = await response.json();
    if (data.format !== 'api-result-scenes-v1' || data.cases.length !== 3) throw new Error('Expected three generated API results');
    for (const result of data.cases) {
      const option = document.createElement('option');
      option.value = result.id;
      option.textContent = result.title;
      select.append(option);
    }
    const renderer = createBooleanRenderer(canvas);
    if (!renderer) throw new Error('WebGL is unavailable');
    const draw = () => {
      const result = data.cases.find(item => item.id === select.value);
      renderer.draw({ inputs: [result.mesh], results: { output: { mesh: result.mesh } } }, 4, 'output', -0.65, -1.05);
      input.textContent = result.inputDescription;
      canvas.setAttribute('aria-label', `${result.title}; public Part.meshes() result; mm, Z-up`);
      canvas.dataset.caseId = result.id;
      status.textContent = `Saved API result: ${result.id}; volume ${result.mass.volume} mm³; mass ${result.mass.mass} g. Display triangles are not a geometric tolerance guarantee.`;
    };
    select.addEventListener('change', draw);
    new ResizeObserver(draw).observe(canvas);
    draw();
    addEventListener('pagehide', () => renderer.dispose(), { once: true });
  } catch (error) {
    status.textContent = `CAPTURE_REFUSED: ${error.message}`;
    document.body.dataset.captureError = error.message;
    console.error(error);
  }
</script>
</html>

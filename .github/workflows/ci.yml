name: CI

on:
  push:
    branches:
      - develop
      - release
  pull_request:
    branches:
      - develop
      - release

jobs:
  verify:
    name: Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check autonomous protocol state
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --user pyyaml
          python3 .ai/check.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm check

      - name: Check release gates
        run: node --test .github/scripts/*.test.mjs

      - name: Check packed package exports
        run: node .github/scripts/check-packages.mjs

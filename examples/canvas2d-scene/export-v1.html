<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Canvas2D derived exports</title>
<style>
  body { margin: 24px; font: 15px system-ui; color: #17233c; background: #f5f7fb; }
  section { margin: 18px 0; padding: 14px; background: white; border: 1px solid #c8d2e3; }
  button, input { font: inherit; margin: 4px 10px 8px 0; }
  button { padding: 7px 10px; }
  canvas { display: block; border: 1px solid #c8d2e3; background: #e6ecf5; }
  #raster canvas { width: 800px; height: 480px; }
  #vector canvas { width: 520px; height: 360px; }
</style>
<h1>Derived PNG and bounded SVG</h1>
<section id="raster"><h2>v4 editable document → PNG</h2>
  <button id="exportPNG">Export PNG</button>
  <label>Inspect downloaded PNG <input id="inspectPNG" type="file" accept="image/png,.png"></label>
  <p id="pngStatus" role="status">Loading document</p><canvas></canvas></section>
<section id="vector"><h2>v5 paths → SVG → Scene</h2>
  <button id="exportSVG">Export SVG</button>
  <button id="refuseSVG">Try v4 image and glyph vector export</button>
  <label>Open exported SVG <input id="openSVG" type="file" accept="image/svg+xml,.svg"></label>
  <p id="svgStatus" role="status">Loading vector scene</p><canvas></canvas></section>
<script type="module">
  import { createCanvas2D, exportSceneSVG, importSVGElement } from
    '../../packages/barocss-canvas2d/dist/index.js';
  import { exportCanvasDocumentPNG, stageCanvasDocument } from
    '../../packages/barocss-canvas2d/dist/document.js';
  import { vectorScene } from './export-vector-v5.mjs';

  const pngStatus = document.querySelector('#pngStatus');
  const svgStatus = document.querySelector('#svgStatus');
  const rasterOptions = { logicalSize: { width: 800, height: 480 }, dpr: 2 };
  const vectorOptions = { logicalSize: { width: 260, height: 180 }, dpr: 2 };
  const rasterText = await (await fetch('./evidence/document-v1/scene-and-assets.json')).text();
  const rasterCanvas = document.querySelector('#raster canvas');
  const raster = await stageCanvasDocument(rasterText, rasterCanvas, rasterOptions);
  pngStatus.textContent = 'Ready · v4 · 3 assets';
  let vectorCanvas = document.querySelector('#vector canvas');
  let vectorRenderer = createCanvas2D(vectorCanvas, vectorOptions);
  vectorRenderer.updateScene(vectorScene); vectorRenderer.render();
  svgStatus.textContent = 'Ready · v5 paths';
  let pngInspection = null, svgSource = null;

  function download(blob, name) {
    const url = URL.createObjectURL(blob), anchor = document.createElement('a');
    anchor.href = url; anchor.download = name; anchor.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  document.querySelector('#exportPNG').onclick = async () => {
    try {
      const result = await exportCanvasDocumentPNG(rasterText, rasterOptions,
        () => document.createElement('canvas'));
      download(result.blob, 'canvas-document.png');
      pngStatus.textContent = `PNG · ${result.backingSize.width}×${result.backingSize.height} · ${result.blob.size} bytes`;
    } catch (error) { pngStatus.textContent = `${error.code ?? 'ERROR'}: ${error.message}`; }
  };
  document.querySelector('#inspectPNG').onchange = async event => {
    try {
      const file = event.target.files?.[0]; if (!file) return;
      const bitmap = await createImageBitmap(file), canvas = document.createElement('canvas');
      canvas.width = bitmap.width; canvas.height = bitmap.height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true }); ctx.drawImage(bitmap, 0, 0);
      const sample = (x, y) => [...ctx.getImageData(x * 2, y * 2, 1, 1).data];
      pngInspection = { width: bitmap.width, height: bitmap.height, bytes: file.size,
        rgba: sample(460, 250), glyph: sample(552, 253), checker: sample(335, 250) };
      bitmap.close(); pngStatus.textContent = `Inspected ${pngInspection.width}×${pngInspection.height} PNG`;
    } catch (error) { pngStatus.textContent = `ERROR: ${error.message}`; }
    event.target.value = '';
  };
  document.querySelector('#exportSVG').onclick = () => {
    const result = exportSceneSVG(vectorScene, vectorOptions.logicalSize);
    if (!result.ok) { svgStatus.textContent = JSON.stringify(result.diagnostics); return; }
    svgSource = result.svg;
    download(new Blob([result.svg], { type: 'image/svg+xml' }), 'canvas-vector.svg');
    svgStatus.textContent = `SVG · ${new TextEncoder().encode(result.svg).length} bytes · ${result.sourceIdMap.length} IDs`;
  };
  document.querySelector('#refuseSVG').onclick = () => {
    const result = exportSceneSVG(raster.scene, rasterOptions.logicalSize);
    svgStatus.textContent = result.ok ? 'Unexpected SVG export' :
      `Refused SVG · ${result.diagnostics.map(item => `${item.nodeId ?? 'scene'}: ${item.feature}`).join('; ')}`;
  };
  document.querySelector('#openSVG').onchange = async event => {
    try {
      const file = event.target.files?.[0]; if (!file) return;
      const xml = new DOMParser().parseFromString(await file.text(), 'image/svg+xml');
      if (xml.querySelector('parsererror')) throw new Error('malformed SVG XML');
      const imported = importSVGElement(xml.documentElement);
      const fresh = document.createElement('canvas');
      const next = createCanvas2D(fresh, vectorOptions);
      try { next.updateScene(imported.scene); next.render(); }
      catch (error) { next.dispose(); throw error; }
      vectorCanvas.replaceWith(fresh); vectorRenderer.dispose();
      vectorCanvas = fresh; vectorRenderer = next;
      svgStatus.textContent = `Reopened SVG · ${imported.diagnostics.pathIds.join(', ')}`;
    } catch (error) { svgStatus.textContent = `${error.code ?? 'ERROR'}: ${error.message}`; }
    event.target.value = '';
  };
  function pixel(canvas, x, y) {
    const gl = canvas.getContext('webgl2'), rgba = new Uint8Array(4), dpr = canvas.width /
      (canvas === rasterCanvas ? 800 : 260);
    gl.readPixels(Math.round(x * dpr), canvas.height - Math.round(y * dpr) - 1,
      1, 1, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
    return [...rgba];
  }
  window.__exportDebug = {
    get rasterCanvas() { return rasterCanvas; }, get vectorCanvas() { return vectorCanvas; },
    get pngInspection() { return pngInspection; }, get svgSource() { return svgSource; },
    rasterPixel(x, y) { return pixel(rasterCanvas, x, y); },
    vectorPixel(x, y) { return pixel(vectorCanvas, x, y); },
    vectorHit(x, y) { return vectorRenderer.hitTest({ x, y }); },
  };
</script>
</html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>BaroCAD wide Curve v1 in Three</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; border: 1px solid #44617d; }
  pre { white-space: pre-wrap; font-size: 13px; }
  button { margin: 8px 8px 8px 0; padding: 7px 12px; }
</style>
<main>
  <h1>Original 64-pole Curve in Three.js</h1>
  <p>The native source0 Curve stays original. The cyan Line shows its version 1 display samples.</p>
  <div id="view"></div>
  <button id="reject">Try invalid source</button><button id="dispose">Dispose loaded display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Group, OrthographicCamera, Scene, Vector3, WebGLRenderer } from 'three';
  import { evaluateCurve } from '@barocss/cad';
  import { BaroCADLoader, resolveBaroCadThreeCurvePick } from '../dist/three.js';

  const status = document.querySelector('#status');
  const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(800, 480);
  renderer.setClearColor(0x142236);
  document.querySelector('#view').append(renderer.domElement);
  const scene = new Scene();
  const callerChild = new Group();
  scene.add(callerChild);
  // View from +Y. Camera up is +Z; the authored native XYZ is not rotated.
  const camera = new OrthographicCamera(-0.018, 0.018, 0.01, -0.01, 0.001, 0.1);
  camera.position.set(0.015, 0.05, 0.002);
  camera.up.set(0, 0, 1);
  camera.lookAt(0.015, 0, 0.002);
  const loader = new BaroCADLoader({
    sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001,
    curveDisplay: { version: 1, chordToleranceMM: 0.1, maxSegments: 512, maxDepth: 16 },
  });
  const url = new URL('./curve-wide-v1.barocad', location.href).href;
  const pixels = () => {
    const data = new Uint8Array(800 * 480 * 4);
    const gl = renderer.getContext();
    gl.readPixels(0, 0, 800, 480, gl.RGBA, gl.UNSIGNED_BYTE, data);
    return data;
  };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  let result;
  try {
    result = await loader.loadAbortable(url, {});
    scene.add(result.group);
    renderer.render(scene, camera);
    const original = result.model.objects[0];
    const curve = result.curves[0];
    const line = result.group.children[0];
    const firstPixels = pixels();
    let nonBackgroundPixels = 0;
    for (let i = 0; i < firstPixels.length; i += 4) {
      if (Math.abs(firstPixels[i] - 20) > 10 || Math.abs(firstPixels[i + 1] - 34) > 10 ||
          Math.abs(firstPixels[i + 2] - 54) > 10) nonBackgroundPixels++;
    }
    const linePositions = line.geometry.getAttribute('position').array;
    const chordMidpoint = new Vector3(
      (linePositions[0] + linePositions[3]) / 2,
      (linePositions[1] + linePositions[4]) / 2,
      (linePositions[2] + linePositions[5]) / 2,
    );
    const pick = resolveBaroCadThreeCurvePick(result, { object: line, index: 0, point: chordMidpoint });
    const nativePickPoint = evaluateCurve(original, pick.parameterApprox);
    const evidence = {
      exactSource: result.source === await (await fetch(url)).text(),
      nativeModelId: result.model.name, nativeCurveId: original.id,
      originalPoles: original.controlPoints.length, originalKnots: original.knots.length,
      originalSignedZero: Object.is(original.controlPoints[0][0], -0),
      nativeDomainStartSignedZero: Object.is(curve.sample.domain[0], -0),
      nativeDomainEnd: curve.sample.domain[1],
      sampleVersion: curve.sample.report.dto.version,
      sampleCount: curve.sample.pointsMM.length, segmentCount: curve.sample.segments.length,
      lineNativeParametersExact: JSON.stringify(line.userData.barocss.nativeParameters) === JSON.stringify(curve.sample.parameters),
      maximumScaleError: Math.max(...Array.from(linePositions, (value, index) =>
        Math.abs(value - curve.sample.pointsMM[Math.floor(index / 3)][index % 3] * 0.001))),
      pickedOriginalCurveId: pick.curveId, pickedNativeParameter: pick.parameterApprox,
      pickNativePointErrorMM: Math.hypot(...pick.nativePointMM.map((value, axis) => value - nativePickPoint[axis])),
      webgl2: renderer.getContext() instanceof WebGL2RenderingContext,
      nonBackgroundPixels,
      callerChildRetained: scene.children.includes(callerChild),
    };
    window.__baroCadWideV1Evidence = evidence;
    status.textContent = JSON.stringify(evidence, null, 2);
    document.querySelector('#reject').onclick = () => {
      try { loader.parse('@model invalid {}'); }
      catch {
        renderer.render(scene, camera);
        evidence.invalidRejected = true;
        evidence.priorGroupRetained = scene.children.includes(result.group);
        evidence.priorPixelsRetained = hash(pixels()) === hash(firstPixels);
        status.textContent = JSON.stringify(evidence, null, 2);
      }
    };
    document.querySelector('#dispose').onclick = () => {
      result.dispose();
      result.dispose();
      renderer.render(scene, camera);
      evidence.disposed = !scene.children.includes(result.group);
      evidence.callerChildRetained = scene.children.includes(callerChild);
      status.textContent = JSON.stringify(evidence, null, 2);
    };
  } catch (error) {
    result?.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroCadWideV1Error = String(error);
  }
</script>
</html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>BaroCAD wide Curve v1 in Babylon</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; border: 1px solid #44617d; }
  pre { white-space: pre-wrap; font-size: 13px; }
  button { margin: 8px 8px 8px 0; padding: 7px 12px; }
</style>
<main>
  <h1>Original 64-pole Curve in Babylon.js</h1>
  <p>The native source0 Curve stays original. The blue LinesMesh shows its version 1 display samples.</p>
  <canvas id="view" width="800" height="480"></canvas>
  <button id="reject">Try invalid source</button><button id="dispose">Dispose loaded display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Engine } from '@babylonjs/core/Engines/engine.js';
  import { Scene } from '@babylonjs/core/scene.js';
  import { Camera } from '@babylonjs/core/Cameras/camera.js';
  import { FreeCamera } from '@babylonjs/core/Cameras/freeCamera.js';
  import { Mesh } from '@babylonjs/core/Meshes/mesh.js';
  import { LinesMesh } from '@babylonjs/core/Meshes/linesMesh.js';
  import { Color4 } from '@babylonjs/core/Maths/math.color.js';
  import { Vector3 } from '@babylonjs/core/Maths/math.vector.js';
  import { evaluateCurve } from '@barocss/cad';
  import { BaroCADBabylonLoader, resolveBaroCadBabylonCurvePick } from '../dist/babylon.js';

  const status = document.querySelector('#status');
  const canvas = document.querySelector('#view');
  const engine = new Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });
  const scene = new Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = new Color4(20 / 255, 34 / 255, 54 / 255, 1);
  const callerMesh = new Mesh('caller-owned', scene);
  // View from +Y. Camera up is +Z; the authored native XYZ is not rotated.
  const camera = new FreeCamera('camera', new Vector3(0.015, 0.05, 0.002), scene);
  camera.upVector = new Vector3(0, 0, 1);
  camera.setTarget(new Vector3(0.015, 0, 0.002));
  camera.mode = Camera.ORTHOGRAPHIC_CAMERA;
  camera.orthoLeft = -0.018;
  camera.orthoRight = 0.018;
  camera.orthoTop = 0.01;
  camera.orthoBottom = -0.01;
  camera.minZ = 0.001;
  camera.maxZ = 0.1;
  scene.activeCamera = camera;
  const loader = new BaroCADBabylonLoader(scene, {
    sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001,
    curveDisplay: { version: 1, chordToleranceMM: 0.1, maxSegments: 512, maxDepth: 16 },
  });
  const url = new URL('./curve-wide-v1.barocad', location.href).href;
  const pixels = () => {
    const data = new Uint8Array(800 * 480 * 4);
    const gl = canvas.getContext('webgl2');
    gl.readPixels(0, 0, 800, 480, gl.RGBA, gl.UNSIGNED_BYTE, data);
    return data;
  };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  let result;
  try {
    result = await loader.loadAbortable(url, {});
    engine.runRenderLoop(() => scene.render());
    await scene.whenReadyAsync();
    engine.stopRenderLoop();
    scene.render();
    const original = result.model.objects[0];
    const curve = result.curves[0];
    const line = result.meshes[0];
    const firstPixels = pixels();
    let nonBackgroundPixels = 0;
    for (let i = 0; i < firstPixels.length; i += 4) {
      if (Math.abs(firstPixels[i] - 20) > 10 || Math.abs(firstPixels[i + 1] - 34) > 10 ||
          Math.abs(firstPixels[i + 2] - 54) > 10) nonBackgroundPixels++;
    }
    const linePositions = line.getVerticesData('position');
    const chordMidpoint = new Vector3(
      (linePositions[0] + linePositions[3]) / 2,
      (linePositions[1] + linePositions[4]) / 2,
      (linePositions[2] + linePositions[5]) / 2,
    );
    const pick = resolveBaroCadBabylonCurvePick(result, {
      hit: true, pickedMesh: line, faceId: 0, subMeshFaceId: 0, subMeshId: 0, pickedPoint: chordMidpoint,
    });
    const nativePickPoint = evaluateCurve(original, pick.parameterApprox);
    const evidence = {
      exactSource: result.source === await (await fetch(url)).text(),
      nativeModelId: result.model.name, nativeCurveId: original.id,
      originalPoles: original.controlPoints.length, originalKnots: original.knots.length,
      originalSignedZero: Object.is(original.controlPoints[0][0], -0),
      nativeDomainStartSignedZero: Object.is(curve.sample.domain[0], -0),
      nativeDomainEnd: curve.sample.domain[1], sampleVersion: curve.sample.report.dto.version,
      sampleCount: curve.sample.pointsMM.length, segmentCount: curve.sample.segments.length,
      actualLinesMesh: line instanceof LinesMesh,
      lineNativeParametersExact: JSON.stringify(line.metadata.barocss.nativeParameters) === JSON.stringify(curve.sample.parameters),
      maximumScaleError: Math.max(...Array.from(linePositions, (value, index) =>
        Math.abs(value - curve.sample.pointsMM[Math.floor(index / 3)][index % 3] * 0.001))),
      pickedOriginalCurveId: pick.curveId, pickedNativeParameter: pick.parameterApprox,
      pickNativePointErrorMM: Math.hypot(...pick.nativePointMM.map((value, axis) => value - nativePickPoint[axis])),
      webgl2: canvas.getContext('webgl2') instanceof WebGL2RenderingContext,
      nonBackgroundPixels,
      callerMeshRetained: !callerMesh.isDisposed(),
    };
    window.__baroCadBabylonWideV1Evidence = evidence;
    status.textContent = JSON.stringify(evidence, null, 2);
    document.querySelector('#reject').onclick = () => {
      try { loader.parse('@model invalid {}'); }
      catch {
        scene.render();
        evidence.invalidRejected = true;
        evidence.priorMeshRetained = !line.isDisposed() && scene.meshes.includes(line);
        evidence.priorPixelsRetained = hash(pixels()) === hash(firstPixels);
        status.textContent = JSON.stringify(evidence, null, 2);
      }
    };
    document.querySelector('#dispose').onclick = () => {
      result.dispose();
      result.dispose();
      scene.render();
      evidence.disposed = line.isDisposed() && !scene.meshes.includes(line);
      evidence.callerMeshRetained = !callerMesh.isDisposed() && scene.meshes.includes(callerMesh);
      evidence.sceneAndEngineLive = !scene.isDisposed && engine.getRenderingCanvas() === canvas;
      status.textContent = JSON.stringify(evidence, null, 2);
    };
  } catch (error) {
    result?.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroCadBabylonWideV1Error = String(error);
  }
</script>
</html>

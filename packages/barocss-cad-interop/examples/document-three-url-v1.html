<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Abortable CAD document URL in Three.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; width: 800px; height: 480px; border: 1px solid #44617d; }
  button { margin: 12px 8px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Abortable CAD document URL · Three.js</h1>
  <p>The accepted display stays mounted when a later document request is canceled.</p>
  <canvas id="view" width="800" height="480"></canvas>
  <button id="reject" type="button">Try aborted requests</button>
  <button id="dispose" type="button">Dispose owned display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Color, Group, OrthographicCamera, Scene, WebGLRenderer } from 'three';
  import { BaroCADLoader } from '../dist/three.js';
  import { loadBaroCadDocumentThreeDisplay } from '../dist/three-document.js';

  const canvas = document.querySelector('#view');
  const status = document.querySelector('#status');
  const url = new URL('document-gpu-v2.cad-document.json', location.href).href;
  const native = { sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001,
    curveDisplay: { version: 1, chordToleranceMM: 0.02, maxSegments: 512, maxDepth: 16 } };
  const request = { native, basis: 'authored-xyz-matches-rhyup',
    bodyIds: ['body_1_surface', 'body_0_curve', 'body_1_curve', 'body_0_surface'] };
  const scene = new Scene();
  scene.background = new Color(0x101b2c);
  const callerChild = new Group(); callerChild.name = 'caller-marker'; scene.add(callerChild);
  const camera = new OrthographicCamera(-0.018, 0.018, 0.0108, -0.0108, 0.01, 1);
  camera.position.set(0.001, -0.001, 0.2);
  camera.lookAt(0.001, -0.001, 0);
  const renderer = new WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(800, 480, false);
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const pixels = () => {
    renderer.render(scene, camera);
    const data = new Uint8Array(canvas.width * canvas.height * 4);
    const gl = renderer.getContext();
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, data);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('Three WebGL readPixels failed');
    return data;
  };
  const lineColors = data => {
    let cyan = 0, magenta = 0;
    for (let i = 0; i < data.length; i += 4) {
      const r = data[i], g = data[i + 1], b = data[i + 2];
      if (r < 70 && g > 150 && b > 150) cyan++;
      if (r > 150 && g < 70 && b > 150) magenta++;
    }
    return { cyan, magenta };
  };
  let display, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  try {
    const progress = [];
    display = await loadBaroCadDocumentThreeDisplay(url, request, {
      onProgress(event) { progress.push(event); },
    });
    const expected = ['body_0_curve', 'body_0_surface', 'body_1_curve', 'body_1_surface'];
    if (JSON.stringify(display.bindings.map(binding => binding.bodyId)) !== JSON.stringify(expected) ||
        display.root.children.length !== 2 || progress.length < 1 ||
        progress.at(-1).loadedBytes !== 3172 || progress.some(event => event.url !== url)) {
      throw new Error('Document URL selection or byte progress differs from source');
    }
    display.root.children[0].position.x = -0.006;
    display.root.children[1].position.x = 0.006;
    for (const binding of display.bindings) {
      if (binding.object.isLine) binding.object.material.color.setHex(
        binding.assetId === 'asset-a' ? 0x00ffff : 0xff00ff);
    }
    scene.add(display.root);
    const first = pixels();
    const counts = lineColors(first);
    if (counts.cyan < 20 || counts.magenta < 20) throw new Error('Selected Curves have no visible pixels');
    evidence = {
      bodyIds: display.bindings.map(binding => binding.bodyId),
      refs: display.bindings.map(binding => binding.ref),
      revisions: display.bindings.map(binding => [binding.documentRevision, binding.assetRevision]),
      selectedSurfaces: display.bindings.filter(binding => binding.object.isMesh).length,
      selectedCurves: display.bindings.filter(binding => binding.object.isLine).length,
      progressEvents: progress.length, loadedBytes: progress.at(-1).loadedBytes,
      webgl2: renderer.getContext() instanceof WebGL2RenderingContext,
      oneCanvas: document.querySelectorAll('canvas').length === 1,
      visiblePixels: counts, pixelHash: hash(first), callerChildRetained: scene.children.includes(callerChild),
    };
    window.__baroCadDocumentThreeURL = evidence;
    show();
    document.querySelector('#reject').onclick = async () => {
      const before = hash(pixels());
      let refused = 0;
      const preAbort = new AbortController(); preAbort.abort();
      for (const [index, [candidateURL, candidateOptions, transport]] of [
        [url, request, { signal: preAbort.signal }],
        [url, request, { onProgress: () => false }],
        ['file:///tmp/cad-document.json', request, {}],
        [url, { ...request, bodyIds: ['missing_body'] }, {}],
      ].entries()) {
        try { await loadBaroCadDocumentThreeDisplay(candidateURL, candidateOptions, transport); }
        catch (error) {
          if (index < 2 && (error?.name !== 'AbortError' || error?.code !== 'ABORT_ERR')) {
            throw new Error('Document URL cancellation used the wrong error contract');
          }
          refused++;
        }
      }
      const staged = [], resources = [];
      const controller = new AbortController();
      const originalParse = BaroCADLoader.prototype.parse;
      let lateAbort = false;
      try {
        BaroCADLoader.prototype.parse = function (source) {
          const result = originalParse.call(this, source);
          staged.push(result);
          for (const child of result.group.children) {
            const record = { geometry: 0, material: 0 };
            child.geometry.addEventListener('dispose', () => record.geometry++);
            child.material.addEventListener('dispose', () => record.material++);
            resources.push(record);
          }
          if (staged.length === 2) controller.abort();
          return result;
        };
        try { await loadBaroCadDocumentThreeDisplay(url, request, { signal: controller.signal }); }
        catch (error) { lateAbort = error?.name === 'AbortError' && error?.code === 'ABORT_ERR'; }
      } finally { BaroCADLoader.prototype.parse = originalParse; }
      evidence.invalidRequestsRefused = refused;
      evidence.lateAbortRejected = lateAbort;
      evidence.stagedResourcesReleased = staged.length === 2 && resources.length === 6 &&
        resources.every(record => record.geometry === 1 && record.material === 1);
      evidence.priorDisplayRetained = scene.children.includes(display.root) &&
        display.bindings.every(binding => binding.object.geometry.getAttribute('position') !== undefined);
      evidence.priorPixelsRetained = hash(pixels()) === before;
      evidence.callerChildRetained = scene.children.includes(callerChild);
      show();
    };
    document.querySelector('#dispose').onclick = () => {
      let geometry = 0, material = 0;
      for (const binding of display.bindings) {
        binding.object.geometry.addEventListener('dispose', () => geometry++);
        binding.object.material.addEventListener('dispose', () => material++);
      }
      display.dispose(); display.dispose();
      Object.assign(evidence, {
        acceptedGeometryDisposals: geometry, acceptedMaterialDisposals: material,
        acceptedRemoved: !scene.children.includes(display.root),
        callerChildRetained: scene.children.includes(callerChild),
        callerRendererAndCanvasRetained: renderer.getContext() instanceof WebGL2RenderingContext &&
          document.body.contains(canvas),
      });
      show();
    };
  } catch (error) {
    display?.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroCadDocumentThreeURLError = String(error);
  }
</script>
</html>

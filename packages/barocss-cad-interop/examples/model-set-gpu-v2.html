<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Two native BaroCAD models in own GPU v2</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; width: 800px; height: 480px; border: 1px solid #44617d; }
  button { margin: 12px 8px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Two native files · one qualified own GPU scene</h1>
  <p>Both files retain the same Model, Curve and Surface IDs. Their GPU v2 refs use separate source aliases.</p>
  <canvas id="view" width="800" height="480"></canvas>
  <button id="reject" type="button">Try invalid candidate</button>
  <button id="dispose" type="button">Dispose GPU display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { mountPrimitiveSceneV1, mountPrimitiveSceneV2 } from '@barocss/gpu';
  import { validateWideAdaptiveCurveSamples } from '@barocss/cad';
  import {
    loadBaroCadModelSet, prepareBaroCadModelSetPrimitiveNativeRefsV2,
  } from '../dist/model-set.js';

  const canvas = document.querySelector('#view');
  const status = document.querySelector('#status');
  const wide = { sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001,
    curveDisplay: { version: 1, chordToleranceMM: 0.1, maxSegments: 512, maxDepth: 16 } };
  const manifest = { format: 'barocad-model-set', version: 0, entries: [
    { aliasId: 'asset_a', url: 'model-set-gpu-v2-a.barocad', options: wide },
    { aliasId: 'asset-b', url: 'model-set-gpu-v2-b.barocad', options: wide },
  ] };
  const options = { mmToSceneUnit: 0.05, translate: [0, 0, 0], background: [0.015, 0.02, 0.03],
    camera: { eye: [0.75, 0, 5], target: [0.75, 0, 0], up: [0, 1, 0],
      fovYDegrees: 45, near: 0.01, far: 20 },
    lighting: { ambientStrength: 0.5, directionalStrength: 0.5, direction: [0, 0, 1] } };
  const colors = [[1, 0, 1], [0.95, 0.18, 0.18], [0, 1, 1], [0.18, 0.95, 0.18]];
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const counts = pixels => {
    let cyan = 0, magenta = 0, red = 0, green = 0;
    for (let index = 0; index < pixels.length; index += 4) {
      const r = pixels[index], g = pixels[index + 1], b = pixels[index + 2];
      if (r < 30 && g > 220 && b > 220) cyan++;
      if (r > 220 && g < 30 && b > 220) magenta++;
      if (r > 80 && r > g * 2 && b < 100) red++;
      if (g > 80 && g > r * 2 && b < 100) green++;
    }
    return { cyan, magenta, red, green };
  };
  const drawData = scene => {
    const gl = canvas.getContext('webgl2');
    const entries = scene.entries;
    const buffers = scene.accepted.draws.map((draw, index) => {
      const entry = entries[index];
      const source = entry.kind === 'curve' ? entry.sample.pointsMM :
        Array.from({ length: entry.packet.positions.length / 3 }, (_, i) => entry.packet.positions.slice(i * 3, i * 3 + 3));
      const expected = Float32Array.from(source.flatMap(point => point.map((value, axis) =>
        (value + entry.transform.translationMm[axis]) * options.mmToSceneUnit)));
      const actual = new Float32Array(expected.length);
      gl.bindBuffer(gl.ARRAY_BUFFER, draw.buffers[0]);
      gl.getBufferSubData(gl.ARRAY_BUFFER, 0, actual);
      if (!actual.every((value, i) => Object.is(value, expected[i]))) throw new Error('GPU uploaded positions differ from native projection');
      return { kind: entry.kind, points: actual.length / 3, bytes: actual.byteLength, ref: entry.ref };
    });
    if (gl.getError() !== gl.NO_ERROR) throw new Error('GPU buffer readback failed');
    return { buffers, bounds: scene.bounds, sharedDepth: gl.isRenderbuffer(scene.accepted.depth),
      oneCanvas: document.querySelectorAll('canvas').length === 1 };
  };
  let set, projection, gpuEntries, scene, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  try {
    set = await loadBaroCadModelSet(manifest, { baseURL: new URL('./', location.href).href });
    projection = prepareBaroCadModelSetPrimitiveNativeRefsV2(set);
    if (projection.length !== 4 || projection.filter(entry => entry.kind === 'curve').length !== 2) {
      throw new Error('Expected two native Curves and two native Surfaces');
    }
    for (const entry of projection) {
      if (entry.ref.geometryId !== (entry.kind === 'surface' ? entry.packet.surfaceId : entry.sample.curve.id)) {
        throw new Error('GPU v2 ref differs from original native geometry ID');
      }
      if (entry.kind === 'curve') validateWideAdaptiveCurveSamples(entry.sample);
    }
    gpuEntries = projection.map((entry, index) => {
      const { binding, ...native } = entry;
      return { ...native, color: colors[index], transform: {
        translationMm: [binding.aliasId === 'asset_a' ? -18 : 18, 0, 0],
        rotationXYZW: [0, 0, 0, 1], scale: [1, 1, 1] } };
    });
    const withoutRef = entry => { const { ref, ...old } = entry; return old; };
    const old = mountPrimitiveSceneV1(canvas, { version: 1,
      entries: gpuEntries.slice(0, 2).map(withoutRef) }, options);
    const oldHash = hash(old.readPixels());
    const oldUpdate = old.update({ version: 1, entries: gpuEntries.map(withoutRef) }, options);
    const oldDuplicateRefused = !oldUpdate.ok && oldUpdate.error.message.includes('distinct') &&
      hash(old.readPixels()) === oldHash;
    old.dispose();
    if (!oldDuplicateRefused) throw new Error('Old GPU v1 duplicate-ID refusal changed');

    scene = mountPrimitiveSceneV2(canvas, { version: 2, entries: gpuEntries }, options);
    const pixels = scene.readPixels();
    const coloredPixels = counts(pixels);
    const upload = drawData(scene);
    if (Object.values(coloredPixels).some(value => value < 20) || !upload.sharedDepth) {
      throw new Error('Both native models must be visible with shared GPU depth');
    }
    evidence = {
      sourceBytes: set.entries.map(entry => new TextEncoder().encode(entry.result.source).length),
      originalModelNames: set.entries.map(entry => entry.result.model.name),
      originalIds: set.entries.map(entry => entry.result.model.objects.map(object => object.id)),
      originalPacketIds: set.entries.map(entry => entry.result.surfaces[0].packet.surfaceId),
      originalSignedZero: set.entries.map(entry => Object.is(entry.result.model.objects[0].controlPoints[0][0], -0)),
      sampleVersions: projection.filter(entry => entry.kind === 'curve').map(entry => entry.sampleVersion),
      domains: projection.filter(entry => entry.kind === 'curve').map(entry => entry.sample.domain),
      refs: projection.map(entry => entry.ref), bindings: projection.map(entry => entry.binding),
      gpuNativeIds: scene.entries.map(entry => entry.kind === 'curve' ? entry.sample.curve.id : entry.packet.surfaceId),
      oldDuplicateRefused, coloredPixels, pixelHash: hash(pixels), ...upload,
    };
    window.__baroCadGpuV2Evidence = evidence;
    show();
  } catch (error) {
    scene?.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroCadGpuV2Error = String(error);
  }
  document.querySelector('#reject').onclick = () => {
    if (!scene) return;
    const before = hash(scene.readPixels());
    const bad = structuredClone({ version: 2, entries: gpuEntries });
    bad.entries[2].ref.geometryId = 'other_id';
    const invalidRef = scene.update(bad, options);
    const duplicate = structuredClone({ version: 2, entries: gpuEntries });
    duplicate.entries[2].ref.modelId = 'asset_a';
    const duplicatePair = scene.update(duplicate, options);
    let overCapacityRejected = false;
    try { prepareBaroCadModelSetPrimitiveNativeRefsV2({ ...set, entries: [...set.entries,
      { ...set.entries[0], aliasId: 'asset_c' }] }); }
    catch { overCapacityRejected = true; }
    Object.assign(evidence, { invalidRefRejected: !invalidRef.ok,
      duplicatePairRejected: !duplicatePair.ok, overCapacityRejected,
      priorSceneRetained: scene.entries.length === 4,
      priorPixelsRetained: hash(scene.readPixels()) === before,
      priorOptionsRetained: JSON.stringify(scene.options) === JSON.stringify(options) });
    show();
  };
  document.querySelector('#dispose').onclick = () => {
    if (!scene) return;
    const gl = canvas.getContext('webgl2');
    const frame = scene.accepted;
    const buffers = frame.draws.flatMap(draw => draw.buffers);
    const vaos = frame.draws.map(draw => draw.vao);
    scene.dispose();
    scene.dispose();
    Object.assign(evidence, { gpuBuffersDisposed: buffers.every(buffer => !gl.isBuffer(buffer)),
      gpuVaosDisposed: vaos.every(vao => !gl.isVertexArray(vao)),
      gpuProgramsDisposed: frame.programs.every(program => !gl.isProgram(program)),
      gpuFramebufferDisposed: !gl.isFramebuffer(frame.framebuffer),
      gpuColorDisposed: !gl.isTexture(frame.color),
      gpuDepthDisposed: !gl.isRenderbuffer(frame.depth), callerCanvasRetained: document.body.contains(canvas),
      nativeSourcesRetained: set.entries.every(entry => entry.result.model.objects[0].id === 'wide_64') });
    show();
  };
</script>
</html>

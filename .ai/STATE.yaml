    - id: U4
      q: Where does BaroCSS behavior differ from the Tailwind knowledge models already have, and do those differences cause agent errors?
    - id: U5
      q: "Theme change on a production bundle with no exposed runtime (K8: no route). Open; no scenario needs it yet."
    - id: U6
      q: "Which theme namespaces drive class generation (K6: colors yes, borderRadius no)? Open until a scenario needs one."
    - id: U7
      q: "O4 baseline: on realistic generated UI, how does BaroCSS compare to @tailwindcss/browser and a built Tailwind v4 stylesheet on bundle/runtime cost, caching and FOUC? Measure before building anything for O4."
    - id: U8
      q: "O5 baseline: while markup streams in, does BaroCSS style each class as it appears, and does @tailwindcss/browser? Measure the gap before building for O5."
    - id: U9
      q: "O6 baseline: live brand/theme change with no rebuild — what can @tailwindcss/browser already do here vs BaroCSS (builds on K6/K8/K9)? Measure before building for O6."

decisions:                 # older entries compressed; full text in git log -p -- .ai/STATE.yaml
  - id: D1-D4
    date: 2026-09-24
    decision: >
      Strategy/Execution isolation via one handoff file; retired the AI-Interaction roadmap; froze AST work (K2)
      unless a scenario needs it; only Strategy accepts/merges experiments and its own .ai/-only PRs.
    why: Role overhead, easy-task bias, self-confirming loops, solutions before evidence (astToJson drift).
  - id: D5-D13
    date: 2026-09-25
    decision: >
      Real-agent evidence first: E-001 (K3), E-002 (K5) PROVEN, so class-level modify+verify needs zero BaroCSS
      surface. Theme/config edits (U5): E-003 INCONCLUSIVE (K6), E-004 PROVEN on fixtures (K7), E-005 INCONCLUSIVE
      on the real site (K8: replace semantics; its bare-call control was the contract's error), E-006 reran agents there.
    why: >
      Guessed gaps risk invent-then-solve; theme/config semantics is what only BaroCSS owns; done_when needs a realistic page.
  - id: D14-D15
    date: 2026-09-25
    decision: >
      Accepted E-006 PROVEN (K9) and E-007 DISPROVEN (K10), both merged. O1 done (modify+verify on a realistic page,
      zero BaroCSS changes); active outcome -> O2 (generate). E-007 showed agents ship silent Tailwind-v4 parity
      misses under "done", so class -> rule parity is an evidence-backed BAROCSS gap; E-008 was contracted as the first
      product_code experiment to fix the minimum family (ring box-shadow), other families left one-per-contract.
    why: >
      done_when met without new surface; generation is where parity gaps bite first-try rendering. Ring is the
      canonical idiom agents reach for unprompted (2/3 runs), a measured PARITY-MISS with unambiguous BAROCSS ownership.
  - id: D16
    date: 2026-09-25
    decision: >
      Reviewed E-008: accepted INCONCLUSIVE, did not merge PR #128 (closed, branch kept as reference). The minimum
      effects.ts edit reaches exact Tailwind-4.1.13 ring box-shadow parity at L2 with no regression (K11), but the
      contract's allowed.paths omitted packages/barocss/tests/, so the parity fix's necessary update to 4 frozen
      exact-AST ring tests fails pnpm check — a contract scope error, not a fix defect. Re-issued as work-store
      contract E-009 with packages/barocss/tests/ in scope and the factually-wrong standalone focus:ring-offset-2
      "offset ring" expectation dropped (Tailwind emits box-shadow:none for ring-offset alone); E-009 keeps the unrun
      L3 G1/G2 rerun arm and moves the first product fix into the work store.
    why: >
      Product PRs merge only on green CI + PROVEN; a scope error froze parity-wrong tests outside scope. The fix is
      real (compat/compare.test.ts agrees), so the correction is to widen scope to the tests that encode the old
      bug, not to abandon per-family patching.
  - id: D17
    date: 2026-09-25
    decision: >
      Applied human directive (2026-09-25): re-derived outcomes from VISION "Who it is for" (developers on v0-like AI
      UI platforms; BaroCSS renders their Tailwind v4 markup with no build, preview -> production). O2 (Tailwind v4
      parity) stays active as table stakes; added O4 production-grade, O5 streaming, O6 runtime theme/config as the
      three wins over @tailwindcss/browser (each measured against @tailwindcss/browser AND a built Tailwind v4
      stylesheet on realistic generated UI); parked O3 (provenance). Seeded win-baselines U7/U8/U9. Kept O2 active now
      because K10 shows current parity is broken and a broken UI can't credibly demonstrate any win; finish parity
      (E-009) first, then contract the win-baseline measurements before building anything for O4/O5/O6.
    why: >
      The human named the audience and the win conditions; BaroCSS earns its place only where it beats the existing
      zero-build runtime, and each win must be measured before it is built. Parity is the prerequisite the wins stand on.


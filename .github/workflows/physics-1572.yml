name: Physics 1572 scoped verification

on:
  pull_request:
    branches: [develop]
    paths:
      - 'packages/barocss-physics/**'
      - 'examples/physics-contact-impulse-audit-1572/**'
      - '.github/workflows/physics-1572.yml'
  workflow_dispatch:

jobs:
  physics-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Compile physics package
        run: pnpm --filter @barocss/physics build:library
      - name: Run Physics 1572 audited TypeScript consumers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physics-1572-audit
          for test in entry friction-release gravity-velocity pose-drift fresh-contact public-world-smoke; do
            pnpm exec esbuild "examples/physics-contact-impulse-audit-1572/${test}.ts" --bundle --platform=node --format=esm --target=node22 --outfile="/tmp/physics-1572-audit/${test}.mjs"
            node "/tmp/physics-1572-audit/${test}.mjs" | tee "/tmp/physics-1572-audit/${test}.log"
          done
      - name: Preserve audit output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-1572-logs
          path: /tmp/physics-1572-audit/*.log
          if-no-files-found: ignore

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Native filled CAD Shell mesh in Three.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; border: 1px solid #44617d; }
  button { margin: 12px 8px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Native filled CAD Boolean extrusion · Three.js</h1>
  <p>Face-local Shell triangles and true CAD Curve paths have separate display roots.</p>
  <div id="view"></div>
  <button id="edges" type="button">Show true edges</button>
  <button id="reject" type="button">Try invalid candidates</button>
  <button id="dispose" type="button">Dispose display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Group, OrthographicCamera, Scene, Vector3, WebGLRenderer } from 'three';
  import { validateCoplanarFaceBooleanExtrusionMesh } from '@barocss/cad';
  import { createBaroCadBooleanExtrusionThreeMesh } from '@barocss/cad-interop/three-boolean-extrusion-mesh';

  const status = document.querySelector('#status');
  const renderer = new WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
  renderer.setSize(800, 600);
  renderer.setPixelRatio(1);
  renderer.setClearColor(0x101b2c);
  document.querySelector('#view').append(renderer.domElement);
  const canvas = renderer.domElement;
  const scene = new Scene();
  const caller = new Group(); caller.name = 'caller-owned'; scene.add(caller);
  const camera = new OrthographicCamera(-0.012, 0.012, 0.009, -0.009, 0.001, 1);
  camera.up.set(0, 0, -1);
  camera.position.set(-0.0025, 0.05, -0.0013);
  camera.lookAt(-0.0025, -0.004, -0.0013);
  const wallCamera = new OrthographicCamera(-0.015, 0.015, 0.01125, -0.01125, 0.001, 1);
  wallCamera.position.set(0.028, 0.02, 0.028);
  wallCamera.lookAt(-0.0025, -0.004, -0.0013);
  const options = { unitsPerMillimeter: 0.001, basis: 'authored-xyz-matches-rhyup' };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const background = (r, g, b) => Math.abs(r - 16) <= 12 && Math.abs(g - 27) <= 12 && Math.abs(b - 44) <= 12;
  const render = (view = camera) => {
    renderer.render(scene, view);
    const gl = renderer.getContext();
    const bytes = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('Three WebGL readPixels failed');
    return bytes;
  };
  const count = bytes => {
    let total = 0;
    for (let i = 0; i < bytes.length; i += 4) {
      if (!background(bytes[i], bytes[i + 1], bytes[i + 2])) total++;
    }
    return total;
  };
  const sample = (bytes, pointMM) => {
    const point = new Vector3(...pointMM.map(value => value * 0.001)).project(camera);
    const x = Math.round((point.x + 1) * canvas.width / 2);
    const y = Math.round((point.y + 1) * canvas.height / 2);
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) throw new Error('CAD probe outside camera');
    const offset = (y * canvas.width + x) * 4;
    return { x, y, rgb: [...bytes.slice(offset, offset + 3)],
      background: background(bytes[offset], bytes[offset + 1], bytes[offset + 2]) };
  };
  const load = async name => {
    const response = await fetch(new URL(`./boolean-extrusion-three-data/${name}.owned-extrusion-mesh.json`, location.href));
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${name}`);
    const result = await response.json();
    validateCoplanarFaceBooleanExtrusionMesh(result);
    return result;
  };
  let accepted, display, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  try {
    const cases = [
      ['containment_hole', 1, 10, 24, 32],
      ['strip_two_components', 2, 12, 24, 24],
      ['reverse_containment_empty', 0, 0, 0, 0],
      ['cross_union', 1, 10, 24, 28],
      ['cross_union_distance_edit', 1, 10, 24, 28],
    ];
    const observations = [];
    const originals = {};
    for (const [name, shellCount, faceCount, edgeCount, triangleCount] of cases) {
      const result = await load(name); originals[name] = result;
      const candidate = createBaroCadBooleanExtrusionThreeMesh(result, options);
      scene.add(candidate.root);
      if (candidate.shells.length !== shellCount || candidate.faces.length !== faceCount ||
          candidate.edges.length !== edgeCount || candidate.root.children.length !== shellCount ||
          candidate.faces.reduce((total, binding) => total + binding.face.triangleCount, 0) !== triangleCount ||
          candidate.root.getObjectByProperty('type', 'Line')) {
        throw new Error(`Three Shell grouping differs: ${name}`);
      }
      const pixels = render();
      const isolated = [];
      if (name === 'strip_two_components') {
        for (const shell of candidate.shells) {
          for (const other of candidate.shells) other.faces.visible = other === shell;
          isolated.push({ shellId: shell.shellId, pixels: count(render()) });
        }
        for (const shell of candidate.shells) shell.faces.visible = true;
      }
      let holeProbe = null, materialProbe = null, wallOnlyPixels = null;
      if (name === 'containment_hole') {
        const hole = result.extrusion.region.loops.find(loop => loop.role === 'hole');
        const average = loop => loop.vertexIds.map(id => result.extrusion.region.vertices.find(vertex => vertex.id === id).pointMM)
          .reduce((sum, point, _, points) => sum.map((value, axis) => value + point[axis] / points.length), [0, 0, 0]);
        holeProbe = sample(pixels, average(hole));
        const top = result.faceRanges.find(face => face.kind === 'top-cap');
        const vertices = top.triangles[0].vertexIndices.map(index => result.mesh.positionsMM.slice(3 * index, 3 * index + 3));
        materialProbe = sample(pixels, [0, 1, 2].map(axis =>
          vertices.reduce((sum, vertex) => sum + vertex[axis] / 3, 0)));
        if (!holeProbe.background || materialProbe.background) {
          throw new Error(`Three Shell hole/material probe differs: ${JSON.stringify({ holeProbe, materialProbe, pixels: count(pixels) })}`);
        }
        for (const binding of candidate.faces) binding.object.visible = binding.face.kind === 'wall';
        wallOnlyPixels = count(render(wallCamera));
        for (const binding of candidate.faces) binding.object.visible = true;
        if (wallOnlyPixels < 100) throw new Error('Three Shell walls were not visible from an oblique view');
      }
      if ((triangleCount === 0 ? count(pixels) !== 0 : count(pixels) < 100) ||
          isolated.some(item => item.pixels < 30)) {
        throw new Error(`Three Shell pixels differ: ${name}`);
      }
      observations.push({ name, shellCount, faceCount, edgeCount, triangleCount,
        visiblePixels: count(pixels), isolated, holeProbe, materialProbe, wallOnlyPixels, hash: hash(pixels) });
      scene.remove(candidate.root); candidate.dispose();
    }
    if (observations[3].hash === observations[4].hash) {
      throw new Error('Real distance edit did not change the Three frame');
    }
    accepted = originals.containment_hole;
    display = createBaroCadBooleanExtrusionThreeMesh(accepted, options);
    scene.add(display.root);
    const acceptedFrame = render();
    if (hash(acceptedFrame) !== observations[0].hash ||
        !(renderer.getContext() instanceof WebGL2RenderingContext)) {
      throw new Error('Accepted Three Shell frame differs');
    }
    evidence = { fixtures: observations, acceptedHash: hash(acceptedFrame), webgl2: true,
      callerRetained: scene.children.includes(caller), trueEdgesVisible: false, refused: 0, disposed: false };
    window.__baroBooleanExtrusionThreeEvidence = evidence; show();
    document.querySelector('#edges').onclick = () => {
      const before = hash(render());
      scene.add(display.edgeRoot);
      const afterPixels = render();
      if (display.edges.length !== accepted.report.edgePathCount ||
          display.edgeRoot.children.length !== display.shells.length ||
          display.edgeRoot.getObjectByProperty('type', 'Mesh') ||
          hash(afterPixels) === before) {
        throw new Error('True native Curve edge display did not change the frame');
      }
      evidence.trueEdgesVisible = true;
      evidence.trueEdgesFrameHash = hash(afterPixels); show();
    };
    document.querySelector('#reject').onclick = () => {
      const before = hash(render());
      const forged = structuredClone(accepted); forged.mesh.positionsMM[0] += 1;
      const getter = { ...options }; let getterCalls = 0;
      Object.defineProperty(getter, 'basis', { enumerable: true,
        get() { getterCalls++; return options.basis; } });
      let refused = 0;
      for (const action of [
        () => createBaroCadBooleanExtrusionThreeMesh(forged, options),
        () => createBaroCadBooleanExtrusionThreeMesh(accepted, { ...options, basis: 'unknown' }),
        () => createBaroCadBooleanExtrusionThreeMesh(accepted, { ...options, unitsPerMillimeter: 0 }),
        () => createBaroCadBooleanExtrusionThreeMesh(accepted, getter),
      ]) { try { action(); } catch { refused++; } }
      if (refused !== 4 || getterCalls !== 0 || hash(render()) !== before ||
          !scene.children.includes(caller) || display.faces.some(binding => !binding.object.geometry.getAttribute('position'))) {
        throw new Error('Rejected Three Shell changed accepted display');
      }
      evidence.refused = refused; evidence.acceptedFrameRetained = true; show();
    };
    document.querySelector('#dispose').onclick = () => {
      const disposed = [];
      for (const binding of [...display.faces, ...display.edges]) {
        binding.object.geometry.addEventListener('dispose', () => disposed.push('geometry'));
        binding.object.material.addEventListener('dispose', () => disposed.push('material'));
      }
      display.dispose(); display.dispose();
      if (disposed.length !== 2 * (display.faces.length + display.edges.length) ||
          scene.children.includes(display.root) || scene.children.includes(display.edgeRoot) ||
          !scene.children.includes(caller) || count(render()) !== 0 ||
          document.querySelectorAll('canvas').length !== 1) {
        throw new Error('Three Shell disposal changed caller resources');
      }
      evidence.disposed = true; evidence.afterDisposePixels = 0;
      evidence.ownedResourcesDisposed = disposed.length; evidence.callerRetained = true; show();
    };
  } catch (error) {
    display?.dispose();
    evidence = { error: String(error), stack: error.stack };
    window.__baroBooleanExtrusionThreeEvidence = evidence; show();
  }
</script>

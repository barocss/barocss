<div class="max-w-sm mx-auto p-6 bg-white rounded-2xl shadow-lg border border-gray-100">
  <h2 class="text-xl font-semibold text-gray-900">Create your account</h2>
  <p class="mt-1 text-sm text-gray-500">Start your 14-day free trial. No credit card required.</p>

  <form class="mt-5 space-y-4">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700">Full name</label>
      <input id="name" type="text" placeholder="Jamie Rivera"
        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none" />
    </div>

    <div>
      <label for="email" class="block text-sm font-medium text-gray-700">Work email</label>
      <input id="email" type="email" placeholder="jamie@company.com"
        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none" />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
      <input id="password" type="password" placeholder="At least 8 characters"
        class="mt-1 w-full rounded-lg border border-gray-300 px-3 py-2 text-sm text-gray-900 placeholder-gray-400 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 focus:outline-none" />
    </div>

    <label class="flex items-start gap-2 text-sm text-gray-600">
      <input type="checkbox" class="mt-0.5 h-4 w-4 rounded border-gray-300 text-indigo-600 focus:ring-indigo-200" />
      <span>I agree to the <a href="#" class="text-indigo-600 hover:underline">Terms</a> and <a href="#" class="text-indigo-600 hover:underline">Privacy Policy</a>.</span>
    </label>

    <button type="submit"
      class="w-full rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-indigo-700 focus:ring-2 focus:ring-indigo-300 focus:outline-none transition">
      Create account
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-gray-500">
    Already have an account? <a href="#" class="font-medium text-indigo-600 hover:underline">Sign in</a>
  </p>
</div>

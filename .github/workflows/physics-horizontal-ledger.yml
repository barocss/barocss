name: Physics horizontal motion phase ledger
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/horizontal-motion-ledger.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-horizontal-motion-ledger.mjs'
      - '.github/workflows/physics-horizontal-ledger.yml'
  workflow_dispatch:
jobs:
  measured-phases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-horizontal
      - name: Run original offset/yaw horizontal decomposition
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-horizontal-motion-ledger.mjs | tee /tmp/physics1572-horizontal/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-horizontal-ledger
          path: /tmp/physics1572-horizontal/results.jsonl
          if-no-files-found: ignore

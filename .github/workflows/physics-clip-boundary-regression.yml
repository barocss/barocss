name: Physics clip boundary regression
on:
  pull_request:
    branches: [develop]
    paths:
      - 'packages/barocss-physics/src/contact-manifold.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-clip-boundary-regression.mjs'
      - '.github/workflows/physics-clip-boundary-regression.yml'
  workflow_dispatch:
jobs:
  clip-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - name: Verify clipping intersections remain within source edges
        if: github.event_name != 'pull_request'
        run: node examples/physics-contact-impulse-audit-1572/run-clip-boundary-regression.mjs

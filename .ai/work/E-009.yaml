  and adding ring-offset-{0,1,2,4,8}, makes ring-1/ring-2/focus:ring-2 compute a box-shadow byte-identical to
  Tailwind 4.1.13 (focus:ring-offset-2 alone emits box-shadow:none in both engines) with no control regression. E-008
  was INCONCLUSIVE only because its allowed.paths omitted packages/barocss/tests/, so the 4 frozen exact-AST ring
  tests that pin the parity-wrong v3 blue default fail pnpm check. Does that same fix, WITH those 4 tests updated to
  the Tailwind-v4 output, make pnpm check GREEN with no other test change and no product change beyond effects.ts +
  one changeset — and, when E-007's G1 and G2 are rerun unchanged on the fixed build, do the ring tokens the agent
  writes now render (E-007's frozen classifier reclassifies them RESOLVED)?

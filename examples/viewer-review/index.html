<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Viewer review files</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101923;color:#edf3f7;font:16px system-ui}
  main{max-width:1240px;margin:auto;padding:24px}h1{margin:0 0 8px}p{max-width:82ch;color:#b7c9d7}
  button,input{font:inherit}button,.open{padding:8px 12px;border:1px solid #71899b;border-radius:4px;background:#20394b;color:inherit}
  button[aria-pressed=true]{background:#516b21}button:disabled{opacity:.5}.tools{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
  canvas{display:block;width:800px;height:480px;max-width:100%;background:#06101a;border:1px solid #496175}
  .layout{display:grid;grid-template-columns:minmax(0,800px) minmax(200px,1fr);gap:24px}ul{padding:0;list-style:none}li{margin:10px 0;display:flex;gap:8px}
  pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;color:#b7c9d7}#status{min-height:2em;color:#f2db9b}
  @media(max-width:1000px){.layout{grid-template-columns:1fr}}
</style>
<main><h1>Viewer review files</h1>
<p>Save the camera, visible geometry and selection. Open the file to apply that review to the same document revision and loaded bodies. The file contains no CAD geometry.</p>
<div class="tools"><button id="save" disabled>Save review</button><label class="open">Open review <input id="open" type="file" accept=".json,application/json" disabled></label></div>
<div class="tools"><button id="original" disabled>Load original document</button><button id="revision" disabled>Load next revision</button><button id="other" disabled>Load other document</button></div>
<div class="layout"><section aria-label="Viewport"><canvas width="800" height="480" aria-label="CAD viewport"></canvas>
<div class="tools"><button id="orbit" disabled>Orbit</button><button id="pan" disabled>Pan right</button><button id="zoom" disabled>Zoom in</button><button id="fit" disabled>Fit</button><button id="clear" disabled>Clear selection</button><button id="show" disabled>Show all</button></div></section>
<aside><h2>Geometry</h2><ul id="geometry"></ul><p id="status" role="status">Loading CAD document…</p></aside></div>
<details><summary>Current review data</summary><pre id="state"></pre></details>
<script type="module" src="/bundle.js"></script></main></html>

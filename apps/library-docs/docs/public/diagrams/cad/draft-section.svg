<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">Draft of one box face: calculated Y–Z section</title>
  <desc id="desc">A 20 mm wide and 10 mm high section, viewed along X. A positive 10 degree draft removes a triangular wedge at the y equals zero face, moving its upper edge into the box by about 1.763270 mm. This is an idealized calculation diagram, not an API-generated image. The implementation's tiny neutral lift is not drawn.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#334155" stroke-width="1.5"/></marker></defs>
  <rect width="1000" height="650" fill="#fff"/>
  <g font-family="Arial, sans-serif" fill="#172033">
    <text x="55" y="48" font-size="26" font-weight="bold">One face drafted inward · +Z pull · +10°</text>
    <text x="55" y="80" font-size="17">Calculated section along X. Box length along X: 20 mm.</text>
    <path d="M120 500L172.898094 200H720V500Z" fill="#dbefe7" stroke="#287458" stroke-width="2"/>
    <path d="M120 500V200H172.898094Z" fill="#f8d6c8" stroke="#b75e3c" stroke-width="2"/>
    <path d="M120 500V200H720V500Z" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="7 5"/>
    <path d="M120 500H800M120 500V130" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="810" y="506" font-size="19">+Y</text><text x="95" y="125" font-size="19">+Z</text>
    <text x="54" y="525" font-size="16">y=0, z=0</text>
    <text x="335" y="365" font-size="22" fill="#215d48">Material kept</text>
    <path d="M65 290H140" fill="none" stroke="#b75e3c"/>
    <text x="24" y="264" font-size="15" fill="#994626">Removed</text><text x="24" y="283" font-size="15" fill="#994626">wedge</text>
    <path d="M120 176H172.898094" stroke="#334155" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="185" y="178" font-size="17">1.763270 mm inward at z = 10</text>
    <path d="M760 200V500" stroke="#334155" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="775" y="357" font-size="18">10 mm</text>
    <path d="M120 550H720" stroke="#334155" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="380" y="577" font-size="18">20 mm</text>
    <text x="195" y="468" font-size="17">y = z tan(10°)</text>
    <text x="280" y="523" font-size="16">Neutral plane: z = 0 mm (idealized)</text>
    <text x="55" y="612" font-size="16">Schematic only · not an API result · neutral lift of 0.000032 mm is not drawn</text>
  </g>
</svg>

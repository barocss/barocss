<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        keyframes: {
          floaty: { '0%,100%': { transform: 'translateY(0)' }, '50%': { transform: 'translateY(-6px)' } },
          fadein: { '0%': { opacity: 0, transform: 'translateY(8px)' }, '100%': { opacity: 1, transform: 'translateY(0)' } }
        },
        animation: {
          floaty: 'floaty 4s ease-in-out infinite',
          fadein: 'fadein 0.5s ease-out both'
        }
      }
    }
  }
</script>
</head>
<body class="bg-transparent">
  <div id="card" class="max-w-sm mx-auto p-1">
    <div class="animate-fadein rounded-3xl overflow-hidden shadow-xl bg-gradient-to-br from-sky-500 via-sky-600 to-indigo-700 text-white">
      <!-- Header -->
      <div class="flex items-start justify-between px-6 pt-6">
        <div>
          <h1 id="location" class="text-lg font-semibold tracking-tight">—</h1>
          <p id="datetime" class="text-xs text-sky-100/80">—</p>
        </div>
        <span id="badge" class="text-[11px] font-medium bg-white/20 backdrop-blur rounded-full px-3 py-1">—</span>
      </div>

      <!-- Main temp -->
      <div class="flex items-center justify-between px-6 py-4">
        <div class="flex items-baseline">
          <span id="temp" class="text-6xl font-light leading-none">--</span>
          <span class="text-2xl font-light ml-1">°</span>
        </div>
        <div id="icon" class="text-6xl animate-floaty select-none">☀️</div>
      </div>

      <!-- Condition + range -->
      <div class="px-6 pb-4">
        <p id="condition" class="text-base font-medium capitalize">—</p>
        <p class="text-xs text-sky-100/80 mt-0.5">
          <span id="feels">Feels like --°</span> ·
          H:<span id="high">--°</span> L:<span id="low">--°</span>
        </p>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-3 gap-px bg-white/10 border-t border-white/10">
        <div class="bg-white/5 px-3 py-4 text-center">
          <p class="text-[10px] uppercase tracking-wide text-sky-100/70">Humidity</p>
          <p id="humidity" class="text-sm font-semibold mt-1">--%</p>
        </div>
        <div class="bg-white/5 px-3 py-4 text-center">
          <p class="text-[10px] uppercase tracking-wide text-sky-100/70">Wind</p>
          <p id="wind" class="text-sm font-semibold mt-1">-- km/h</p>
        </div>
        <div class="bg-white/5 px-3 py-4 text-center">
          <p class="text-[10px] uppercase tracking-wide text-sky-100/70">UV Index</p>
          <p id="uv" class="text-sm font-semibold mt-1">--</p>
        </div>
      </div>

      <!-- Forecast -->
      <div id="forecast" class="flex justify-between px-4 py-4 bg-black/10"></div>
    </div>
  </div>

<script>
(function () {
  // Default sample data; overridden by tool result if provided.
  const fallback = {
    location: "San Francisco, CA",
    datetime: "Sat, Sep 26 · 2:40 PM",
    condition: "Partly cloudy",
    icon: "⛅",
    tempC: 21,
    feelsC: 20,
    highC: 23,
    lowC: 15,
    humidity: 62,
    windKph: 14,
    uv: 5,
    badge: "Updated now",
    forecast: [
      { day: "Sun", icon: "☀️", hi: 24, lo: 15 },
      { day: "Mon", icon: "⛅", hi: 22, lo: 14 },
      { day: "Tue", icon: "🌧️", hi: 19, lo: 13 },
      { day: "Wed", icon: "🌦️", hi: 20, lo: 14 },
      { day: "Thu", icon: "☀️", hi: 25, lo: 16 }
    ]
  };

  function readData() {
    // MCP hosts may inject data via a script tag or window global.
    try {
      const el = document.getElementById("weather-data");
      if (el && el.textContent.trim()) return JSON.parse(el.textContent);
    } catch (e) {}
    if (window.__WEATHER__ && typeof window.__WEATHER__ === "object") return window.__WEATHER__;
    return fallback;
  }

  const d = Object.assign({}, fallback, readData());
  const $ = (id) => document.getElementById(id);

  $("location").textContent = d.location;
  $("datetime").textContent = d.datetime;
  $("badge").textContent = d.badge;
  $("condition").textContent = d.condition;
  $("icon").textContent = d.icon;
  $("temp").textContent = Math.round(d.tempC);
  $("feels").textContent = "Feels like " + Math.round(d.feelsC) + "°";
  $("high").textContent = Math.round(d.highC) + "°";
  $("low").textContent = Math.round(d.lowC) + "°";
  $("humidity").textContent = d.humidity + "%";
  $("wind").textContent = d.windKph + " km/h";
  $("uv").textContent = d.uv;

  const fc = $("forecast");
  (d.forecast || []).forEach((f) => {
    const col = document.createElement("div");
    col.className = "flex flex-col items-center gap-1 text-center";
    col.innerHTML =
      '<span class="text-[11px] text-sky-100/80">' + f.day + '</span>' +
      '<span class="text-xl">' + f.icon + '</span>' +
      '<span class="text-xs font-semibold">' + Math.round(f.hi) + '°</span>' +
      '<span class="text-[11px] text-sky-100/70">' + Math.round(f.lo) + '°</span>';
    fc.appendChild(col);
  });
})();
</script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">경로를 따라 이동 · Sweep</title><desc id="desc">하나의 단면을 경로를 따라 보내 굽은 부품을 만듭니다. Conceptual CAD target design, not implementation evidence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#167d97" stroke-width="1.5"/></marker><linearGradient id="body"><stop stop-color="#b7d4e7"/><stop offset=".45" stop-color="#e5f1f7"/><stop offset="1" stop-color="#86b7d2"/></linearGradient></defs><rect width="1440" height="900" fill="#f5f7fa"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="40" y="44" font-size="16" fill="#576b80" font-weight="700">BAROCSS / CAD ROADMAP VISUAL STUDY 06</text><text x="40" y="93" font-size="34" fill="#16283b" font-weight="700">경로를 따라 이동 · Sweep</text><text x="40" y="130" font-size="19" fill="#526779" font-weight="400">하나의 단면을 경로를 따라 보내 굽은 부품을 만듭니다.</text><rect x="40" y="154" width="1360" height="39" rx="8" fill="#fff0ce"/><text x="58" y="180" font-size="17" fill="#78531a" font-weight="700">TARGET DESIGN / NOT IMPLEMENTATION EVIDENCE · 목표 디자인 · 실제 실행 화면 아님</text><rect x="40" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="62" y="256" font-size="17" fill="#50677d" font-weight="700">01  입력 형상 / INPUT</text><g transform="translate(40,0)"><ellipse cx="85" cy="355" rx="24" ry="24" fill="#dff3f2" stroke="#168c87" stroke-width="2" /><text x="45" y="310" font-size="16" fill="#263445" font-weight="400">단면 정면도</text><text x="46" y="405" font-size="18" fill="#168c87" font-weight="700">원 Ø10</text><path d="M270 490 A120 120 0 0 0 150 370" fill="none" stroke="#ce8b28" stroke-width="3" stroke-dasharray="7 5"/><text x="230" y="415" font-size="17" fill="#a26a13" font-weight="700">R30</text><text x="65" y="579" font-size="18" fill="#263445" font-weight="400">단면 1개 + 90° 원호 경로</text><text x="95" y="608" font-size="16" fill="#263445" font-weight="400">경로는 위에서 본 평면도</text></g><rect x="500" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="522" y="256" font-size="17" fill="#50677d" font-weight="700">02  조작 / OPERATION</text><g transform="translate(500,0)"><path d="M290 490 A140 140 0 0 0 150 350 L150 390 A100 100 0 0 1 250 490 Z" fill="#d7edf1" fill-opacity="0.5" stroke="#32556c" stroke-width="2" stroke-linejoin="round"/><path d="M270 490 A120 120 0 0 0 150 370" fill="none" stroke="#ce8b28" stroke-width="3" stroke-dasharray="7 5"/><line x1="250" y1="490" x2="290" y2="490" stroke="#168c87" stroke-width="2" /><line x1="220.71" y1="419.29" x2="248.99" y2="391.01" stroke="#168c87" stroke-width="2" /><line x1="150" y1="390" x2="150" y2="350" stroke="#168c87" stroke-width="2" /><path d="M300 477 A150 150 0 0 0 270 396" fill="none" stroke="#167d97" stroke-width="2.5" marker-end="url(#arrow)"/><text x="54" y="305" font-size="17" fill="#263445" font-weight="400">목표: 경로에 수직인 단면 유지</text><text x="51" y="580" font-size="18" fill="#263445" font-weight="400">경로를 따라 단면 방향도 회전</text><text x="58" y="608" font-size="16" fill="#263445" font-weight="400">녹색 선 = 투영된 단면의 위치</text></g><rect x="960" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="982" y="256" font-size="17" fill="#50677d" font-weight="700">03  목표 결과 / RESULT</text><g transform="translate(960,0)"><path d="M290 490 A140 140 0 0 0 150 350 L150 390 A100 100 0 0 1 250 490 Z" fill="url(#body)" fill-opacity="1" stroke="#32556c" stroke-width="2" stroke-linejoin="round"/><path d="M270 490 A120 120 0 0 0 150 370" fill="none" stroke="#ce8b28" stroke-width="3" stroke-dasharray="7 5"/><text x="73" y="305" font-size="17" fill="#526779" font-weight="700">결과 평면도 / TOP VIEW</text><ellipse cx="81" cy="463" rx="20" ry="20" fill="#b7d4e7" stroke="#32556c" stroke-width="2" /><text x="37" y="510" font-size="15" fill="#263445" font-weight="400">단면 상세</text><text x="61" y="579" font-size="18" fill="#263445" font-weight="400">목표: 일정 굵기의 굽은 원형 봉</text><text x="54" y="608" font-size="16" fill="#263445" font-weight="400">속이 빈 관이 아님 · 양 끝 cap</text></g><rect x="40" y="658" width="1360" height="156" rx="14" fill="#e9eff5"/><text x="62" y="690" font-size="17" fill="#34516b" font-weight="700">선택 · 입력값 · 동작 설계 / COMMAND CONTEXT</text><text x="62" y="724" font-size="18" fill="#263445" font-weight="400">선택: 원형 Profile 01 (Ø10 mm) + Rail 01 (중심 반경 30 mm, 90°)</text><text x="62" y="753" font-size="18" fill="#263445" font-weight="400">이 도해의 목표: 단면을 경로 접선에 수직으로 유지하는 moving-frame Sweep + 양 끝 cap</text><text x="62" y="782" font-size="18" fill="#263445" font-weight="400">현재 #1550은 고정 방향 병진 Surface입니다. 회전 단면·굽은 Solid는 이 전달 기록에 포함되지 않습니다.</text><text x="40" y="849" font-size="16" fill="#526779" font-weight="400">근거: #534 PART-04 · #537 SURF-04 · #1550 고정 방향 병진 Sweep Surface</text><text x="40" y="877" font-size="15" fill="#6b7c8d" font-weight="400">수동 설계 예시 · 제품 실행/구현 증거 아님 · cap과 솔리드 유효성은 별도 지원·검증이 필요합니다.</text></g></svg>
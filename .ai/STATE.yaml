      bug, not to abandon per-family patching.
  - id: D17
    date: 2026-09-25
    decision: >
      No outcome change this pass. The 2026-09-25 human directive to re-derive outcomes from VISION's "Who it is for"
      (v0-like AI UI platforms; parity table stakes + three wins O4/O5/O6 vs @tailwindcss/browser; park O3) was

name: Physics fallback torque reference
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/fallback-torque-reference.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-fallback-torque-reference.mjs'
      - '.github/workflows/physics-fallback-torque-1572.yml'
  workflow_dispatch:
jobs:
  torque-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/p1572-fallback-torque
      - name: Verify actual fallback single-point torque and impulse arithmetic
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-fallback-torque-reference.mjs | tee /tmp/p1572-fallback-torque/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-fallback-torque-reference
          path: /tmp/p1572-fallback-torque/results.jsonl
          if-no-files-found: ignore

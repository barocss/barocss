      --baro-translate-* @property defaults); the single L3 G1/G2/G3 rerun is deferred to that fully-fixed build.
    why: >
      A PARTIAL parity batch may merge its landed families (human directive) when each reaches exact per-token L2
      parity with green check and no regression and each dropped family touched no product code — all true here — so
      the "merge only if PROVEN" rule applies to the landed part, not the whole batch. Product-code merges still wait
      for the human-approved label. F2's miss has a second, independent cause (wrong value formula), so it is a
      separate parity fix, not a scope failure of this batch.


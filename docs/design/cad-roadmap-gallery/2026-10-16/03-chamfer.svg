<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">모서리 재료를 덜어내기 · Chamfer</title><desc id="desc">선택한 모서리를 잘라 작은 사선 면으로 바꿉니다. Conceptual CAD target design, not implementation evidence.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#167d97" stroke-width="1.5"/></marker></defs><rect width="1440" height="900" fill="#f5f7fa"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="40" y="44" font-size="16" fill="#576b80" font-weight="700">BAROCSS / CAD ROADMAP VISUAL STUDY 03</text><text x="40" y="93" font-size="34" fill="#16283b" font-weight="700">모서리 재료를 덜어내기 · Chamfer</text><text x="40" y="130" font-size="19" fill="#526779" font-weight="400">선택한 모서리를 잘라 작은 사선 면으로 바꿉니다.</text><rect x="40" y="154" width="1360" height="39" rx="8" fill="#fff0ce"/><text x="58" y="180" font-size="17" fill="#78531a" font-weight="700">TARGET DESIGN / NOT IMPLEMENTATION EVIDENCE · 목표 디자인 · 실제 실행 화면 아님</text><rect x="40" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="62" y="256" font-size="17" fill="#50677d" font-weight="700">01  입력 형상 / INPUT</text><g transform="translate(40,0)"><polygon transform="translate(0,-45)" points="145,359 337,431 337,527 145,455" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="49,423 241,495 337,431 145,359" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="337,527 241,591 241,495 337,431" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><line transform="translate(0,-45)" x1="145" y1="359" x2="337" y2="431" stroke="#e79824" stroke-width="2" /><text x="80" y="575" font-size="18" fill="#9c650d" font-weight="700">선택한 위쪽 앞 모서리</text></g><rect x="500" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="522" y="256" font-size="17" fill="#50677d" font-weight="700">02  조작 / OPERATION</text><g transform="translate(500,0)"><polygon transform="translate(0,-45)" points="145,375 337,447 337,527 145,455" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="49,423 241,495 325,439 133,367" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="133,367 325,439 337,447 145,375" fill="#f5cc7c" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="337,527 241,591 241,495 325,439 337,447" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><line transform="translate(0,-45)" x1="145" y1="359" x2="337" y2="431" stroke="#c68520" stroke-width="2" stroke-dasharray="6 4"/><text x="56" y="575" font-size="18" fill="#263445" font-weight="400">기존 모서리 → 평평한 새 면</text></g><rect x="960" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="982" y="256" font-size="17" fill="#50677d" font-weight="700">03  목표 결과 / RESULT</text><g transform="translate(960,0)"><polygon transform="translate(0,-45)" points="145,375 337,447 337,527 145,455" fill="#b7d4e7" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="49,423 241,495 325,439 133,367" fill="#dcebf5" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="133,367 325,439 337,447 145,375" fill="#74bfbd" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><polygon transform="translate(0,-45)" points="337,527 241,591 241,495 325,439 337,447" fill="#8db8d4" stroke="#32556c" stroke-width="2" stroke-linejoin="round" /><text x="100" y="574" font-size="18" fill="#236e70" font-weight="700">Chamfer 01 · 4 mm</text><text x="46" y="604" font-size="17" fill="#263445" font-weight="400">둥근 필렛이 아닌 평평한 사선 면</text></g><rect x="40" y="658" width="1360" height="156" rx="14" fill="#e9eff5"/><text x="62" y="690" font-size="17" fill="#34516b" font-weight="700">선택 · 입력값 · 동작 설계 / COMMAND CONTEXT</text><text x="62" y="724" font-size="18" fill="#263445" font-weight="400">선택: Body 01의 위쪽 앞 모서리   |   동일 거리: 4 mm + 4 mm</text><text x="62" y="753" font-size="18" fill="#263445" font-weight="400">황색 점선은 제거 전 모서리. 새 사선 면은 재료 제거 결과이며 재료 추가가 아닙니다.</text><text x="62" y="782" font-size="18" fill="#263445" font-weight="400">크기 초과·부적격 모서리는 이유를 보여주고 마지막 승인 형상과 입력값을 유지하도록 설계합니다.</text><text x="40" y="849" font-size="16" fill="#526779" font-weight="400">근거: #536 DETAIL-02 · #2024 선택/명령 컨텍스트 · #2018의 제한된 bevel 전제</text><text x="40" y="877" font-size="15" fill="#6b7c8d" font-weight="400">도해는 수동 설계한 예시입니다. 형상 비례·치수는 제안이며 API 지원 범위나 검증 결과가 아닙니다.</text></g></svg>
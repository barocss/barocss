<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Canvas2D atlas game</title>
<style>body{font:14px system-ui;margin:20px;max-width:900px}button{margin:0 8px 10px 0}canvas{display:block;width:320px;height:200px;touch-action:none;background:#202838}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{max-width:72ch}#score{font-weight:700}</style>
<script type="importmap">{"imports":{"@barocss/canvas2d":"../dist/index.js"}}</script>
</head><body><h1>Atlas token game</h1>
<p>Drag the colored actor onto each yellow token. Release the pointer to collect it. The actor's transparent upper corner passes input to the background. Play changes its color. Step advances 100 ms while paused.</p>
<p>Score: <span id="score">0 / 3</span></p>
<button id="play">Play</button><button id="pause">Pause</button><button id="step">Step 100 ms</button>
<button id="reset">Reset</button><button id="invalid">Reject crop edit</button><button id="missing">Reject missing asset</button>
<button id="dispose">Dispose</button><button id="load">Load atlas</button><button id="cancel-load">Cancel load</button>
<canvas id="scene" width="640" height="400" aria-label="Draggable actor and three tokens"></canvas>
<p id="status" role="status">Loading atlas</p><details><summary>Actual observations</summary><pre id="observation"></pre></details>
<script type="module" src="./game.mjs"></script></body></html>

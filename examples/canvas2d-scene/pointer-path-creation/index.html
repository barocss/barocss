<!doctype html><html lang="en"><meta charset="utf-8"><link rel="icon" href="data:,"><title>Create curves with pointer controls</title><link rel="stylesheet" href="style.css"><body><main><h1>Create a curve with pointer controls</h1><p>Place its start and end. For a cubic, place the first control. Drag the final control to complete the curve. Escape cancels creation.</p><div class="toolbar"><label>Mode <select id="mode"><option value="Q">Create quadratic</option><option value="C">Create cubic</option><option value="edit">Edit control</option></select></label><label>Path <select id="path"><option value="">None</option></select></label><label>Control <select id="slot"><option value="q">Q</option><option value="c1">C1</option><option value="c2">C2</option></select></label><button id="delete-selected">Delete selected path</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Download document</button><label>Open <input id="open" type="file" accept="application/json,.json"></label><button id="dispose">Dispose</button></div><div class="coordinates view-controls"><label>Pan X <input id="pan-x" type="text"></label><label>Pan Y <input id="pan-y" type="text"></label><label>Zoom <select id="view-zoom"><option value="0.75">0.75</option><option value="1">1</option><option value="1.1">1.1</option><option value="1.25">1.25</option></select></label><button id="apply-view">Apply view</button><button id="reset-view">Reset view</button></div><div id="stage"><canvas id="scene"></canvas><div id="handles"><button id="handle" class="control" data-control="1">●</button></div></div><div class="coordinates"><label>Local X <input id="x"></label><label>Local Y <input id="y"></label><button id="apply">Apply coordinates</button><label>Fill RGB <input id="fill-rgb" type="text" placeholder="#RRGGBB"></label><button id="apply-fill-rgb">Apply fill RGB</button><label>Stroke width (logical px) <input id="stroke-width" type="text" placeholder="1..16"></label><button id="apply-stroke-width">Apply stroke width</button><label>Stroke RGB <input id="stroke-rgb" type="text" placeholder="#RRGGBB"></label><button id="apply-stroke-rgb">Apply stroke RGB</button><label>Origin X <input id="origin-x" type="text" placeholder="-64..64"></label><label>Origin Y <input id="origin-y" type="text" placeholder="-64..64"></label><button id="apply-origin">Apply origin</button></div><p id="status">Loading</p><details><summary>Observations</summary><pre id="observation"></pre></details></main><script type="module" src="main.mjs"></script></body></html>

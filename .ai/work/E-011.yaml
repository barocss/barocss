    - "Causal link (arm1): the report flagged 5 misses across G1/G2/G3 and the actor fixed all 5 before claiming done (flagged->fixed 5/5), naming the exact classes: G1 'the hook flagged three classes that don't resolve: -translate-x-1/2, ring-1, shadow'; G2 'focus:ring-2 as UNDEFINED-VAR ... I'll swap to a focus outline'; G3 'leading-relaxed references an undefined CSS variable ... let me replace it'. .ai/evidence/E-011/runs/G{1,2,3}.arm1.json (assistant_text, injected_report)."
    - "BaroCSS-unique (arm2 control): the computed-style report was delivered (66-74 rows) and used — the G3 arm2 agent fixed the invisible-border gap from computed style (K5) — but computed style cannot tell 'broken' from 'state-inactive/plausible-value', so focus:ring-2 (box-shadow:none), hover:-translate-y-1 (translate:none), leading-relaxed (plausible line-height) shipped silently. arm2 self-fixed 1/6, same as arm0. .ai/evidence/E-011/runs/G{1,2,3}.arm2.json."
    - "L2 harness (frozen E-007 assets re-pointed on path only; two new evidence scripts add no product code): self-test gate passes (site styled; 13/13 gating classifications incl. all K10 families as PARITY-MISS; 9 grader controls + extractor) — node .ai/evidence/E-011/selftest.mjs. Runs: node .ai/evidence/E-011/run.mjs <G1|G2|G3> <arm1|arm2> (pin: git worktree add /tmp/e011-pin bf979c6 && cd /tmp/e011-pin && pnpm install; PW_MCP_DIR=<@playwright/mcp 0.0.76>). Full write-up: .ai/evidence/E-011/SUMMARY.md."
  learning: >
    Showing the agent, right after it generates and before it claims done, a per-class BaroCSS resolution report built
    only from the runtime's existing has()/getCss() (marking each class RESOLVED / UNRESOLVED / EMPTY-RULE /
    UNDEFINED-VAR) cut first-try silent parity misses from 7-of-8 (arm0) to 0 (arm1) for this strong actor, and a
    browser computed-style control (arm2) did not (5 shipped silently). The agent fixed exactly the classes the report
    flagged, citing UNDEFINED-VAR. Criterion 5 (BaroCSS-unique information) HOLDS for option B: class->rule resolution
    state ("this class became nothing / references an undefined var") is knowledge only the engine has; final pixels
    (computed style) cannot phrase it, because they can't separate a broken rule from an inactive state or a plausible
    value. This is free-form classes with runtime delivery (the shared core of both target flows); it does NOT claim
    either target flow end to end (not the code-gen pipeline flow 1, not the json-render/catalog spec flow 2).
  unknown:

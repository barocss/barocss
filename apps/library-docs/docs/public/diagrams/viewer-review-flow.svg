<svg xmlns="http://www.w3.org/2000/svg" width="800" height="790" viewBox="0 0 800 790" role="img" aria-labelledby="title desc">
  <title id="title">Save and restore a Viewer review state</title>
  <desc id="desc">Load a supported revisioned CAD document or assembly, set the view and capture a detached review state. The host saves and reads JSON; geometry is not in this file. Apply validates the same scene identity, revision, scale and ordered loaded subset, then camera, visibility and selection before presentation. Only a successful presentation commits accepted state. Validation refusal leaves accepted state and drawing unchanged. Presenter failure keeps accepted CPU state and attempts recovery; restored pixels are not guaranteed. This diagram is conceptual, not an API result capture.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#526277"/></marker>
  </defs>
  <rect width="800" height="790" rx="12" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#192b3e">
    <text x="400" y="32" text-anchor="middle" font-size="24" font-weight="700">Viewer review: save the view, keep the CAD separate</text>
    <text x="400" y="58" text-anchor="middle">Conceptual source flow · revision pins do not authenticate contents</text>
    <g fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)">
      <path d="M280 151V177"/><path d="M280 241V267"/>
      <path d="M280 339V365"/><path d="M280 443V469"/>
      <path d="M280 555V581"/><path d="M280 645V671"/>
      <path d="M520 510H550"/><path d="M520 612H550"/>
    </g>
    <rect x="40" y="85" width="480" height="66" rx="8" fill="#e8f1ff" stroke="#7593ba"/>
    <text x="280" y="111" text-anchor="middle" font-weight="700">1 · Load the exact CAD scene separately</text>
    <text x="280" y="136" text-anchor="middle">Supported revisioned primitive document or assembly</text>
    <rect x="40" y="177" width="480" height="64" rx="8" fill="#e8f1ff" stroke="#7593ba"/>
    <text x="280" y="203" text-anchor="middle" font-weight="700">2 · Set camera, visibility and selection</text>
    <text x="280" y="227" text-anchor="middle">Selection must refer to visible geometry</text>
    <rect x="40" y="267" width="480" height="72" rx="8" fill="#ffffff" stroke="#8c9bad"/>
    <text x="280" y="293" text-anchor="middle" font-weight="700">3 · captureReviewState() → detached object</text>
    <text x="280" y="318" text-anchor="middle">JSON.stringify → host saves the JSON file</text>
    <rect x="550" y="267" width="210" height="176" rx="8" fill="#fff4df" stroke="#b89a5f"/>
    <text x="655" y="294" text-anchor="middle" font-weight="700">Host owns file I/O</text>
    <text x="568" y="323">JSON has no geometry</text>
    <text x="568" y="347">or CAD source.</text>
    <text x="568" y="375">It also omits motion,</text>
    <text x="568" y="399">materials, measurements</text>
    <text x="568" y="423">and layers.</text>
    <rect x="40" y="365" width="480" height="78" rx="8" fill="#ffffff" stroke="#8c9bad"/>
    <text x="280" y="392" text-anchor="middle" font-weight="700">4 · Host reads JSON → JSON.parse</text>
    <text x="280" y="418" text-anchor="middle">Load the same scene, then applyReviewState(object)</text>
    <rect x="40" y="469" width="480" height="86" rx="8" fill="#edf0ff" stroke="#8288bd"/>
    <text x="280" y="495" text-anchor="middle" font-weight="700">5 · Validate before presentation</text>
    <text x="280" y="520" text-anchor="middle">Scene ID + revision + scale + ordered loaded subset</text>
    <text x="280" y="544" text-anchor="middle">Camera + visibility + selection + restrictions</text>
    <rect x="550" y="469" width="210" height="86" rx="8" fill="#fff0ef" stroke="#bf7e77"/>
    <text x="655" y="495" text-anchor="middle" font-weight="700">Mismatch → refuse</text>
    <text x="568" y="520">Accepted state and</text>
    <text x="568" y="544">drawing stay unchanged.</text>
    <rect x="40" y="581" width="480" height="64" rx="8" fill="#edf0ff" stroke="#8288bd"/>
    <text x="280" y="607" text-anchor="middle" font-weight="700">6 · Present the complete candidate</text>
    <text x="280" y="631" text-anchor="middle">Accepted CPU state is not committed yet</text>
    <rect x="550" y="581" width="210" height="150" rx="8" fill="#fff0ef" stroke="#bf7e77"/>
    <text x="655" y="607" text-anchor="middle" font-weight="700">Presenter throws</text>
    <text x="568" y="634">Keep accepted CPU state.</text>
    <text x="568" y="660">Attempt prior drawing.</text>
    <text x="568" y="687">Recovery can also fail:</text>
    <text x="568" y="713">pixels are not guaranteed.</text>
    <rect x="40" y="671" width="480" height="60" rx="8" fill="#e0f2e9" stroke="#689c88"/>
    <text x="280" y="697" text-anchor="middle" font-weight="700">Success → commit accepted review state</text>
    <text x="280" y="721" text-anchor="middle">Camera + visibility + selection</text>
    <text x="400" y="767" text-anchor="middle">A saved view does not recreate CAD geometry or certify a measurement.</text>
  </g>
</svg>

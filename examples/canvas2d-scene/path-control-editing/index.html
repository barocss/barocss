<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width"><title>Path control editing</title><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"@barocss/canvas2d":"../../../packages/barocss-canvas2d/dist/index.js","@barocss/canvas2d/document":"../../../packages/barocss-canvas2d/dist/document.js"}}</script></head><body>
<main><h1>Edit a curve by its controls</h1><p>Select the blue quadratic or pink cubic, then drag a control. One completed drag adds one history step. Escape cancels a drag.</p>
<div class="toolbar"><label>Path <select id="path"><option value="Quadratic">Quadratic</option><option value="Cubic">Cubic</option></select></label><button id="split" hidden>Insert midpoint</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="save">Save document</button><label class="file">Open document <input id="open" type="file" accept=".json,application/json"></label><button id="dispose">Dispose</button></div>
<div id="stage"><canvas id="scene"></canvas><div id="handles"><button id="q" data-slot="q" class="control" aria-label="Quadratic control">Q</button><button id="c1" data-slot="c1" class="control" aria-label="Cubic first control">1</button><button id="c2" data-slot="c2" class="control" aria-label="Cubic second control">2</button><button id="end" data-slot="end" class="control" aria-label="Inserted curve anchor" hidden>A</button></div></div>
<div class="coordinates"><strong id="selection">Quadratic control</strong><label>Local X <input id="x" value="45"></label><label>Local Y <input id="y" value="5"></label><button id="apply">Apply coordinates</button></div><p id="status" role="status">Loading</p><details><summary>Observations</summary><pre id="observation"></pre></details></main><script type="module" src="./main.mjs"></script></body></html>

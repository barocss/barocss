<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>Canvas2D polygon mask</title>
<style>body{font:14px system-ui;margin:20px;max-width:1000px}button,input{margin:0 8px 12px 0}canvas{display:block;width:320px;height:240px;background:#333;touch-action:none}pre{white-space:pre-wrap;overflow-wrap:anywhere}p{max-width:78ch}</style>
</head><body><h1>Concave polygon mask</h1>
<p>A copied L mask clips the red sprite, white glyph, gradient path, stroke and group hit area. A rotated frame adds its rectangle clip. The blue, additive and filled siblings follow the masked group.</p>
<button id="mask">Edit or restore Mask</button><button id="remove">Remove Mask</button><button id="mirror">Mirror</button>
<button id="invalid">Reject invalid Mask</button><button id="save">Save document</button>
<label>Open document <input id="open" type="file" accept=".json,application/json"></label>
<button id="png">Export PNG</button><button id="dispose">Dispose</button>
<canvas id="scene" width="640" height="480"></canvas><p id="status" role="status"></p><pre id="observation"></pre>
<script type="module" src="./polygon-mask.mjs"></script></body></html>

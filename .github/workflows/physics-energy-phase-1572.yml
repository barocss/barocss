name: Physics integrated versus contact mechanical energy
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/total-energy-phase-ledger.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-total-energy-phase-ledger.mjs'
      - '.github/workflows/physics-energy-phase-1572.yml'
  workflow_dispatch:
jobs:
  phase-energy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-energy-phases
      - name: Execute original OFFSET/YAW full-step independent gravity/reference energy split
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-total-energy-phase-ledger.mjs | tee /tmp/physics1572-energy-phases/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-energy-phase-results
          path: /tmp/physics1572-energy-phases/results.jsonl
          if-no-files-found: ignore

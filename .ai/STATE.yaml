# Re-derived from VISION "Who it is for" (human directive 2026-09-25, D17): audience is developers on
# v0-like AI UI platforms; BaroCSS renders their Tailwind v4 markup with no build, preview -> production.
# O2 parity is table stakes; O4-O6 are the three wins over @tailwindcss/browser; O3 parked. Measure every
# win claim against @tailwindcss/browser AND a built Tailwind v4 stylesheet on realistic generated UI first.
outcomes:
  O1:
    status: done           # D14: K3, K5, K7, K8, K9; zero BaroCSS changes
    statement: An AI agent can modify+verify styling on a running BaroCSS page with the smallest BaroCSS-specific surface.
  O2:
    status: active         # table stakes (VISION): generated markup is Tailwind v4, any divergence is a broken UI (K10)
    statement: An AI generates new UI with BaroCSS classes that render exactly like Tailwind v4 on the first try (parity).
  O3:
    status: parked         # D17: not a goal now unless a win needs it
    statement: An AI can explain why an existing element looks the way it does (styling provenance).
  O4:
    status: candidate      # win 1
    statement: BaroCSS is production-grade with no build — size, runtime cost, caching and no FOUC comparable to a built Tailwind v4 stylesheet, beating @tailwindcss/browser.
  O5:
    status: candidate      # win 2
    statement: While an AI streams markup, BaroCSS styles each class as soon as it appears (vs @tailwindcss/browser).
  O6:
    status: candidate      # win 3
    statement: Brand and theme change live at runtime with no rebuild (vs @tailwindcss/browser).

knowledge:
  proven:
    - {id: K2, level: L2, fact: "astToJson (branch codex/pr-feature-evidence, unmerged) serializes AST; no scenario needs it."}
    # K3-K9 are O1-era evidence (outcome done, D14); compacted, full text in git log -p -- .ai/STATE.yaml.
    - {id: K3, level: L3, fact: "E-001: a real agent (claude-opus-4-8, Playwright MCP only, fresh context) modified+verified classes on a live page 4/4, claims matched the hidden grader; no BaroCSS help needed. n=1/task, all classes resolved. .ai/evidence/E-001/."}
    - id: K4
      level: L1
      fact: >
        BaroCSS fails silently for some Tailwind v4 classes: empty rule (text-balance/pretty/wrap/nowrap,
        text-shadow-*), rule with an undefined var (aspect-video, font-sans), or no rule plus a console
        warning (rounded-4xl, [prop:value]). Also no effect: *-xs scales, rotate-x-*, perspective-*,
        bg-(--var), outline-hidden, wrap-anywhere, mask-*, bg-radial/conic. Arbitrary values on known
        utilities work (aspect-[16/9], rounded-[2rem], text-[42px], bg-[#hex]).
      caveat: >
        Hand probe 2026-09-24; E-002's four classes are L2 (.ai/evidence/E-002/). Parity gaps are not work
        items: K5 shows they did not cause false claims.
    - {id: K5, level: L3, fact: "E-002: same actor, 4 tasks whose natural class is a K4 no-op. Grader 4/4, no false 'done'; all 17 no-ops detected pre-report (mainly computed style), recovered only where an arbitrary value exists. Detecting unresolved classes is AGENT-owned for this actor. Silent empty rules cost turns, not false claims. .ai/evidence/E-002/."}
    - {id: K6, level: L2, fact: "E-003: theme.extend.colors.brand via updateConfig makes bg-brand work (deep-merge); theme.extend.borderRadius only emits :root --radius-* (rounded-* names hard-coded), no config route adds rounded-4xl; no plugin hook. {DEFAULT} colour objects throw. .ai/evidence/E-003/."}
    - {id: K7, level: L3, fact: "E-004: same actor on fixtures added theme.extend.colors.brand live, used bg-brand 3/3, claims agree; discovery via page source/exports/global then updateConfig.toString(). Arm A passed via a duplicate non-observing CDN runtime. .ai/evidence/E-004/."}
    - {id: K8, level: L2, fact: "E-005 on apps/barocss-site: vite dev import() of the served module URL returns baroStart's runtime; updateConfig replaces the whole config so a bare theme call drops preflight (config-preserving calls pass); production build exposes no route. No agent runs. .ai/evidence/E-005/."}
    - {id: K9, level: L3, fact: "E-006: same actor on the site's vite dev (app-origin-only) read updateConfig's source and passed a config-preserving object to the page's own runtime, used bg-brand 3/3, 0 regressions, preflight kept, claims agree. 0/3 made the bare call (drop-then-notice unobserved); dev /@fs exposes repo source, production has none. .ai/evidence/E-006/."}
    - id: K10
      level: L3
      fact: >
        E-007: same actor/prompt on apps/barocss-site's vite dev, natural generation of 3 new sections (G1 pricing,
        G2 newsletter, G3 testimonials). First-try silent parity misses per section 5/1/2; the agent's own
        verification caught 1 of 8 (only a property it happened to read); 7 shipped under a "done" claim naming
        none, so all 3 claims disagree with the grader (FAIL). Families: ring box-shadow composition (undefined
        --baro-shadow / --baro-inset-shadow / --baro-inset-ring-shadow; focus:ring-offset-2 has no rule),
        single-axis translate (other-axis --baro-translate-* undefined), theme var name (--shadow-default,
        --line-height-relaxed undefined). Also preflight sets no border-style:solid, so bare border/border-t are
        invisible page-wide (3/3, outside K4's definition). For generation, class -> rule parity is a correctness gap.
      caveat: >
        n=1 per task, one strong model; remaining misses are state-only (focus:/hover:) or cosmetic. Contrasts K5,
        where the same actor caught every no-op on modify tasks. Evidence: .ai/evidence/E-007/SUMMARY.md, runs/, audit.json.
    - id: K11
      level: L2
      fact: >
        E-008: the minimum edit in packages/barocss/src/presets/effects.ts closes the ring box-shadow parity family
        (K10) — register --baro-shadow/--baro-inset-shadow/--baro-inset-ring-shadow via @property 0 0 #0000
        (Tailwind v4's mechanism), drop the hardcoded v3 blue --baro-ring-color so a lone ring defaults to
        currentColor, add ring-offset-{0,1,2,4,8}. ring-1/ring-2/focus:ring-2 then compute box-shadow byte-identical
        to Tailwind 4.1.13; focus:ring-offset-2 alone emits box-shadow:none in both engines (parity). No control
        regressed; the real-Tailwind compat/compare.test.ts passes with the fix. Per-family patching reaches exact parity.
      caveat: >
        INCONCLUSIVE, not merged: the contract's allowed.paths omitted packages/barocss/tests/, so 4 exact-AST ring
        tests that froze the parity-wrong v3 blue default fail pnpm check; L3 (G1/G2 rerun) not run. Re-issued as
        E-009 with scope fixed. Branch ai/E-008-ring-parity kept as reference. Evidence: .ai/evidence/E-008/.
  disproven: []
  working_assumptions:     # L0; plausible but untested, don't treat as proven
    - Natural-language reasoning doesn't belong inside BaroCSS.
    - Visual/semantic verification belongs to browser/agent tooling.
    - AI-specific BaroCSS APIs are not yet shown to be needed.
  unknown:                 # seeds for STRATEGY; unordered, not a backlog
    - id: U1
      q: Do weaker/cheaper models still verify via computed style and avoid false "done" on K4 no-ops (K3/K5)?
    - id: U3

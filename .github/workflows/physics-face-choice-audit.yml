name: Physics face choice audit
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/face-choice-audit.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-face-choice-audit.mjs'
      - '.github/workflows/physics-face-choice-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/p1572-face-choice
      - name: Trace original OFFSET and YAW source face selections
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-face-choice-audit.mjs | tee /tmp/p1572-face-choice/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-face-choice
          path: /tmp/p1572-face-choice/results.jsonl
          if-no-files-found: ignore

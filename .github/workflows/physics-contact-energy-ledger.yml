name: Physics contact energy ledger
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/contact-energy-ledger.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-contact-energy-ledger.mjs'
      - '.github/workflows/physics-contact-energy-ledger.yml'
  workflow_dispatch:
jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics1572-energy
      - name: Run same-contact phase energy experiment
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-contact-energy-ledger.mjs | tee /tmp/physics1572-energy/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-energy
          path: /tmp/physics1572-energy/results.jsonl
          if-no-files-found: ignore

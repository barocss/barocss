non_goals:
  - Any product code change (packages/**, apps/**). This is a measurement over recorded artifacts; do not add a report/classifier API, an engine, a serializer, or any abstraction to packages/barocss. Productizing the report is explicitly forbidden here and until n>=3, a weaker actor, and this accuracy check are all in hand (human directive).
  - Any new agent/generation run. Step 2 (a fresh run on a post-parity build + a weaker actor) is a SEPARATE later contract, decided only if this step's invalid count is about 0 or ambiguous. This contract runs no `claude -p`, spawns no actor.
  - Changing the frozen classifier (classify.mjs) logic, the AGENT/PARITY-MISS/RESOLVED definitions, or E-011's recorded runs/reports. Only file paths in the copied classifier and the new analysis scripts may be authored.
  - Re-scoring the E-011 verdict or re-running its arms. This measures the durability of what E-011 already proved; it does not re-open K13.
  - Moving the pin off bf979c6 (which would erase the recorded misses), or measuring against Tailwind != 4.1.13.
  - Folding in O3 (styling provenance). O2 only.
evidence:
  level_required: L2
  proves_yes: >
    L2, deterministic, over the full token universe of E-007's + E-011's recorded generated sections using the
    byte-identical frozen classifier: (A) every AGENT token listed with exactly one bucket and a reason, per-bucket
    counts and the genuinely-invalid total reported; and (B) precision and recall of the arm1 has()/getCss() flags
    vs the classifier's PARITY-MISS labels computed, with every false positive and false negative listed token by
    token, plus the count of genuinely-invalid (AGENT) tokens the report flagged. The rerun command reproduces both
    tables from committed inputs. (This is a measurement: "PROVEN" means the numbers exist and are reproducible, not
    that any hypothesis held — the durability read then states which decision_it_informs branch the numbers support.)
  proves_no: >
    Not applicable as a yes/no; the informative negative is a measured one — e.g. the genuinely-invalid AGENT count
    is about 0 (nearly all flagged classes are parity-family gaps the lane is closing) and/or the report's flags map
    almost entirely onto PARITY-MISS with few invalid tokens flagged. Record that read explicitly; it triggers Step 2
    before any flow-1 test. INCONCLUSIVE if a required recorded artifact is missing/unreadable, the frozen classifier
    cannot be run over an unlabeled token even after one boot of the pinned build, or the token universe cannot be
    reconstructed from the runs — say exactly what is missing.
budget: >
  1 session, offline. No agent runs. At most one boot of the pinned build, and only if a token lacks a recorded
  label. Read at most ~5 product files (has()/getCss() semantics only). This is a bounded deterministic measurement,
  not a search: once both tables are computed over the full token universe, STOP.
stop_when:
  - Both (A) the full AGENT-token bucket table and (B) the precision/recall table (with FP/FN token lists) are computed over the entire recorded token universe -> PROVEN (numbers reproducible).
  - A required recorded artifact (E-007/E-011 runs or audit) is missing or unreadable, or the frozen classifier cannot label an unlabeled token even after one pinned-build boot -> INCONCLUSIVE; name what is missing.
  - The next step would touch a non_goal, a path outside .ai/evidence/E-012/, need product code, or need a new agent run -> stop.
  - The budget is used up.


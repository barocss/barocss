<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Native filled CAD Boolean mesh in Babylon.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; width: 800px; height: 520px; border: 1px solid #44617d; }
  button { margin: 12px 8px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Native filled CAD Boolean mesh · Babylon.js</h1>
  <p>Native triangles fill the material; the hole and separated components remain distinct.</p>
  <canvas id="view" width="800" height="520"></canvas>
  <button id="reject" type="button">Try invalid candidates</button>
  <button id="dispose" type="button">Dispose display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Engine } from '@babylonjs/core/Engines/engine.js';
  import { Scene } from '@babylonjs/core/scene.js';
  import { Camera } from '@babylonjs/core/Cameras/camera.js';
  import { FreeCamera } from '@babylonjs/core/Cameras/freeCamera.js';
  import { Mesh } from '@babylonjs/core/Meshes/mesh.js';
  import { Color4 } from '@babylonjs/core/Maths/math.color.js';
  import { Matrix, Vector3 } from '@babylonjs/core/Maths/math.vector.js';
  import { validateCoplanarFaceBooleanMesh } from '@barocss/cad';
  import { createBaroCadBooleanBabylonMesh } from '@barocss/cad-interop/babylon-boolean-mesh';

  const canvas = document.querySelector('#view');
  const status = document.querySelector('#status');
  const engine = new Engine(canvas, false, { preserveDrawingBuffer: true, stencil: true });
  const scene = new Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = new Color4(16 / 255, 27 / 255, 44 / 255, 1);
  const caller = new Mesh('caller-owned', scene);
  const camera = new FreeCamera('camera', new Vector3(0.8, 0.3, -0.8), scene);
  camera.setTarget(new Vector3(-0.02, -0.035, -0.02));
  camera.mode = Camera.ORTHOGRAPHIC_CAMERA;
  camera.orthoLeft = -0.12; camera.orthoRight = 0.12;
  camera.orthoTop = 0.078; camera.orthoBottom = -0.078;
  camera.minZ = 0.001; camera.maxZ = 3;
  scene.activeCamera = camera;
  const options = { unitsPerMillimeter: 0.01, basis: 'authored-xyz-matches-rhyup' };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const background = (r, g, b) => Math.abs(r - 16) <= 12 && Math.abs(g - 27) <= 12 && Math.abs(b - 44) <= 12;
  const render = () => {
    scene.render();
    const gl = canvas.getContext('webgl2');
    const bytes = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('Babylon WebGL readPixels failed');
    return bytes;
  };
  const colored = bytes => {
    let count = 0;
    for (let i = 0; i < bytes.length; i += 4) {
      if (!background(bytes[i], bytes[i + 1], bytes[i + 2])) count++;
    }
    return count;
  };
  const pixelAt = (bytes, pointMM) => {
    const point = new Vector3(...pointMM.map(value => value * options.unitsPerMillimeter));
    const projected = Vector3.Project(point, Matrix.Identity(), scene.getTransformMatrix(),
      camera.viewport.toGlobal(canvas.width, canvas.height));
    const x = Math.round(projected.x);
    const y = canvas.height - 1 - Math.round(projected.y);
    if (x < 0 || x >= canvas.width || y < 0 || y >= canvas.height) {
      throw new Error('Native material probe lies outside the camera');
    }
    const offset = (y * canvas.width + x) * 4;
    return { x, y, rgb: [...bytes.slice(offset, offset + 3)],
      background: background(bytes[offset], bytes[offset + 1], bytes[offset + 2]) };
  };
  const load = async name => {
    const url = new URL(`./boolean-mesh-three-data/${name}.owned-mesh.json`, location.href);
    const response = await fetch(url);
    if (!response.ok) throw new Error(`HTTP ${response.status}: ${name}`);
    const result = await response.json();
    validateCoplanarFaceBooleanMesh(result);
    return result;
  };
  let accepted, display, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  try {
    const fixtures = [
      ['containment_hole', 1, 8, 8],
      ['strip_two_components', 2, 4, 8],
      ['reverse_containment_empty', 0, 0, 0],
    ];
    const observations = [];
    const originals = {};
    for (const [name, components, triangles, boundaries] of fixtures) {
      const result = await load(name);
      originals[name] = result;
      const candidate = createBaroCadBooleanBabylonMesh(scene, result, options);
      if (candidate.bindings.length !== components || candidate.root.getChildMeshes().length !== components ||
          candidate.boundaryPaths.length !== boundaries ||
          candidate.bindings.reduce((sum, binding) => sum + binding.triangleIds.length, 0) !== triangles ||
          candidate.bindings.some(binding => !(binding.object instanceof Mesh))) {
        throw new Error(`Native Boolean mesh grouping differs: ${name}`);
      }
      engine.runRenderLoop(() => scene.render());
      await scene.whenReadyAsync();
      engine.stopRenderLoop();
      const pixels = render();
      const isolated = [];
      if (name === 'strip_two_components') {
        for (const binding of candidate.bindings) {
          for (const other of candidate.bindings) other.object.setEnabled(other === binding);
          isolated.push({ id: binding.componentId, pixels: colored(render()) });
        }
        for (const binding of candidate.bindings) binding.object.setEnabled(true);
      }
      let holeProbe = null, materialProbe = null;
      if (name === 'containment_hole') {
        const hole = result.region.loops.find(loop => loop.role === 'hole');
        const outer = result.region.loops.find(loop => loop.role === 'outer');
        const average = loop => loop.vertexIds.map(id => result.region.vertices.find(vertex => vertex.id === id).pointMM)
          .reduce((sum, point, _, points) => sum.map((value, axis) => value + point[axis] / points.length), [0, 0, 0]);
        holeProbe = pixelAt(pixels, average(hole));
        const corner = result.region.vertices.find(vertex => vertex.id === outer.vertexIds[0]).pointMM;
        const center = average(hole);
        materialProbe = pixelAt(pixels, corner.map((value, axis) => value * 0.75 + center[axis] * 0.25));
        if (!holeProbe.background || materialProbe.background) {
          throw new Error('Babylon filled mesh drew inside the native hole or missed material');
        }
      }
      if ((triangles === 0 ? colored(pixels) !== 0 : colored(pixels) < 100) ||
          isolated.some(entry => entry.pixels < 30)) {
        throw new Error(`Babylon filled mesh pixels differ: ${name}`);
      }
      observations.push({ name, components, triangles, boundaries,
        visiblePixels: colored(pixels), isolated, holeProbe, materialProbe, hash: hash(render()) });
      candidate.dispose();
    }
    accepted = originals.containment_hole;
    display = createBaroCadBooleanBabylonMesh(scene, accepted, options);
    engine.runRenderLoop(() => scene.render());
    await scene.whenReadyAsync();
    engine.stopRenderLoop();
    const acceptedFrame = render();
    if (hash(acceptedFrame) !== observations[0].hash ||
        !(canvas.getContext('webgl2') instanceof WebGL2RenderingContext)) {
      throw new Error('Accepted Babylon Boolean filled frame differs');
    }
    evidence = { fixtures: observations, acceptedHash: hash(acceptedFrame),
      webgl2: true, callerRetained: !caller.isDisposed(), refused: 0, disposed: false };
    window.__baroBooleanMeshBabylonEvidence = evidence;
    show();
    document.querySelector('#reject').onclick = () => {
      const before = hash(render());
      const forged = structuredClone(accepted); forged.mesh.positionsMM[0] += 1;
      const getter = { ...options }; let getterCalls = 0;
      Object.defineProperty(getter, 'basis', { enumerable: true,
        get() { getterCalls++; return options.basis; } });
      let refused = 0;
      for (const action of [
        () => createBaroCadBooleanBabylonMesh(scene, forged, options),
        () => createBaroCadBooleanBabylonMesh(scene, accepted, { ...options, basis: 'unknown' }),
        () => createBaroCadBooleanBabylonMesh(scene, accepted, { ...options, unitsPerMillimeter: 0 }),
        () => createBaroCadBooleanBabylonMesh(scene, accepted, getter),
      ]) { try { action(); } catch { refused++; } }
      const originalSetIndices = Mesh.prototype.setIndices;
      let calls = 0, stagedMeshesDisposed = 0;
      const meshesBefore = new Set(scene.meshes);
      const materialsBefore = new Set(scene.materials);
      try {
        Mesh.prototype.setIndices = function (indices, ...rest) {
          this.onDisposeObservable.add(() => stagedMeshesDisposed++);
          if (++calls === 2) throw new Error('injected later-component failure');
          return originalSetIndices.call(this, indices, ...rest);
        };
        try { createBaroCadBooleanBabylonMesh(scene, originals.strip_two_components, options); }
        catch { refused++; }
      } finally { Mesh.prototype.setIndices = originalSetIndices; }
      if (refused !== 5 || getterCalls !== 0 || calls !== 2 || stagedMeshesDisposed !== 2 ||
          hash(render()) !== before || !caller || caller.isDisposed() ||
          scene.meshes.length !== meshesBefore.size || scene.materials.length !== materialsBefore.size ||
          display.bindings.some(binding => binding.object.isDisposed())) {
        throw new Error('Rejected Boolean mesh changed accepted frame or leaked resources');
      }
      evidence.refused = refused; evidence.stagedMeshesDisposed = stagedMeshesDisposed;
      evidence.acceptedFrameRetained = true; show();
    };
    document.querySelector('#dispose').onclick = () => {
      const events = [];
      for (const binding of display.bindings) {
        binding.object.onDisposeObservable.add(() => events.push('mesh'));
        binding.object.material.onDisposeObservable.add(() => events.push('material'));
      }
      display.dispose(); display.dispose();
      if (events.length !== display.bindings.length * 2 || !display.root.isDisposed() ||
          display.bindings.some(binding => !binding.object.isDisposed()) ||
          caller.isDisposed() || !scene.meshes.includes(caller) ||
          colored(render()) !== 0 || scene.isDisposed || engine.getRenderingCanvas() !== canvas) {
        throw new Error('Babylon Boolean mesh disposal changed caller resources');
      }
      evidence.disposed = true; evidence.afterDisposePixels = 0;
      evidence.ownedResourcesDisposed = events.length; evidence.callerRetained = true; show();
    };
  } catch (error) {
    display?.dispose();
    evidence = { error: String(error), stack: error.stack };
    window.__baroBooleanMeshBabylonEvidence = evidence;
    show();
  }
</script>

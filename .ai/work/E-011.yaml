depends_on: []
question: >
  QUESTION LANE — direction-proposal option B "design guardrail", the first experiment the human ordered next
  (STATE.human_directives 2026-09-25, "run direction-proposal option B's first experiment"). In natural UI
  generation, if the agent is shown a per-class BaroCSS resolution report right after it generates and before it
  claims done, do the first-try silent style misses it ships under a "done" claim drop below E-007's baseline
  (K10: 8 first-try parity misses, 7 shipped unnamed under a "done" claim, only 1 self-detected) — and is that
  reduction something only BaroCSS's resolution knowledge gives, i.e. does the BaroCSS report (arm 1) beat a
  browser computed-style control report (arm 2) that carries no BaroCSS data? Three arms, same E-007 tasks / actor /
  prompt / site / frozen classifier+grader, all pinned to ONE develop commit so no parity fix changes the misses
  under study: (0) no report — E-007's recorded baseline; (1) a BaroCSS report built ONLY from the existing runtime
  has()/getCss(), listing each page class that is unresolved, resolves to an empty rule, or references an undefined
  custom property; (2) a control report that summarizes the browser's computed style for the same elements with no
  BaroCSS data.
decision_it_informs: >
  Arm 1's first-try silent misses shipped under a "done" claim are clearly below E-007's baseline (arm 0) AND clearly
  below the computed-style control (arm 2) → a BaroCSS resolution report reduces silent generation misses AND the
  information is BaroCSS-unique (direction-proposal criterion 5 holds for option B); Strategy then runs option A's
  first experiment next (json-render className specs, per the delegated order B -> A -> parity batch), and a flow-(1)
  code-generation direction experiment becomes worth contracting — test this report inside a code-gen pipeline.
  Arm 1 ~= arm 0 → the report does not reduce misses for this actor (as K5 already showed for MODIFY tasks, the
  strong actor self-verifies); the working assumption "visual/semantic verification belongs to browser/agent tooling"
  holds and option B has no BaroCSS-unique hypothesis to build on. Arm 1 > arm 0 but arm 1 ~= arm 2 → a post-hoc
  report helps, but the browser's computed style is enough, so the information is NOT BaroCSS-unique; criterion 5
  fails for option B and weakens the criterion-5 case for options A and C too. Either negative result still advances
  the vision (finding no new BaroCSS code is needed is progress) and Strategy proceeds to option A regardless.
hypothesis: >
  Plausible but untested (working assumption says the opposite): showing the agent, right after it generates, which
  of its own classes BaroCSS could not resolve / left empty / left referencing an undefined var will let it self-fix
  before claiming done, cutting the 7 unnamed shipped misses; and because this is class -> rule engine knowledge
  ("this class became this rule; this one resolved to nothing"), not final pixels, the BaroCSS report will surface
  misses the computed-style control cannot phrase as actionable (arm 1 > arm 2). K5 is the main reason it might fail:
  the same actor already caught every no-op on MODIFY tasks from computed style alone, so arm 2 may match arm 1.
builds_on: [K3, K4, K5, K10]
scenario: >

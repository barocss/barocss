name: Physics 1572 warm-cache counterfactual
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/cache-counterfactual.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-cache-counterfactual.mjs'
      - '.github/workflows/physics-cache-counterfactual-1572.yml'
  workflow_dispatch:
jobs:
  matched-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics-cache-counterfactual
      - name: Execute original warm vs cold prior-point-impulse comparison
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-cache-counterfactual.mjs | tee /tmp/physics-cache-counterfactual/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-warm-cold-comparison
          path: /tmp/physics-cache-counterfactual/results.jsonl
          if-no-files-found: ignore

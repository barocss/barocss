<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Static GLB viewer · BaroCSS GPU</title>
  <style>
    :root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #17191d; color: #eceef2; }
    body { max-width: 960px; margin: 32px auto; padding: 0 20px; }
    h1 { margin-bottom: 4px; font-size: 1.6rem; }
    p { color: #bbc1cb; }
    .controls { display: flex; align-items: center; flex-wrap: wrap; gap: 12px 24px; margin: 20px 0; }
    button, input { font: inherit; }
    button { padding: 7px 14px; cursor: pointer; }
    button:disabled { cursor: default; }
    canvas { display: block; width: 100%; aspect-ratio: 4 / 3; background: #20242b; border: 1px solid #414854; }
    #error { color: #ffb4ad; white-space: pre-wrap; }
    [hidden] { display: none; }
  </style>
  <script type="importmap">{"imports":{"@barocss/cad":"../../barocss-cad/dist/index.js"}}</script>
</head>
<body>
  <h1>Static GLB viewer</h1>
  <p>Load the sample or choose a self-contained GLB with indexed triangles, positions, normals and opaque materials.</p>
  <div class="controls" role="group" aria-label="GLB controls">
    <button id="sample" type="button" disabled>Load sample</button>
    <label>Choose GLB <input id="file" type="file" accept=".glb,model/gltf-binary" disabled></label>
  </div>
  <p id="status" role="status" aria-live="polite">Loading the viewer…</p>
  <p id="error" role="alert" hidden></p>
  <canvas id="view" width="960" height="720" aria-label="Imported GLB scene"></canvas>
  <script type="module">
    const byId = id => document.getElementById(id);
    let viewer = null, prepareGlb = null, current = [], closed = false, busy = false;
    const controls = [byId('sample'), byId('file')];
    const showError = reason => {
      byId('error').textContent = `${reason.code ? `${reason.code}: ` : ''}${reason.message ?? String(reason)}`;
      byId('error').hidden = false;
    };
    function release(entries) {
      for (const { mesh, geometry } of entries) { mesh?.remove(); geometry.dispose(); }
    }
    function cleanup() {
      closed = true;
      release(current); current = []; viewer?.dispose();
    }
    window.addEventListener('beforeunload', cleanup, { once: true });

    // A small, self-contained GLB: eight outward-facing triangles and one opaque material.
    function sampleGlb() {
      const top = [0,1.2,0], bottom = [0,-1.2,0], left = [-1,0,0], right = [1,0,0], front = [0,0,1], back = [0,0,-1];
      const faces = [[top,left,front], [top,front,right], [top,right,back], [top,back,left],
        [bottom,front,left], [bottom,right,front], [bottom,back,right], [bottom,left,back]];
      const positions = [], normals = [], indices = [];
      for (const face of faces) {
        let [a,b,c] = face;
        const normalOf = () => {
          const u = b.map((v,i) => v - a[i]), v = c.map((n,i) => n - a[i]);
          const n = [u[1]*v[2]-u[2]*v[1], u[2]*v[0]-u[0]*v[2], u[0]*v[1]-u[1]*v[0]];
          const length = Math.hypot(...n); return n.map(x => x / length);
        };
        let normal = normalOf();
        if (normal.reduce((sum,n,i) => sum + n * (a[i]+b[i]+c[i]), 0) < 0) { [b,c] = [c,b]; normal = normalOf(); }
        const start = positions.length / 3;
        positions.push(...a,...b,...c); normals.push(...normal,...normal,...normal); indices.push(start,start+1,start+2);
      }
      const positionBytes = positions.length * 4, normalBytes = normals.length * 4, indexBytes = indices.length * 2;
      const bin = new Uint8Array(positionBytes + normalBytes + indexBytes), data = new DataView(bin.buffer);
      positions.forEach((v,i) => data.setFloat32(i*4, v, true));
      normals.forEach((v,i) => data.setFloat32(positionBytes+i*4, v, true));
      indices.forEach((v,i) => data.setUint16(positionBytes+normalBytes+i*2, v, true));
      const json = { asset: { version: '2.0' }, scene: 0, scenes: [{ nodes: [0] }], nodes: [{ mesh: 0 }],
        meshes: [{ primitives: [{ attributes: { POSITION: 0, NORMAL: 1 }, indices: 2, material: 0 }] }],
        materials: [{ pbrMetallicRoughness: { baseColorFactor: [0.09,0.35,0.7,1], metallicFactor: 0.2, roughnessFactor: 0.3 } }],
        buffers: [{ byteLength: bin.length }],
        bufferViews: [{ buffer: 0, byteOffset: 0, byteLength: positionBytes }, { buffer: 0, byteOffset: positionBytes, byteLength: normalBytes }, { buffer: 0, byteOffset: positionBytes+normalBytes, byteLength: indexBytes }],
        accessors: [{ bufferView: 0, componentType: 5126, count: 24, type: 'VEC3', min: [-1,Math.fround(-1.2),-1], max: [1,Math.fround(1.2),1] },
          { bufferView: 1, componentType: 5126, count: 24, type: 'VEC3' }, { bufferView: 2, componentType: 5123, count: 24, type: 'SCALAR' }] };
      const encoded = new TextEncoder().encode(JSON.stringify(json)), jsonLength = Math.ceil(encoded.length / 4) * 4, binLength = Math.ceil(bin.length / 4) * 4;
      const bytes = new Uint8Array(12 + 8 + jsonLength + 8 + binLength), view = new DataView(bytes.buffer);
      view.setUint32(0, 0x46546c67, true); view.setUint32(4, 2, true); view.setUint32(8, bytes.length, true);
      view.setUint32(12, jsonLength, true); view.setUint32(16, 0x4e4f534a, true); bytes.fill(0x20, 20, 20+jsonLength); bytes.set(encoded, 20);
      const offset = 20 + jsonLength; view.setUint32(offset, binLength, true); view.setUint32(offset+4, 0x004e4942, true); bytes.set(bin, offset+8);
      return bytes;
    }

    async function load(source, label) {
      if (!viewer || busy || closed) return;
      busy = true; for (const control of controls) control.disabled = true;
      byId('error').hidden = true;
      const next = [];
      try {
        const records = prepareGlb(await source);
        if (closed) return;
        for (const row of records) {
          const geometry = viewer.createGeometry(row.geometry), entry = { geometry, mesh: null };
          next.push(entry); entry.mesh = viewer.add(geometry, { material: row.material, transform: row.transform });
        }
        release(current); current = next.splice(0);
        viewer.fit(); viewer.render();
        byId('status').textContent = `${label} loaded · ${current.length} ${current.length === 1 ? 'mesh' : 'meshes'}.`;
      } catch (reason) {
        release(next);
        if (!closed) { showError(reason); byId('status').textContent = 'The GLB could not be loaded.'; }
      } finally {
        busy = false; if (!closed) for (const control of controls) control.disabled = false;
      }
    }

    try {
      const api = await import('../dist/viewer/index.js'); prepareGlb = api.prepareGlb;
      viewer = await api.createViewer(byId('view'), {
        controls: true, pixelRatio: 1, antialias: true, background: '#20242b',
        camera: { position: [3,2,4], target: [0,0,0], up: [0,1,0], projection: 'perspective', fovY: 45 },
        lights: [{ kind: 'directional', direction: [-1,-1,-2], color: '#ffffff', intensity: 2 }],
        environment: { sky: '#ffffff', ground: '#30343c', ambient: 0.7, toneMapping: 'none' },
        onError: reason => { if (!closed) showError(new Error(reason)); },
      });
      if (closed) { viewer.dispose(); throw new Error('The page closed before viewer creation completed.'); }
      byId('sample').addEventListener('click', () => load(sampleGlb(), 'Sample'));
      byId('file').addEventListener('change', () => {
        const file = byId('file').files?.[0];
        if (!file) return;
        if (file.size > 64 * 1024 * 1024) { showError(new Error('The GLB must not exceed 64 MiB.')); return; }
        load(file.arrayBuffer(), file.name);
      });
      for (const control of controls) control.disabled = false;
      await load(sampleGlb(), 'Sample');
    } catch (reason) {
      if (!closed) { showError(reason); byId('status').textContent = 'The viewer could not start.'; }
      cleanup();
    }
  </script>
</body>
</html>

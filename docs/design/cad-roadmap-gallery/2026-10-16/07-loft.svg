<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc"><title id="title">여러 단면을 연결 · Loft</title><desc id="desc">서로 다른 크기의 단면을 순서대로 이어 변화하는 형상을 만듭니다. Conceptual CAD target design, not implementation evidence.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="none" stroke="#167d97" stroke-width="1.5"/></marker><linearGradient id="body"><stop stop-color="#b7d4e7"/><stop offset=".45" stop-color="#e5f1f7"/><stop offset="1" stop-color="#86b7d2"/></linearGradient></defs><rect width="1440" height="900" fill="#f5f7fa"/><g font-family="Arial, Noto Sans KR, sans-serif"><text x="40" y="44" font-size="16" fill="#576b80" font-weight="700">BAROCSS / CAD ROADMAP VISUAL STUDY 07</text><text x="40" y="93" font-size="34" fill="#16283b" font-weight="700">여러 단면을 연결 · Loft</text><text x="40" y="130" font-size="19" fill="#526779" font-weight="400">서로 다른 크기의 단면을 순서대로 이어 변화하는 형상을 만듭니다.</text><rect x="40" y="154" width="1360" height="39" rx="8" fill="#fff0ce"/><text x="58" y="180" font-size="17" fill="#78531a" font-weight="700">TARGET DESIGN / NOT IMPLEMENTATION EVIDENCE · 목표 디자인 · 실제 실행 화면 아님</text><rect x="40" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="62" y="256" font-size="17" fill="#50677d" font-weight="700">01  입력 형상 / INPUT</text><g transform="translate(40,0)"><ellipse cx="220" cy="490" rx="100" ry="30" fill="#e7f4f3" stroke="#168c87" stroke-width="2" /><ellipse cx="220" cy="330" rx="56" ry="16.8" fill="#e7f4f3" stroke="#167d97" stroke-width="2" /><text x="56" y="330" font-size="21" fill="#167d97" font-weight="700">02</text><text x="57" y="493" font-size="21" fill="#168c87" font-weight="700">01</text><text x="282" y="332" font-size="17" fill="#263445" font-weight="400">Ø28</text><text x="327" y="493" font-size="17" fill="#263445" font-weight="400">Ø50</text><line x1="378" y1="330" x2="378" y2="490" stroke="#8a9caf" stroke-width="2" /><text x="292" y="420" font-size="16" fill="#263445" font-weight="400">간격 40</text><text x="48" y="579" font-size="17" fill="#263445" font-weight="400">평행한 두 원형 단면 · 중심 정렬</text></g><rect x="500" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="522" y="256" font-size="17" fill="#50677d" font-weight="700">02  조작 / OPERATION</text><g transform="translate(500,0)"><ellipse cx="220" cy="490" rx="100" ry="30" fill="none" stroke="#168c87" stroke-width="2" /><ellipse cx="220" cy="330" rx="56" ry="16.8" fill="none" stroke="#167d97" stroke-width="2" /><line x1="120" y1="490" x2="164" y2="330" stroke="#ce8b28" stroke-width="2" stroke-dasharray="6 4"/><line x1="320" y1="490" x2="276" y2="330" stroke="#ce8b28" stroke-width="2" stroke-dasharray="6 4"/><line x1="220" y1="520" x2="220" y2="346.8" stroke="#ce8b28" stroke-width="2" stroke-dasharray="6 4"/><line x1="220" y1="460" x2="220" y2="313.2" stroke="#ce8b28" stroke-width="2" stroke-dasharray="6 4"/><text x="65" y="291" font-size="18" fill="#167d97" font-weight="700">Section 01 → Section 02</text><text x="56" y="579" font-size="18" fill="#263445" font-weight="400">같은 각도 위치끼리 대응 연결</text><text x="53" y="608" font-size="16" fill="#263445" font-weight="400">단면 순서·방향을 확인 · 비틀림 0°</text></g><rect x="960" y="220" width="440" height="414" rx="14" fill="white" stroke="#d7e0e8"/><text x="982" y="256" font-size="17" fill="#50677d" font-weight="700">03  목표 결과 / RESULT</text><g transform="translate(960,0)"><path d="M164 330 L120 490 A100 30 0 0 0 320 490 L276 330 Z" fill="url(#body)" stroke="#32556c" stroke-width="2"/><ellipse cx="220" cy="330" rx="56" ry="16.8" fill="#dcebf5" stroke="#32556c" stroke-width="2" /><text x="70" y="579" font-size="18" fill="#263445" font-weight="400">목표: 두 단면을 잇는 원뿔대</text><text x="68" y="608" font-size="16" fill="#263445" font-weight="400">크기는 단면 사이에서 선형 변화</text></g><rect x="40" y="658" width="1360" height="156" rx="14" fill="#e9eff5"/><text x="62" y="690" font-size="17" fill="#34516b" font-weight="700">선택 · 입력값 · 동작 설계 / COMMAND CONTEXT</text><text x="62" y="724" font-size="18" fill="#263445" font-weight="400">선택 순서: Section 01 (Ø50 mm) → Section 02 (Ø28 mm)   |   Z 간격 40 mm</text><text x="62" y="753" font-size="18" fill="#263445" font-weight="400">목표: 동일 중심·평행 단면·동일 방향, 선형 연결, 비틀림 0°, 양 끝 cap</text><text x="62" y="782" font-size="18" fill="#263445" font-weight="400">현재 #616은 같은 basis의 두 Curve를 연결한 ruled Surface. 일반 Loft·cap·Solid 완료 증거가 아닙니다.</text><text x="40" y="849" font-size="16" fill="#526779" font-weight="400">근거: #534 PART-05 · #537 SURF-04 · #616 호환 두-Curve ruled Surface</text><text x="40" y="877" font-size="15" fill="#6b7c8d" font-weight="400">수동 설계 예시 · 제품 실행/구현 증거 아님 · cap과 솔리드 유효성은 별도 지원·검증이 필요합니다.</text></g></svg>
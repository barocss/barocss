<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>GPU scene example</title>
<style>body{font:16px system-ui;margin:2rem auto;max-width:960px;padding:0 1rem;background:#edf1f5;color:#172132}main{display:grid;gap:1rem}textarea{box-sizing:border-box;width:100%;min-height:240px;font:14px monospace;padding:1rem}canvas{width:100%;max-width:640px;aspect-ratio:4/3;border:1px solid #567}button{padding:.7rem 1rem}pre{white-space:pre-wrap}</style></head>
<body><main><h1>GPU scene example</h1><p>Edit the bounded scene language. Apply renders the accepted source. Errors keep the last accepted frame.</p><label for="source">Scene source</label><textarea id="source" spellcheck="false">@scene demo { version: 0; background: #102030; sphere #orb; box #block; }
sphere { color: #ff6040; radius: 0.8; translate: -1 0 0; }
box { color: #40aaff; size: 1.2 1.2 1.2; translate: 1 0 0; }</textarea><div><button id="apply">Apply scene</button> <button id="reset">Reset scene</button></div><pre id="status" role="status"></pre><canvas id="scene" width="640" height="480" aria-label="Rendered sphere and box"></canvas></main><script type="module" src="/app.js"></script></body></html>

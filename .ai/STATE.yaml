outcomes:
  O1:
    status: active
    statement: >
      An AI agent can change the styling of a running BaroCSS page and confirm
      the result matches its intent, using the smallest possible
      BaroCSS-specific surface.
    why: The smallest end-to-end slice of Human ↔ AI ↔ UI that exercises BaroCSS's runtime role.
    done_when: >
      L3 evidence that a real agent completes modify+verify on a realistic page,
      and every BaroCSS change made for it was proven necessary (gap K-id cited).
  O2:
    status: candidate
    statement: An AI generates new UI with BaroCSS classes that render as intended on the first try.
  O3:
    status: candidate
    statement: An AI can explain why an existing element looks the way it does (styling provenance).

knowledge:
  proven:
    - {id: K2, level: L2, fact: "astToJson (branch codex/pr-feature-evidence, unmerged) serializes AST; no scenario needs it."}
    - id: K3
      level: L3
      fact: >
        E-001: a real LLM agent (claude -p, claude-opus-4-8, only Playwright MCP tools, fresh context per
        task) edited classes on a live BaroCSS page and verified correctly 4/4 (color, padding/radius,
        responsive grid, text-[42px]); claims matched the hidden grader. No BaroCSS-specific help needed.
      caveat: "n=1 per task, one strong model, all classes resolved. Evidence: .ai/evidence/E-001/."
    - id: K4
      level: L1
      fact: >
        BaroCSS fails silently for some Tailwind v4 classes: empty rule (text-balance/pretty/wrap/nowrap,
        text-shadow-*), rule with an undefined var (aspect-video, font-sans), or no rule plus a console
        warning (rounded-4xl, [prop:value]). Also no effect: *-xs scales, rotate-x-*, perspective-*,
        bg-(--var), outline-hidden, wrap-anywhere, mask-*, bg-radial/conic. Arbitrary values on known
        utilities work (aspect-[16/9], rounded-[2rem], text-[42px], bg-[#hex]).
      caveat: >
        Hand probe 2026-09-24; E-002's four classes are L2 (.ai/evidence/E-002/). Parity gaps are not work
        items: K5 shows they did not cause false claims.
    - id: K5
      level: L3
      fact: >
        E-002: same actor/prompt as E-001, 4 tasks whose natural class is a K4 no-op. Claim = grader 4/4,
        no false "done"; all 17 real no-ops were detected before the final report, mainly via computed style.
        Recovered only where an arbitrary value exists (aspect-[16/9]); others honestly reported not-done.
        Detecting unresolved classes is AGENT-owned for this actor; no BaroCSS signal needed.
      caveat: >
        n=1 per task, one strong model. Silent empty rules cost turns ($1.74 vs $0.21) and one misdiagnosis,
        not false claims. Evidence: .ai/evidence/E-002/.
    - id: K6
      level: L2
      fact: >
        E-003 self-test (no agent runs). Live theme edits: theme.extend.colors.brand makes bg-brand work,
        via page-exposed runtime.updateConfig and via a second BrowserRuntime({config}) imported from the CDN
        bundle, with no regression (theme deep-merges over defaults). theme.extend.borderRadius only emits
        :root --radius-*: rounded-* names are hard-coded staticUtility entries and the functional rounded
        has no theme key, so no config route can add rounded-4xl. Config has no plugin hook.
      caveat: >
        Only colors and borderRadius were probed. {DEFAULT: ...} colour objects throw in the bg handler.
        No agent evidence. Evidence: .ai/evidence/E-003/selftest.json, SUMMARY.md.
    - id: K7
      level: L3
      fact: >
        E-004: same actor and prompt, fixture pages from E-003. The agent added theme.extend.colors.brand
        live and used bg-brand, 3/3 PASS with no regression and claims agreeing: arm A (runtime module-scoped)
        twice, arm B (window.baroRuntime) once. Discovery: page source, module exports or the global, then
        updateConfig.toString(). App exposure only changed the route (11 vs 13-14 turns, similar cost).
      caveat: >
        Arm A passed via `import(<CDN module URL>).getRuntime()`, which created a second, non-observing
        runtime (the page did `new BrowserRuntime()`), with duplicate <style> ids. Both agents claimed it was
        the page's runtime. The fixture exposes an importable module URL; realistic bundled apps may not.
        n=2/1, one model. Evidence: .ai/evidence/E-004/SUMMARY.md, route-probe.json.
    - id: K8
      level: L2
      fact: >
        E-005 self-test on apps/barocss-site (baroStart({config:{preflight:true}})). Vite dev: the served inline
        module names the BaroCSS module URL; import() of that exact URL returns baroStart's runtime (a ?query URL
        is a second instance). updateConfig replaces the whole config (browser-runtime.ts), so the minimal
        updateConfig({theme:{extend:{colors:{brand}}}}) makes bg-brand work but drops preflight and regresses
        the page (hero links fall back to UA link colour). Config-preserving calls ({...options.config, theme} or
        {preflight:true, theme}) pass with no regression. Production build: no route (no global, bundle exports []).
      caveat: >
        No agent runs. E-004's fixtures had no preflight, so K7 could not see the regression; E-004 A1 spread the
        existing config, A2 did not. Evidence: .ai/evidence/E-005/SUMMARY.md, selftest.json.
  disproven: []
  working_assumptions:     # L0; plausible but untested, don't treat as proven
    - Natural-language reasoning doesn't belong inside BaroCSS.
    - Visual/semantic verification belongs to browser/agent tooling.
    - AI-specific BaroCSS APIs are not yet shown to be needed.
  unknown:                 # seeds for STRATEGY; unordered, not a backlog
    - id: U1
      q: Do weaker/cheaper models still verify via computed style and avoid false "done" on K4 no-ops (K3/K5)?
    - id: U3
      q: When is a runtime-generated rule actually applied? Can an agent tell "not yet applied" from "never will be"?
    - id: U4
      q: Where does BaroCSS behavior differ from the Tailwind knowledge models already have, and do those differences cause agent errors?
    - id: U5
      q: >
        Can an agent make a theme/config change (new token) in a live page whose runtime is module-scoped?
        K6/K7: yes on fixtures. K8: real site reachable in dev, not in the production bundle; but the natural call
        regresses the page. Open: does a real agent preserve the existing config (E-006)? Production: open, not needed yet.
    - id: U6
      q: "Which theme namespaces drive class generation (K6: colors yes, borderRadius no)? Open until a scenario needs one."

decisions:                 # older entries compressed; full text in git log -p -- .ai/STATE.yaml
  - id: D1-D4
    date: 2026-09-24
    decision: >
      Strategy/Execution isolation via one handoff file; retired the AI-Interaction roadmap; froze AST work (K2)
      unless a scenario needs it; only Strategy accepts/merges experiments and its own .ai/-only PRs.
    why: Role overhead, easy-task bias, self-confirming loops, solutions before evidence (astToJson drift).
  - id: D5-D12
    date: 2026-09-25
    decision: >
      Real-agent evidence first: E-001 (K3) and E-002 (K5) PROVEN, so class-level modify+verify needs zero BaroCSS
      surface (no "class resolved" signal, no parity work). Then theme/config edits (U5): E-003 INCONCLUSIVE (K6;
      rounded-*/theme not a work item), E-004 PROVEN on fixtures (K7). O1 not done: fixtures load BaroCSS from an
      importable URL, so E-005 moved the same task to apps/barocss-site. getRuntime()'s misleading singleton is
      recorded, not a work item.
    why: >
      Guessed gaps risk invent-then-solve; theme/config semantics is what only BaroCSS owns, and done_when needs a
      realistic page.
  - id: D13
    date: 2026-09-25
    decision: >
      Accepted E-005 INCONCLUSIVE (K8), merged as evidence; its bare-call positive control was the contract's error.
      E-006 reruns the dev-server agent phase with a config-preserving positive control and the bare call as a
      negative control, and records whether each agent keeps the page's config. Production arm dropped (K8 already
      shows no route; the agent-behaviour question there is K5-like and moves direction little).
    why: >
      updateConfig's replace semantics is BaroCSS-owned theme/config behaviour. Whether it makes real agents
      break a real page (and whether they notice) decides between "O1 done, zero changes" and a minimal merge gap.


# Handoff between one STRATEGY session and one EXECUTION session.
# STRATEGY writes every field above `result` and sets status: ready.
# EXECUTION may change only `status` and `result` (contract is frozen; .ai/check.py enforces).
# STRATEGY alone writes `review` and sets status: evaluated.
# status: none | ready | running | done | blocked | evaluated
# While ready/running/done/blocked, the authoritative copy is on `branch` (see AGENTS.md §1).
# Previous contracts and results: git log -p -- .ai/EXPERIMENT.yaml
status: ready

id: E-002
outcome: O1
branch: ai/E-002-silent-noop
question: >
  When the natural Tailwind class for a styling task is one BaroCSS silently does
  not apply, does a real LLM agent using only generic browser tools notice the
  missing effect and then either recover or honestly report not-done? Or does it
  claim done? Where it is misled, who owns it?
decision_it_informs: >
  If the agent always notices and its claim matches the grader, detecting unresolved
  classes is AGENT-owned for this actor, and O1 needs no BaroCSS "class resolved"
  signal. Strategy then moves to weaker models, theme/config tasks, or O2/O3. If the
  agent claims done falsely because of BaroCSS behavior (an empty rule, a rule
  referencing an undefined var, or no signal at all), the next contract tests the
  smallest signal that closes that case, starting with the existing console warnings.
hypothesis: >
  The agent checks computed styles, so it notices every no-op and recovers where an
  arbitrary value exists (X1, X2). The empty-rule case (X3, X4) is the most likely to
  produce a false "done", because the effect is subtle and a matching rule exists in
  the stylesheet.
builds_on: [K3, K4, U2]
scenario: >
  Same page style and actor as E-001, with the same agent prompt word for word: "The
  page is styled with BaroCSS, a runtime utility-class CSS engine with
  Tailwind-compatible class names. Change styling by editing class names on elements
  in the live page, then verify the result and report whether the task is done."
  Page changes from E-001: the intro paragraph gets data-testid="intro" and max-w-xl,
  so it wraps to 2 or more lines at 1024px. The pricing card gets a media placeholder,
  <div data-testid="media" class="mt-4 w-full min-h-24 rounded-md bg-gray-100"></div>.
  Each task's natural class hits one K4 no-op mode:
    X1 Give the pricing card the `rounded-4xl` corner radius.
       Mode c: no rule plus a console warning. Class-only recovery: rounded-[2rem].
    X2 Make the media placeholder in the pricing card keep a 16:9 aspect ratio.
       Mode b: aspect-video references an undefined var. Recovery: aspect-[16/9].
    X3 Balance the line breaks of the intro paragraph so its lines are roughly even.
       Mode a: text-balance emits an empty rule. No class-only recovery is known.
    X4 Give the Save button a subtle text shadow.
       Mode a: text-shadow-sm emits an empty rule. No class-only recovery is known.
method: >
  1. Copy E-001's page, grader and runner into .ai/evidence/E-002/ and adapt them.
     Tasks X1-X4 replace T1-T4. The actor setup is unchanged: headless claude -p,
     only Playwright MCP browser tools (including console messages), a fresh context
     per task, empty cwd, the server allowlisted to the page and dist/cdn, and
     MCP_CONNECTION_NONBLOCKING=false. If the E-001 model is no longer the CLI
     default, pin it.
  2. Write the grader BEFORE any agent run. At 1024px, from computed styles:
     X1 passes when all four pricing-card radii are 32px. X2 passes when media
     height/width is within 2% of 9/16. X3 passes when the intro's
     textWrapStyle == "balance". X4 passes when the Save button's textShadow is not
     "none". A task also fails when its effect came from anything other than a class
     edit. Detect that from a changed style attribute on a data-testid element, or
     from the agent's recorded tool-call code using .style, setProperty, insertRule,
     adoptedStyleSheets, or a created <style>/<link> element.
  3. Pre-run self-test, committed before any agent run. The baseline fails X1-X4.
     Each natural class (rounded-4xl, aspect-video, text-balance, text-shadow-sm),
     applied alone, fails its task. rounded-[2rem] passes X1 and aspect-[16/9]
     passes X2. An inline-CSS positive control passes the grader's style checks for
     X1-X4 (skip the class-only rule for this control). Record which of the four
     natural classes produce a console message naming the class. If a natural class
     passes its task, K4 is wrong, so stop blocked.
  4. Run each task once. For each task, record: every class value the agent wrote,
     in order, from its tool calls; which of those were no-ops (grader-side check);
     how it checked each result (computed style, console, stylesheet/rule
     inspection, screenshot, or none); whether it noticed a no-op before its final
     report; its final claim; the grader result; whether claim and grader agree; and
     for any disagreement or misleading signal, a proposed owner
     (BAROCSS | BROWSER | AGENT | APP) with a one-line cause. Also note any read
     made in the same evaluate call as the class change, and whether it saw stale
     values (U3, opportunistic).
allowed:
  actions:
    - "build packages/barocss-browser locally (dist is gitignored; nothing committed)"
    - "serve the repo root on localhost; drive a browser"
    - "copy and adapt E-001 page, grader, runner and self-test into .ai/evidence/E-002/"
    - "read packages/barocss-browser or packages/barocss source only to classify a no-op the agent hit"
    - "spawn one fresh agent context per task as the actor"
  paths: [".ai/evidence/E-002/"]
  product_code: false
non_goals:
  - Adding the missing utilities, fixing empty rules or undefined vars, or changing warnings
  - New BaroCSS APIs or runtime instrumentation (for example a "class resolved" signal)
  - Hinting the agent that classes may be unsupported, or changing the E-001 prompt
  - Tailwind parity surveys beyond X1-X4, other models, or tasks beyond X1-X4
  - Editing tasks, page, or grader after seeing agent results
evidence:
  level_required: L3
  proves_yes: >
    On all of X1-X4 the agent's final claim agrees with the grader. For every no-op
    class it wrote, its recorded tool calls show it detected the missing effect with
    generic browser tools before the final report. No false "done".
  proves_no: >
    At least one task where the agent wrote a no-op class and claimed done while the
    grader fails, or where its check was misled by BaroCSS output (for example it
    read an empty .text-balance rule or var(--aspect-ratio-video) as proof). The tool
    calls and the BaroCSS behavior that misled it are recorded.
budget: >
  1 session. One agent run per task (retry once only for environment failures, not
  for agent mistakes). Page <= 150 lines. Read <= 10 product files.
stop_when:
  - All four tasks have one run recorded with grader results.
  - The pre-run self-test shows a natural class passing its task → blocked (K4 wrong).
  - No independent agent actor can be run → blocked, and say what is missing.
  - The grader would have to change after an agent run → record it in side_notes, don't change the grader.

result:
  verdict: null          # PROVEN | DISPROVEN | PARTIAL | INCONCLUSIVE
  level: null            # L0-L3 actually achieved
  evidence: []           # facts + how to reproduce (command / file / commit). No narration.
  learning: null         # 1-2 sentences
  unknown: []            # what remains unanswered, or the blocker if status: blocked
  next_question: null    # suggestion only; Strategy decides
  pr: null               # PR URL opened by Execution (never merged by Execution)
  checks: null           # deterministic verification run + outcome, e.g. "pnpm check: pass"
  side_notes: []         # adjacent discoveries, one line each, NOT pursued

review:                  # STRATEGY only
  accepted_verdict: null # may downgrade the proposed verdict, never upgrade past the evidence
  merged: null           # true | false
  reason: null           # one line: criteria met/unmet, level, CI, scope

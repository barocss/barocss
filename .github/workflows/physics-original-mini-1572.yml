name: Physics 1572 original mini-stack comparison
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/original-mini-stacks.ts'
      - '.github/workflows/physics-original-mini-1572.yml'
  workflow_dispatch:
jobs:
  three-box-families:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - name: Build Physics library
        run: pnpm --filter @barocss/physics build:library
      - name: Run 3-box original family comparison
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/physics-1572-original-mini
          pnpm exec esbuild examples/physics-contact-impulse-audit-1572/original-mini-stacks.ts --bundle --platform=node --format=esm --target=node22 --outfile=/tmp/physics-1572-original-mini/audit.mjs
          node /tmp/physics-1572-original-mini/audit.mjs | tee /tmp/physics-1572-original-mini/results.jsonl
      - name: Preserve raw per-case results
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: physics-1572-original-mini-results
          path: /tmp/physics-1572-original-mini/results.jsonl
          if-no-files-found: ignore

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booking</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1a1b25;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #4f46e5;
    --accent-fg: #ffffff;
    --field-bg: #f9fafb;
    --danger: #dc2626;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171f;
      --fg: #f3f4f6;
      --muted: #9ca3af;
      --line: #2b2d3a;
      --accent: #6366f1;
      --field-bg: #1f2130;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--fg);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 20px 18px 28px; }
  .card {
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--bg);
  }
  .head {
    padding: 18px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .head .icon {
    width: 40px; height: 40px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-fg);
    display: grid; place-items: center;
    font-size: 20px;
    flex: 0 0 auto;
  }
  .head h1 { font-size: 17px; margin: 0; }
  .head p { font-size: 13px; color: var(--muted); margin: 2px 0 0; }
  form { padding: 20px; }
  .field { margin-bottom: 16px; }
  .field.row { display: flex; gap: 12px; }
  .field.row > .col { flex: 1; margin: 0; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  label .req { color: var(--danger); margin-left: 2px; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    font-size: 14px;
    color: var(--fg);
    background: var(--field-bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  textarea { resize: vertical; min-height: 68px; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent);
  }
  .steppers { display: flex; align-items: stretch; gap: 8px; }
  .steppers button {
    width: 42px;
    border: 1px solid var(--line);
    background: var(--field-bg);
    color: var(--fg);
    border-radius: 9px;
    font-size: 18px;
    cursor: pointer;
    user-select: none;
  }
  .steppers button:hover { border-color: var(--accent); }
  .steppers input { text-align: center; }
  .err {
    display: none;
    color: var(--danger);
    font-size: 12px;
    margin-top: 5px;
  }
  .field.invalid input,
  .field.invalid select { border-color: var(--danger); }
  .field.invalid .err { display: block; }
  .summary {
    margin: 4px 0 18px;
    padding: 12px 14px;
    background: var(--field-bg);
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 13px;
  }
  .summary .line { display: flex; justify-content: space-between; padding: 3px 0; }
  .summary .muted { color: var(--muted); }
  .summary .total { font-weight: 700; border-top: 1px dashed var(--line); margin-top: 6px; padding-top: 8px; }
  .submit {
    width: 100%;
    border: none;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    font-weight: 600;
    font-size: 15px;
    padding: 13px;
    border-radius: 10px;
    cursor: pointer;
  }
  .submit:hover { filter: brightness(1.06); }
  .submit:disabled { opacity: .6; cursor: default; }
  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .done {
    text-align: center;
    padding: 42px 24px;
  }
  .done .check {
    width: 56px; height: 56px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background: color-mix(in srgb, var(--accent) 16%, transparent);
    color: var(--accent);
    display: grid; place-items: center;
    font-size: 28px;
  }
  .done h2 { margin: 0 0 6px; font-size: 18px; }
  .done p { margin: 0; color: var(--muted); font-size: 14px; }
  .done .ref {
    display: inline-block;
    margin-top: 14px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    background: var(--field-bg);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="head">
      <div class="icon" aria-hidden="true">📅</div>
      <div>
        <h1>Reserve a Table</h1>
        <p id="venue">Aurora Bistro — Downtown</p>
      </div>
    </div>

    <form id="booking" novalidate>
      <div class="field">
        <label for="name">Full name<span class="req">*</span></label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Jane Doe" required>
        <div class="err">Please enter your name.</div>
      </div>

      <div class="field">
        <label for="email">Email<span class="req">*</span></label>
        <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
        <div class="err">Enter a valid email address.</div>
      </div>

      <div class="field row">
        <div class="col field">
          <label for="date">Date<span class="req">*</span></label>
          <input id="date" name="date" type="date" required>
          <div class="err">Choose a date.</div>
        </div>
        <div class="col field">
          <label for="time">Time<span class="req">*</span></label>
          <select id="time" name="time" required>
            <option value="">Select…</option>
            <option>17:30</option><option>18:00</option><option>18:30</option>
            <option>19:00</option><option>19:30</option><option>20:00</option>
            <option>20:30</option><option>21:00</option>
          </select>
          <div class="err">Choose a time.</div>
        </div>
      </div>

      <div class="field">
        <label for="party">Party size<span class="req">*</span></label>
        <div class="steppers">
          <button type="button" id="minus" aria-label="Decrease guests">−</button>
          <input id="party" name="party" type="number" min="1" max="12" value="2" inputmode="numeric" required>
          <button type="button" id="plus" aria-label="Increase guests">+</button>
        </div>
      </div>

      <div class="field">
        <label for="notes">Special requests</label>
        <textarea id="notes" name="notes" placeholder="Allergies, seating preferences, occasion…"></textarea>
      </div>

      <div class="summary" id="summary">
        <div class="line"><span class="muted">Reservation</span><span id="s-when">—</span></div>
        <div class="line"><span class="muted">Guests</span><span id="s-guests">2</span></div>
        <div class="line total"><span>Deposit</span><span id="s-total">$20.00</span></div>
      </div>

      <button class="submit" type="submit" id="submit">Confirm booking</button>
      <div class="note">A refundable deposit of $10 per guest holds your table.</div>
    </form>

    <div class="done hidden" id="done">
      <div class="check" aria-hidden="true">✓</div>
      <h2>Booking confirmed</h2>
      <p id="done-detail">We've sent the details to your email.</p>
      <div class="ref" id="done-ref"></div>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var form = document.getElementById("booking");
  var partyInput = document.getElementById("party");
  var DEPOSIT_PER_GUEST = 10;

  // --- MCP host bridge (best-effort; no-op if unavailable) ------------------
  function notifyHost(type, data) {
    try {
      window.parent.postMessage({ source: "mcp-app", type: type, data: data }, "*");
    } catch (e) { /* sandboxed / no parent */ }
  }

  // --- Party stepper --------------------------------------------------------
  function clampParty() {
    var v = parseInt(partyInput.value, 10);
    if (isNaN(v)) v = 1;
    v = Math.max(1, Math.min(12, v));
    partyInput.value = v;
    return v;
  }
  document.getElementById("minus").addEventListener("click", function () {
    partyInput.value = clampParty() - 1; clampParty(); updateSummary();
  });
  document.getElementById("plus").addEventListener("click", function () {
    partyInput.value = clampParty() + 1; clampParty(); updateSummary();
  });
  partyInput.addEventListener("input", updateSummary);

  // --- Summary --------------------------------------------------------------
  function fmtMoney(n) { return "$" + n.toFixed(2); }

  function updateSummary() {
    var guests = clampParty();
    var date = document.getElementById("date").value;
    var time = document.getElementById("time").value;
    document.getElementById("s-guests").textContent = guests;
    document.getElementById("s-total").textContent = fmtMoney(guests * DEPOSIT_PER_GUEST);

    var when = "—";
    if (date && time) {
      var d = new Date(date + "T00:00:00");
      when = d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " · " + time;
    }
    document.getElementById("s-when").textContent = when;
  }
  document.getElementById("date").addEventListener("change", updateSummary);
  document.getElementById("time").addEventListener("change", updateSummary);

  // Default date = tomorrow, min = today
  (function initDate() {
    var el = document.getElementById("date");
    var t = new Date();
    var min = t.toISOString().slice(0, 10);
    el.min = min;
    var tomorrow = new Date(t.getTime() + 86400000);
    el.value = tomorrow.toISOString().slice(0, 10);
  })();

  // --- Validation -----------------------------------------------------------
  function fieldOf(input) { return input.closest(".field"); }

  function validate(input) {
    var ok = true;
    if (input.type === "email") {
      ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim());
    } else if (input.hasAttribute("required")) {
      ok = input.value.trim() !== "";
    }
    fieldOf(input).classList.toggle("invalid", !ok);
    return ok;
  }

  ["name", "email", "date", "time"].forEach(function (id) {
    var el = document.getElementById(id);
    el.addEventListener("blur", function () { validate(el); });
    el.addEventListener("input", function () {
      if (fieldOf(el).classList.contains("invalid")) validate(el);
    });
  });

  // --- Submit ---------------------------------------------------------------
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var required = ["name", "email", "date", "time"].map(function (id) {
      return document.getElementById(id);
    });
    var allOk = required.map(validate).every(Boolean);
    if (!allOk) {
      var firstBad = form.querySelector(".field.invalid input, .field.invalid select");
      if (firstBad) firstBad.focus();
      return;
    }

    var guests = clampParty();
    var payload = {
      name: document.getElementById("name").value.trim(),
      email: document.getElementById("email").value.trim(),
      date: document.getElementById("date").value,
      time: document.getElementById("time").value,
      party: guests,
      notes: document.getElementById("notes").value.trim(),
      deposit: guests * DEPOSIT_PER_GUEST,
      venue: document.getElementById("venue").textContent
    };

    var btn = document.getElementById("submit");
    btn.disabled = true;
    btn.textContent = "Confirming…";

    notifyHost("tool.submit", payload);

    // Optimistic local confirmation for standalone rendering.
    var ref = "BK-" + Math.random().toString(36).slice(2, 8).toUpperCase();
    setTimeout(function () {
      form.classList.add("hidden");
      var done = document.getElementById("done");
      done.classList.remove("hidden");
      document.getElementById("done-detail").textContent =
        payload.party + " guest" + (payload.party > 1 ? "s" : "") +
        " · " + document.getElementById("s-when").textContent;
      document.getElementById("done-ref").textContent = "Ref " + ref;
      notifyHost("tool.result", Object.assign({ reference: ref }, payload));
    }, 500);
  });

  updateSummary();
  notifyHost("app.ready", {});
})();
</script>
</body>
</html>

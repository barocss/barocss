name: One-time release OIDC preflight

# The reviewed setup commit adds this file to main. This workflow only checks
# GitHub App access and OIDC issuance; it never calls npm publish.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/npm-oidc-preflight.yml

permissions:
  contents: read

jobs:
  app_permissions:
    name: App permissions
    if: github.repository == 'barocss/barocss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require configured App credentials
        env:
          APP_CLIENT_ID: ${{ vars.BARO_PROMOTION_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.BARO_PROMOTION_APP_PRIVATE_KEY }}
        run: test -n "$APP_CLIENT_ID" && test -n "$APP_PRIVATE_KEY"
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.BARO_PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.BARO_PROMOTION_APP_PRIVATE_KEY }}
          permission-administration: read
          permission-contents: write
          permission-pull-requests: write
      - name: Read repository and main protection with the scoped token
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          test "$(gh api repos/barocss/barocss --jq .full_name)" = barocss/barocss
          gh api repos/barocss/barocss/branches/main/protection --jq '.required_status_checks.contexts' > /dev/null

  oidc:
    name: npm OIDC prerequisites
    if: github.repository == 'barocss/barocss' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
      - name: Require supported npm CLI
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = 11.5.1
      - name: Verify GitHub OIDC claims without printing the token
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('npm:registry.npmjs.org');
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            if (claims.iss !== 'https://token.actions.githubusercontent.com' ||
                claims.aud !== 'npm:registry.npmjs.org' ||
                claims.repository !== 'barocss/barocss' ||
                claims.ref !== 'refs/heads/main' ||
                claims.environment !== 'npm' ||
                claims.runner_environment !== 'github-hosted') {
              throw new Error('Unexpected OIDC issuer, audience, repository, ref, environment, or runner');
            }
            core.info('GitHub OIDC claims verified. npm Trusted Publisher settings require separate validation.');

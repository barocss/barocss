question: >
  PARITY LANE — the measurement + ranking that the next parity batch must START with, per two directives:
  (1) "That batch starts by ranking families on v0/shadcn-style output (Q6)"; (2) treat PR #84 candidates as
  candidate parity gaps that must be "measured against Tailwind 4.1.13 with the E-007/E-008 classifier BEFORE
  contracting a fix, and ranked by how often v0/shadcn-style output uses it". This contract writes NO fix and NO
  product code — it produces the measured, ranked parity backlog the FIX batch (a later product_code contract) will
  draw from. Measure each candidate family against Tailwind 4.1.13 on current develop with E-007's frozen classifier,
  and rank by frequency in v0/shadcn-style output:
    - F2 single-axis translate: confirm the diagnosed value-formula gap (BaroCSS emits calc(N*100%) where Tailwind
      4.1.13 emits calc(var(--spacing)*N)) and the unregistered other-axis --baro-translate-* default (K12 caveat,
      D19). State the minimum fix shape (value formula + register defaults) WITHOUT implementing it.
    - PR #84 candidates, each measured, none assumed (human directive flags them "unverified"): @container and
      @container/<name> (shadcn uses them); bg-(--x) resolving to background-size instead of a color; max-md: with the
      default raw breakpoint possibly emitting an invalid @media; outline width. For each: does BaroCSS on current
      develop match Tailwind 4.1.13 token-by-token? If not, is it a missing composition-default, a wrong value
      formula, a missing variant, or "other"? Do NOT copy #84's own defects (bare blur -> blur(0px),
      bg-(position:--x) -> background-color); if a candidate is actually FINE on develop, record that (it drops off
      the backlog).
  Then RANK all confirmed misses by how often v0/shadcn-style output uses the family, using E-007's three generated
  sections + a small shadcn-style sample as the frequency corpus (do not make ranking its own research project).
decision_it_informs: >
  Produces the ranked, measured parity backlog that the next parity FIX batch (a later product_code contract, gated
  by the human-approval + tests-in-scope + draft-when-red directives) will batch from, top-ranked first. A candidate
  that turns out to already match Tailwind 4.1.13 on develop drops off (no fix). A candidate whose fix is a
  value-formula or variant change, not a missing composition-default, is flagged so the fix contract scopes it
  correctly (the mistake E-010 made with F2). Ranking by v0/shadcn frequency tells the fix batch which families are
  table stakes for what the platforms actually emit vs rarely used. This does not itself change any code or merge
  anything.
hypothesis: >

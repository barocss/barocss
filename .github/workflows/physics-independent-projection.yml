name: Physics independent SAT projection
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/independent-projection.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-independent-projection.mjs'
      - '.github/workflows/physics-independent-projection.yml'
  workflow_dispatch:
jobs:
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/p1572-projection
      - name: Run independent SAT axis interval checks
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-independent-projection.mjs | tee /tmp/p1572-projection/results.jsonl
      - if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-projection-results
          path: /tmp/p1572-projection/results.jsonl
          if-no-files-found: ignore

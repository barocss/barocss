  evidence script in .ai/evidence/E-013/ that takes a json-render/A2UI-style spec (a tree of {tag/type, props incl.
  className, children}) and creates the corresponding DOM under that runtime. Keep it minimal — a spec-to-DOM walk,
  no framework, no engine. Spec sample: 6-10 className-carrying specs representative of what AI UI platforms emit —
  reuse E-007's three generated sections re-expressed as json-render specs PLUS a small shadcn-style sample (card,
  dialog, button variants, form field), so the className vocabulary matches Q6's "v0/shadcn-style output". Classifier
  and grader: E-007's frozen classify.mjs (copied, re-pointed on path only; logic unchanged) for per-token
  RESOLVED/PARITY-MISS/AGENT and family attribution. NO agent is required — this is deterministic rendering +

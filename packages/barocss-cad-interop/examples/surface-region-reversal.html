<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>BaroCAD Surface region and axis reversal in Three</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; border: 1px solid #44617d; }
  pre { white-space: pre-wrap; font-size: 13px; }
  button { margin: 8px 8px 8px 0; padding: 7px 12px; }
</style>
<main>
  <h1>Original Surface region and reversed parameter axis</h1>
  <p>Two generated source0 files load through our native Three adapter.</p>
  <div id="view"></div>
  <button id="reject">Try invalid source</button><button id="dispose">Dispose loaded displays</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Group, PerspectiveCamera, Scene, WebGLRenderer } from 'three';
  import { evaluateSurface, surfaceDomain } from '@barocss/cad';
  import { BaroCADLoader } from '../dist/three.js';

  const status = document.querySelector('#status');
  const renderer = new WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(800, 480);
  renderer.setClearColor(0x142236);
  document.querySelector('#view').append(renderer.domElement);
  const scene = new Scene();
  const callerChild = new Group();
  scene.add(callerChild);
  const camera = new PerspectiveCamera(45, 800 / 480, 0.01, 10);
  camera.position.set(0.07, 0.16, 0.15);
  camera.lookAt(0.07, 0, 0.02);
  const loader = new BaroCADLoader({ sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001 });
  const urls = ['surface-region.barocad', 'surface-reversed.barocad']
    .map(name => new URL(`./${name}`, location.href).href);
  const results = [];
  const pixels = () => {
    const data = new Uint8Array(800 * 480 * 4);
    renderer.getContext().readPixels(0, 0, 800, 480, renderer.getContext().RGBA,
      renderer.getContext().UNSIGNED_BYTE, data);
    return data;
  };
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  try {
    for (const url of urls) results.push(await loader.loadAbortable(url, {}));
    results[0].group.position.x = -0.03;
    results[1].group.position.x = 0.07;
    for (const result of results) scene.add(result.group);
    renderer.render(scene, camera);
    const firstPixels = pixels();
    let nonBackgroundPixels = 0;
    for (let i = 0; i < firstPixels.length; i += 4) {
      if (Math.abs(firstPixels[i] - 20) > 10 || Math.abs(firstPixels[i + 1] - 34) > 10 ||
          Math.abs(firstPixels[i + 2] - 54) > 10) nonBackgroundPixels++;
    }
    const region = results[0].model.objects[0];
    const reversed = results[1].model.objects[0];
    const regionPoint = evaluateSurface(region, 3, 14);
    const reversedMappedPoint = evaluateSurface(reversed, 4, 14);
    const parameterMappedDistanceMM = Math.hypot(...regionPoint.map((value, axis) => value - reversedMappedPoint[axis]));
    const scaleErrors = results.flatMap(result => result.surfaces.flatMap(surface =>
      Array.from(surface.mesh.positions, (value, index) =>
        Math.abs(value - surface.packet.positions[index] * 0.001))));
    const evidence = {
      nativeIds: results.map(result => result.model.objects[0].id),
      originalSourceExact: await Promise.all(results.map(async (result, index) =>
        result.source === await (await fetch(urls[index])).text())),
      domains: [surfaceDomain(region), surfaceDomain(reversed)],
      parameterMappedDistanceMM,
      maximumScaleError: Math.max(...scaleErrors),
      displayTranslationsSceneUnits: results.map(result => result.group.position.x),
      webgl2: renderer.getContext() instanceof WebGL2RenderingContext,
      nonBackgroundPixels,
      callerChildRetained: scene.children.includes(callerChild),
    };
    window.__baroCadRegionReversalEvidence = evidence;
    status.textContent = JSON.stringify(evidence, null, 2);
    document.querySelector('#reject').onclick = () => {
      try { loader.parse('@model invalid {}'); }
      catch {
        renderer.render(scene, camera);
        evidence.invalidRejected = true;
        evidence.priorGroupsRetained = results.every(result => scene.children.includes(result.group));
        evidence.priorPixelsRetained = hash(pixels()) === hash(firstPixels);
        status.textContent = JSON.stringify(evidence, null, 2);
      }
    };
    document.querySelector('#dispose').onclick = () => {
      for (const result of results) { result.dispose(); result.dispose(); }
      renderer.render(scene, camera);
      evidence.disposed = results.every(result => !scene.children.includes(result.group));
      evidence.callerChildRetained = scene.children.includes(callerChild);
      status.textContent = JSON.stringify(evidence, null, 2);
    };
  } catch (error) {
    for (const result of results) result.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroCadRegionReversalError = String(error);
  }
</script>
</html>

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>BaroCAD model set in own GPU</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; width: 800px; height: 480px; border: 1px solid #44617d; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Two native files · one own GPU scene</h1>
  <p>Each source retains its original Surface IDs. Display IDs are qualified copies.</p>
  <canvas id="view" width="800" height="480"></canvas>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { mountMeshScene } from '@barocss/gpu';
  import { loadBaroCadModelSet, prepareBaroCadModelSetDisplay } from '../dist/model-set.js';

  const canvas = document.querySelector('#view');
  const status = document.querySelector('#status');
  const nativeOptions = { sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001 };
  const manifest = { format: 'barocad-model-set', version: 0, entries: [
    { aliasId: 'left', url: 'two-surfaces.barocad', options: nativeOptions },
    { aliasId: 'right', url: 'model-set-peer.barocad', options: nativeOptions },
  ] };
  let scene;
  try {
    const set = await loadBaroCadModelSet(manifest, { baseURL: new URL('./', location.href).href });
    const display = prepareBaroCadModelSetDisplay(set);
    const colors = [[0.25, 0.72, 0.93], [0.28, 0.88, 0.55],
      [0.95, 0.55, 0.25], [0.77, 0.5, 0.92]];
    const gpuEntries = display.map((entry, index) => ({
      packet: entry.packet, color: colors[index],
      transform: { translationMm: [entry.binding.aliasId === 'right' ? 140 : 0, 0, 0],
        rotationXYZW: [0, 0, 0, 1], scale: [1, 1, 1] },
    }));
    scene = mountMeshScene(canvas, gpuEntries, {
      mmToSceneUnit: 0.001, translate: [0, 0, 0], background: [0.06, 0.1, 0.16],
      camera: { eye: [0.12, 0.24, 0.37], target: [0.12, 0.035, 0.02],
        up: [0, 1, 0], fovYDegrees: 45, near: 0.01, far: 10 },
    });
    const pixels = scene.readPixels();
    let nonBackgroundPixels = 0;
    for (let i = 0; i < pixels.length; i += 4) {
      if (Math.abs(pixels[i] - 15) > 10 || Math.abs(pixels[i + 1] - 26) > 10 ||
          Math.abs(pixels[i + 2] - 41) > 10) nonBackgroundPixels++;
    }
    const pixelHash = bytes => bytes.reduce((hash, value) => Math.imul(hash ^ value, 16777619) >>> 0, 2166136261);
    const acceptedHash = pixelHash(pixels);
    let invalidRejected = false;
    try {
      prepareBaroCadModelSetDisplay({ ...set, entries: [...set.entries, set.entries[0]] });
    } catch (error) { invalidRejected = error instanceof RangeError; }
    let overCapacityRejected = false;
    try {
      prepareBaroCadModelSetDisplay({ ...set, entries: [...set.entries,
        { ...set.entries[0], aliasId: 'extra' }] });
    } catch (error) { overCapacityRejected = error instanceof RangeError; }
    const evidence = {
      aliases: set.entries.map(entry => entry.aliasId),
      originalIds: set.entries.map(entry => entry.result.model.objects.map(object => object.id)),
      originalPacketIds: set.entries.map(entry => entry.result.surfaces.map(surface => surface.packet.surfaceId)),
      signedZero: set.entries.map(entry => Object.is(entry.result.model.objects[0].controlPoints[0][0][0], -0)),
      bindings: display.map(entry => entry.binding),
      displayIds: scene.entries.map(entry => entry.packet.surfaceId),
      displayBounds: scene.bounds,
      nonBackgroundPixels,
      invalidRejected,
      overCapacityRejected,
      priorSceneRetained: scene.entries.length === 4,
      priorPixelsRetained: pixelHash(scene.readPixels()) === acceptedHash,
      totalLoadedBytes: set.totalLoadedBytes,
    };
    window.__baroCadModelSetGpuEvidence = evidence;
    status.textContent = JSON.stringify(evidence, null, 2);
  } catch (error) {
    scene?.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroCadModelSetGpuError = String(error);
  }
</script>
</html>

<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Canvas2D image anchor v6</title>
<style>
  body { margin: 24px; font: 15px system-ui; color: #17233c; background: #f5f7fb; }
  section { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 16px 0; }
  button, input { font: inherit; }
  button { padding: 8px 12px; border: 1px solid #aab9d0; border-radius: 6px; background: white; }
  canvas { display: block; width: 240px; height: 200px; background: white; border: 1px solid #c8d2e3; }
  #status { min-height: 20px; }
</style>
<h1>Canvas2D image anchor v6</h1>
<p>One rotated RGBA image. Center, zero, and legacy placements use the same asset.</p>
<section>
  <button id="center" type="button">Centered v6</button>
  <button id="zero" type="button">Zero anchor v6</button>
  <button id="legacy" type="button">Legacy v5</button>
  <button id="invalid" type="button">Invalid anchor</button>
  <button id="old-anchor" type="button">Anchor in v5</button>
  <button id="save" type="button">Save document</button>
  <label>Open document <input id="open" type="file" accept="application/json,.json"></label>
  <button id="dispose" type="button">Dispose</button>
</section>
<p id="status" role="status">Loading</p>
<canvas id="live" aria-label="Image anchor result"></canvas>
<script type="module">
  import { createCanvas2D } from '../../packages/barocss-canvas2d/dist/index.js';
  import { serializeCanvasDocument, stageCanvasDocument } from '../../packages/barocss-canvas2d/dist/document.js';
  import { anchorAsset, anchorOptions, anchorScene } from './anchor-scene.mjs';

  let liveCanvas = document.querySelector('#live');
  let liveRenderer = createCanvas2D(liveCanvas, anchorOptions);
  let liveScene = anchorScene();
  let generation = 1;
  const status = document.querySelector('#status');
  liveRenderer.setImageAsset('Anchor2', anchorAsset);
  liveRenderer.updateScene(liveScene);
  liveRenderer.render();
  status.textContent = 'Ready · centered v6';

  function change(scene, label) {
    try {
      liveRenderer.updateScene(scene);
      liveRenderer.render();
      liveScene = scene;
      status.textContent = label;
    } catch (error) { status.textContent = `${error.code || 'ERROR'}: ${error.message}`; }
  }
  document.querySelector('#center').addEventListener('click', () => change(anchorScene(), 'Centered v6'));
  document.querySelector('#zero').addEventListener('click', () => change(anchorScene(6, 0, 0), 'Zero anchor v6'));
  document.querySelector('#legacy').addEventListener('click', () => change(anchorScene(5), 'Legacy v5'));
  document.querySelector('#invalid').addEventListener('click', () => change(anchorScene(6, -0.1, 0.5), 'Invalid accepted'));
  document.querySelector('#old-anchor').addEventListener('click', () => {
    const old = anchorScene(5);
    old.nodes[0].children[0].anchorX = 0;
    change(old, 'Old anchor accepted');
  });
  document.querySelector('#save').addEventListener('click', async () => {
    try {
      const text = await serializeCanvasDocument(liveScene, id => liveRenderer.getImageAsset(id));
      const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
      const link = document.createElement('a'); link.href = url; link.download = 'anchor-v6-document.json';
      link.click(); setTimeout(() => URL.revokeObjectURL(url), 0);
      status.textContent = `Saved ${new TextEncoder().encode(text).length} bytes`;
    } catch (error) { status.textContent = `${error.code || 'ERROR'}: ${error.message}`; }
  });
  document.querySelector('#open').addEventListener('change', async event => {
    const file = event.target.files?.[0];
    if (!file) return;
    try {
      const freshCanvas = document.createElement('canvas');
      freshCanvas.id = 'live'; freshCanvas.setAttribute('aria-label', 'Image anchor result');
      const staged = await stageCanvasDocument(await file.text(), freshCanvas, anchorOptions);
      const previousRenderer = liveRenderer;
      liveCanvas.replaceWith(freshCanvas);
      liveCanvas = freshCanvas; liveRenderer = staged.renderer; liveScene = staged.scene;
      generation += 1;
      previousRenderer.dispose();
      status.textContent = `Opened v${liveScene.version} · ${staged.assets.size} assets`;
    } catch (error) { status.textContent = `${error.code || 'ERROR'}: ${error.message}`; }
    event.target.value = '';
  });
  document.querySelector('#dispose').addEventListener('click', () => {
    try { liveRenderer.dispose(); status.textContent = 'Disposed'; }
    catch (error) { status.textContent = `${error.code || 'ERROR'}: ${error.message}`; }
  });

  window.__anchor = {
    get scene() { return structuredClone(liveScene); },
    get canvas() { return liveCanvas; },
    get renderer() { return liveRenderer; },
    observe() {
      const gl = liveCanvas.getContext('webgl2');
      const positions = [[110, 50], [90, 50], [110, 110], [90, 110],
        [90, 90], [70, 90], [90, 150], [70, 150]];
      const points = positions.map(([x, y]) => {
        const rgba = new Uint8Array(4);
        gl.readPixels(x * 2, liveCanvas.height - y * 2 - 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
        return { x, y, rgba: [...rgba], hit: liveRenderer.hitTest({ x, y })?.id ?? null };
      });
      return { status: status.textContent, version: liveScene.version, generation,
        anchor: liveScene.nodes[0].children[0].anchorX === undefined ? null :
          [liveScene.nodes[0].children[0].anchorX, liveScene.nodes[0].children[0].anchorY],
        canvas: [liveCanvas.width, liveCanvas.height], points };
    },
  };
</script>
</html>

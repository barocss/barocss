name: Physics private cache audit
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/private-cache-entry.ts'
      - 'examples/physics-contact-impulse-audit-1572/instrument-private-cache.mjs'
      - '.github/workflows/physics-private-cache-1572.yml'
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/physics-cache-1572
      - name: Execute true World cache observation in temporary built copy
        shell: bash
        run: node examples/physics-contact-impulse-audit-1572/instrument-private-cache.mjs | tee /tmp/physics-cache-1572/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics-private-cache-results
          path: /tmp/physics-cache-1572/results.jsonl
          if-no-files-found: ignore

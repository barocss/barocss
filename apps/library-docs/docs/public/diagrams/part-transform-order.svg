<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">A body transform is applied again, not set as an absolute placement</title>
  <desc id="desc">Calculated point coordinates, not an API render or construction validation. In the world XY plane, the input point is [10,0,0] mm. Rotation by positive 90 degrees about Z through the origin gives [0,10,0]. Translation by [30,0,0] gives [30,10,0]. Applying the same rotation and translation to that result gives [20,30,0], not the same final point. All Z coordinates are zero.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52647a"/></marker></defs>
  <rect width="900" height="420" rx="14" fill="#f3f6fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172b46" font-size="16">
    <text x="450" y="34" text-anchor="middle" font-size="23" font-weight="700">moved(location): rotate first, then translate</text>
    <text x="450" y="61" text-anchor="middle">World XY · all Z = 0 · mm · calculated schematic, not an API render</text>
    <g fill="none" stroke="#52647a" stroke-width="2" marker-end="url(#arrow)">
      <path d="M225 165H255"/><path d="M445 165H475"/><path d="M665 165H695"/>
    </g>
    <rect x="25" y="104" width="200" height="124" rx="10" fill="white" stroke="#8da4bd"/>
    <text x="125" y="135" text-anchor="middle" font-weight="700">Input point</text>
    <text x="125" y="171" text-anchor="middle" font-size="20">[10, 0, 0]</text>
    <text x="125" y="205" text-anchor="middle">on the chosen body</text>
    <rect x="255" y="104" width="190" height="124" rx="10" fill="#e4f0ff" stroke="#7c9fc5"/>
    <text x="350" y="135" text-anchor="middle" font-weight="700">+90° about Z</text>
    <text x="350" y="171" text-anchor="middle" font-size="20">[0, 10, 0]</text>
    <text x="350" y="205" text-anchor="middle">pivot: document origin</text>
    <rect x="475" y="104" width="190" height="124" rx="10" fill="#e6f4ed" stroke="#7ca28b"/>
    <text x="570" y="135" text-anchor="middle" font-weight="700">+ [30, 0, 0]</text>
    <text x="570" y="171" text-anchor="middle" font-size="20">[30, 10, 0]</text>
    <text x="570" y="205" text-anchor="middle">one moved call</text>
    <rect x="695" y="104" width="180" height="124" rx="10" fill="#fff3dd" stroke="#b59a66"/>
    <text x="785" y="135" text-anchor="middle" font-weight="700">Repeat both steps</text>
    <text x="785" y="171" text-anchor="middle" font-size="20">[20, 30, 0]</text>
    <text x="785" y="205" text-anchor="middle">on the returned part</text>
    <text x="450" y="281" text-anchor="middle" font-size="18">Same location, different result: the transform acts on current geometry.</text>
    <text x="450" y="321" text-anchor="middle">Choose one body with body(key) when the part contains several bodies.</text>
    <text x="450" y="355" text-anchor="middle">Keep the returned part. The original immutable part remains unchanged.</text>
    <text x="450" y="391" text-anchor="middle">Assembly instance placement is a separate API.</text>
  </g>
</svg>

  path only; grading logic unchanged. This experiment writes NO product code — the reports are evidence scripts over
  the runtime's existing public has()/getCss() (arm 1) and the browser's own computed style (arm 2).
method: >
  1. Branch ai/E-011-resolution-report from origin/develop. Set status: running, commit, push.
  2. Check out the pinned product/app state (develop commit bf979c6) into the build/serve step (e.g. build
     packages/barocss at bf979c6 and run apps/barocss-site's vite dev from that tree). dist output is gitignored /
     left uncommitted. Confirm the site boots styled before any run (the E-007 self-test gate).
  3. Copy E-007's classify.mjs, grader.js, grade.mjs, run.mjs, selftest.mjs and env.mjs into .ai/evidence/E-011/ and
     re-point ONLY their file paths (output dir, task ids). Change no grading, classification, prompt, task, model or
     tool. Run the self-test; it must pass (site styled; gating classifications; grader controls) before any agent run.
  4. Arm 0 (baseline, no report): reuse E-007's recorded G1/G2/G3 runs directly — the pinned commit IS E-007's world
     and E-007's harness is frozen, so its result (8 first-try misses, 7 shipped unnamed under a "done" claim, 1
     self-detected) is arm 0. Do NOT rerun arm 0 unless step 5's report-injection changes the pre-claim flow for the
     other arms in a way that would make arm 0 non-comparable; if so, run one arm-0 control (empty report, same
     extended harness) x G1/G2/G3 and use that as the baseline instead. Record which baseline you used and why.
  5. Build the two report generators as evidence scripts in .ai/evidence/E-011/ (NO packages/ changes):
     - arm1-report: for every class present on the page after the agent's first generation, use the page's existing
       runtime has()/getCss() ONLY to mark each class RESOLVED, UNRESOLVED (has() false / no rule), EMPTY-RULE (rule
       with no declarations), or UNDEFINED-VAR (a declaration references a custom property the page never defines).
       No computed style, no Tailwind reference. This is the BaroCSS-unique signal.
     - arm2-report (control): summarize the browser's computed style for the SAME elements/classes, with NO BaroCSS
       data (no has()/getCss()). Same shape of output (a per-class list) so the only difference between arms 1 and 2
       is the information source.
  6. Extend the copied runner (in .ai/evidence/E-011/ only) so that, for arms 1 and 2, after the actor's FIRST DOM
     generation and BEFORE it verifies/claims done, the arm's report for the just-generated section is injected back
     into the SAME actor context; the actor then continues normally (may self-fix) and produces its final section and
     claim. Arms 1 and 2 differ from each other and from arm 0 ONLY by the injected report; tasks, prompt, actor and
     grader are identical.
  7. Run arms 1 and 2, fresh context per run, over G1/G2/G3 — 6 fresh actor runs. Retry a run at most once, only for
     an environment failure (e.g. ECONNRESET before output), never for an agent mistake.
  8. Grade every run with the frozen grader + classifier exactly as E-007 did. Per run record: first-try tokens
     RESOLVED / PARITY-MISS, which misses were detected before the claim, final-section remaining misses, whether the
     final "done" claim names any miss, and grader agree/disagree. Aggregate per arm: (a) first-try silent misses
     shipped under a "done" claim (the primary metric, comparable to E-007's 7 of 8), and (b) misses self-detected
     before the claim.
  9. Fill result: verdict (see proves_yes/proves_no), level L3, the per-arm metric table, learning, and — required by
     the coverage directive — a note that this setup is FREE-FORM CLASSES WITH RUNTIME DELIVERY (the shared core of
     both target flows) and that the result claims NEITHER target flow end to end (not the code-gen pipeline flow 1,
     not the json-render/catalog spec flow 2). Set status: done (or blocked). Commit ai(exec): E-011 <VERDICT> ...,
     run `python3 .ai/check.py --role execution --base origin/develop --work E-011`, open the PR to develop, put its
     URL in result.pr, push. (No product code, so no pnpm check gate and no draft-until-green step; if the harness
     itself won't run, that is INCONCLUSIVE, not a draft PR.)

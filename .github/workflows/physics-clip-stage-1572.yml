name: Physics clip stage loss audit
on:
  pull_request:
    branches: [develop]
    paths:
      - 'examples/physics-contact-impulse-audit-1572/clip-stage-audit.ts'
      - 'examples/physics-contact-impulse-audit-1572/run-clip-stage-audit.mjs'
      - '.github/workflows/physics-clip-stage-1572.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @barocss/physics build:library
      - run: mkdir -p /tmp/p1572-clip
      - name: Audit clipping and separation stage losses
        shell: bash
        run: |
          set -euo pipefail
          node examples/physics-contact-impulse-audit-1572/run-clip-stage-audit.mjs | tee /tmp/p1572-clip/results.jsonl
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: physics1572-clip-loss-audit
          path: /tmp/p1572-clip/results.jsonl
          if-no-files-found: ignore

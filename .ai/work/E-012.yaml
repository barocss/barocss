depends_on: []
question: >
  QUESTION LANE — durability of option B before building flow-1 on it (STATE.human_directives, the delegated note
  "agreed after E-011"). E-011 (K13, PROVEN) showed a per-class BaroCSS resolution report cut first-try silent
  generation misses to 0, but ALL 5 classes the report flagged were BaroCSS's OWN parity gaps (ring/border/translate/
  theme-var — the very families the parity lane is closing). So the durability worry is: does the report's value come
  from BaroCSS-unique class->rule knowledge that survives the parity fixes, or is it just "BaroCSS knows its own
  current gaps" — value the parity lane erodes as it lands fixes? This is Step 1 of the ordered durability
  measurement, L2 and NO agent runs, over every class token in E-007's and E-011's already-recorded generated
  sections:
  (A) Bucket the classifier's AGENT tokens (the tokens Tailwind 4.1.13 does NOT resolve; classify.mjs category
      "AGENT") into exactly one of: invented-utility, invalid-value, v3-only-name, out-of-theme-token, typo, or
      intentional-non-utility-name. Intentional = matches no Tailwind utility root or variant, OR is a known marker
      (group, peer, group/<name>, peer/<name>, dark); a utility-SHAPED token carrying a bad value stays invalid-value,
      not intentional. List EVERY AGENT token with its bucket and a one-line reason.
  (B) Measure the report's ACCURACY: precision and recall of the E-011 arm-1 has()/getCss() flags
      (UNRESOLVED / EMPTY-RULE / UNDEFINED-VAR, i.e. every report row with status != RESOLVED) against the
      classifier's PARITY-MISS label (Tailwind emits, BaroCSS does not — classify.mjs category "PARITY-MISS"), over
      the same recorded section tokens. Report false positives (flagged but RESOLVED or AGENT) and false negatives
      (PARITY-MISS not flagged) token by token.
decision_it_informs: >
  Reads durability, and gates the flow-1 code-gen experiment (B's report inside a code-gen pipeline) which the human
  ordered to WAIT for this answer. If (A) shows the AGENT tokens are dominated by genuinely invalid ones
  (invented-utility / invalid-value / typo — mistakes the parity lane will NEVER "fix" because they are not BaroCSS
  gaps) AND (B) shows the report flags them with high precision/recall, the report catches real generation mistakes,
  not just BaroCSS's transient gaps, so its value is durable and Strategy proceeds to contract the flow-1 code-gen
  experiment. If instead (A) shows the invalid count is about 0 or ambiguous (nearly all flagged classes are
  parity-family gaps the lane is closing) OR (B) shows the report's flags track PARITY-MISS but miss/ misclassify
  invalid tokens, the report's measured value is mostly "BaroCSS knows its own gaps"; then Step 2 (one fresh
  natural-generation run on a POST-PARITY build plus one weaker actor, U1) is contracted before any flow-1 test, and
  no product code that productizes the report (a packages/barocss API, or PR #103) is contracted until n>=3 per arm,
  a weaker actor, and this L2 report-accuracy check are all in hand.
hypothesis: >
  Plausible but untested: a meaningful share of the AGENT tokens agents emit will be genuinely invalid (invented or
  bad-value utilities, typos, v3-only names) that no parity fix can ever resolve, and the has()/getCss() report will
  flag those too (they are UNRESOLVED / EMPTY-RULE just like the parity gaps), so the report's value is broader than
  the current parity gaps and survives the parity lane. The opposite is also plausible and would be the negative
  result: in E-007/E-011 nearly every flagged class was a real Tailwind utility BaroCSS happened to miss (a parity
  gap), so once the lane lands, the report would flag almost nothing and its measured benefit would shrink.
builds_on: [K4, K5, K10, K12, K13]
scenario: >
  PURELY OFFLINE over committed artifacts — no new agent runs, no generation. Inputs, all already in the repo at the
  pinned E-007/E-011 world (develop bf979c6, before the E-010 parity fixes, so the recorded misses are intact):
    - E-007 recorded runs .ai/evidence/E-007/runs/G{1,2,3}.json and audit .ai/evidence/E-007/audit.json.
    - E-011 recorded runs .ai/evidence/E-011/runs/G{1,2,3}.arm{1,2}.json (each carries first_try, final_section,
      and injected_report[].rows with {cls, status}) and audit .ai/evidence/E-011/audit.json.
    - The FROZEN classifier .ai/evidence/E-007/classify.mjs (RESOLVED | PARITY-MISS | AGENT; AGENT = Tailwind 4.1.13
      does not emit) — copied byte-identical into .ai/evidence/E-012/ and re-pointed on PATH ONLY; classification
      logic unchanged. Its Tailwind 4.1.13 reference (node_modules) and, if a token's classification is not already
      recorded in an audit.json, its in-page BaroCSS has()/getCss() probe (bcProbeInPage) are the only reasons this
      contract MIGHT boot the pinned site.
  "The generated sections" = the union of every class token that appears on the page in the recorded E-007 runs and
  the recorded E-011 arm1+arm2 runs (first-try plus final section). Prefer the classifications and report flags
  already recorded in the committed audit.json / runs; only recompute a missing one by re-running the frozen
  classifier / re-reading a recorded injected_report — never by re-generating.
method: >
  1. Branch ai/E-012-report-durability from origin/develop. Set status: running, commit, push.
  2. Copy .ai/evidence/E-007/classify.mjs (and any helper it imports, e.g. env.mjs) into .ai/evidence/E-012/ and
     re-point file paths ONLY. Change no classification logic, no thresholds, no AGENT/PARITY-MISS/RESOLVED rule.
  3. Extract the token universe: from E-007 runs/audit and E-011 arm1+arm2 runs/audit, collect every distinct class
     token that appears on the generated section (first-try and final). Attach to each token its classifier label
     (RESOLVED / PARITY-MISS / AGENT). Reuse the recorded label from audit.json where present; recompute with the
     copied frozen classifier only for tokens with no recorded label — booting the pinned site (127.0.0.1:5200,
     E-006/E-007 env) ONLY if the BaroCSS probe is actually needed for an unlabeled token. Record which labels were
     reused vs recomputed.
  4. Bucketing (A): for every AGENT token, assign exactly one bucket by these deterministic rules, in order —
     (i) known marker (group|peer|group/*|peer/*|dark) -> intentional-non-utility-name;
     (ii) does not match any Tailwind utility root or variant at all -> intentional-non-utility-name;
     (iii) matches a v3 utility name removed/renamed in v4 -> v3-only-name;
     (iv) utility-shaped, right root, but the value/scale is not a valid v4 value -> invalid-value;
     (v) utility-shaped, plausibly intended a real utility but with a small edit distance to one (<=2) -> typo;
     (vi) references a theme token/namespace that is not in the default v4 theme -> out-of-theme-token;
     (vii) a utility root that simply does not exist in v4 -> invented-utility.
     Where two rules could apply, apply the earliest that matches and record the alternative in the reason. Emit a
     table: token, bucket, one-line reason. Report per-bucket counts and the total "genuinely invalid" count
     (invented-utility + invalid-value + typo + v3-only-name; intentional and out-of-theme called out separately).
  5. Report accuracy (B): let FLAGGED = the set of tokens the E-011 arm1 report marked status != RESOLVED
     (UNRESOLVED / EMPTY-RULE / UNDEFINED-VAR), read from injected_report[].rows in the arm1 runs. Let MISS = the set
     of tokens the frozen classifier labels PARITY-MISS. Compute precision = |FLAGGED ∩ MISS| / |FLAGGED| and
     recall = |FLAGGED ∩ MISS| / |MISS| over the recorded section tokens. List every false positive (FLAGGED but not
     PARITY-MISS — say whether it was RESOLVED or AGENT, since flagging an AGENT/invalid token is a DIFFERENT, useful
     signal, not a pure error) and every false negative (PARITY-MISS not FLAGGED). Also report, as a distinct number,
     how many AGENT (genuinely-invalid) tokens the report flagged — the durability signal.
  6. Fill result: verdict is a description of the measured buckets + precision/recall (this is a measurement, so the
     verdict is PROVEN when both (A) and (B) are computed over the full token universe with the frozen classifier,
     INCONCLUSIVE if a needed artifact is missing/unreadable or the pinned probe cannot run). Record level L2, the two
     tables, the durability read (which of decision_it_informs's branches holds), and the coverage note (this is the
     E-007/E-011 free-form-classes-with-runtime-delivery world, not a code-gen or json-render flow end to end). Set
     status: done (or blocked). Commit ai(exec): E-012 <VERDICT> ..., run
     `python3 .ai/check.py --role execution --base origin/develop --work E-012`, open the PR to develop, put its URL
     in result.pr, push. No product code, so no pnpm check gate and no draft step; if a needed artifact won't load,
     that is INCONCLUSIVE, not a draft PR. Do NOT merge. STOP.

</head><body><h1>Application from an initial Scene</h1>

<button id="edit">Edit restored Rect and Sprite</button><button id="missing">Stage missing-asset candidate</button>
<button id="repair">Repair candidate and swap</button><button id="discard">Discard candidate</button>
<button id="save">Save document</button><label>Open document <input id="open" type="file" accept=".json,application/json"></label>
<button id="png">Export PNG</button><button id="lose">Lose context</button><button id="restore">Restore context</button><button id="dispose">Dispose</button>

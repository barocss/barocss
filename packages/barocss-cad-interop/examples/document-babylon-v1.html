<!doctype html>
<html lang="en">
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Selected CAD document bodies in Babylon.js</title>
<style>
  body { margin: 0; background: #101b2c; color: #eaf4ff; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 900px; margin: 20px auto; }
  canvas { display: block; width: 800px; height: 480px; border: 1px solid #44617d; }
  button { margin: 12px 8px 0 0; padding: 7px 12px; }
  pre { white-space: pre-wrap; font-size: 13px; }
</style>
<main>
  <h1>Selected CAD document bodies · Babylon.js</h1>
  <p>Two source assets retain their native Curve and Surface IDs. Four of six bodies are displayed.</p>
  <canvas id="view" width="800" height="480"></canvas>
  <button id="reject" type="button">Try invalid candidate</button>
  <button id="dispose" type="button">Dispose owned display</button>
  <pre id="status">Loading…</pre>
</main>
<script type="module">
  import { Engine } from '@babylonjs/core/Engines/engine.js';
  import { Scene } from '@babylonjs/core/scene.js';
  import { Camera } from '@babylonjs/core/Cameras/camera.js';
  import { FreeCamera } from '@babylonjs/core/Cameras/freeCamera.js';
  import { Mesh } from '@babylonjs/core/Meshes/mesh.js';
  import { LinesMesh } from '@babylonjs/core/Meshes/linesMesh.js';
  import { Color3, Color4 } from '@babylonjs/core/Maths/math.color.js';
  import { Vector3 } from '@babylonjs/core/Maths/math.vector.js';
  import { loadBaroCadDocument, prepareBaroCadDocumentPrimitiveNativeRefsV2 } from '../dist/document.js';
  import { createBaroCadDocumentBabylonDisplay } from '../dist/babylon-document.js';

  const canvas = document.querySelector('#view');
  const status = document.querySelector('#status');
  const native = { sourceVersion: 0, countU: 8, countV: 8, unitsPerMillimeter: 0.001,
    curveDisplay: { version: 1, chordToleranceMM: 0.02, maxSegments: 512, maxDepth: 16 } };
  const request = { native, basis: 'authored-xyz-matches-rhyup',
    bodyIds: ['body_1_surface', 'body_0_curve', 'body_1_curve', 'body_0_surface'] };
  const engine = new Engine(canvas, false, { preserveDrawingBuffer: true, stencil: true });
  const scene = new Scene(engine);
  scene.useRightHandedSystem = true;
  scene.clearColor = new Color4(16 / 255, 27 / 255, 44 / 255, 1);
  const callerMesh = new Mesh('caller-owned', scene);
  const camera = new FreeCamera('camera', new Vector3(0.001, -0.001, 0.2), scene);
  camera.setTarget(new Vector3(0.001, -0.001, 0));
  camera.mode = Camera.ORTHOGRAPHIC_CAMERA;
  camera.orthoLeft = -0.018;
  camera.orthoRight = 0.018;
  camera.orthoTop = 0.0108;
  camera.orthoBottom = -0.0108;
  camera.minZ = 0.01;
  camera.maxZ = 1;
  scene.activeCamera = camera;
  const hash = bytes => bytes.reduce((value, byte) => Math.imul(value ^ byte, 16777619) >>> 0, 2166136261);
  const readPixels = () => {
    scene.render();
    const gl = canvas.getContext('webgl2');
    const pixels = new Uint8Array(canvas.width * canvas.height * 4);
    gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
    if (gl.getError() !== gl.NO_ERROR) throw new Error('WebGL readPixels failed');
    return pixels;
  };
  const colors = pixels => {
    let cyan = 0, magenta = 0, left = 0, right = 0;
    for (let index = 0; index < pixels.length; index += 4) {
      const r = pixels[index], g = pixels[index + 1], b = pixels[index + 2];
      if (r < 60 && g > 150 && b > 150) cyan++;
      if (r > 150 && g < 70 && b > 150) magenta++;
      if (Math.abs(r - 16) > 12 || Math.abs(g - 27) > 12 || Math.abs(b - 44) > 12) {
        if ((index / 4) % canvas.width < canvas.width / 2) left++;
        else right++;
      }
    }
    return { cyan, magenta, left, right };
  };
  let cad, display, evidence;
  const show = () => { status.textContent = JSON.stringify(evidence, null, 2); };
  try {
    cad = await loadBaroCadDocument(new URL('document-gpu-v2.cad-document.json', location.href).href);
    const projection = prepareBaroCadDocumentPrimitiveNativeRefsV2(cad, request);
    display = createBaroCadDocumentBabylonDisplay(scene, cad, request);
    if (display.bindings.length !== 4 || display.assetNodes.length !== 2 ||
        display.bindings.filter(binding => binding.mesh instanceof LinesMesh).length !== 2 ||
        scene.meshes.filter(mesh => mesh.name.endsWith(':skip_path_native') && !mesh.isEnabled()).length !== 2) {
      throw new Error('Babylon selected-body display contains wrong meshes');
    }
    display.assetNodes[0].position.x = -0.006;
    display.assetNodes[1].position.x = 0.006;
    for (const binding of display.bindings) {
      const entry = projection.find(value => value.binding.bodyId === binding.bodyId);
      const original = entry.kind === 'curve' ? entry.sample.pointsMM.flat() : entry.packet.positions;
      const expected = Float32Array.from(original, value => Math.fround(value * native.unitsPerMillimeter));
      const actual = binding.mesh.getVerticesData('position');
      if (actual.length !== expected.length || !actual.every((value, index) => value === expected[index])) {
        throw new Error('Babylon position buffer differs from selected native projection');
      }
      if (binding.mesh instanceof LinesMesh) binding.mesh.color = binding.assetId === 'asset-a' ?
        new Color3(0, 1, 1) : new Color3(1, 0, 1);
      else {
        binding.mesh.material.diffuseColor = binding.assetId === 'asset-a' ?
          new Color3(0, 0.8, 0.8) : new Color3(0.8, 0, 0.8);
        binding.mesh.material.emissiveColor = binding.assetId === 'asset-a' ?
          new Color3(0, 0.35, 0.35) : new Color3(0.35, 0, 0.35);
      }
    }
    engine.runRenderLoop(() => scene.render());
    await scene.whenReadyAsync();
    engine.stopRenderLoop();
    const pixels = readPixels();
    const coloredPixels = colors(pixels);
    if (Object.values(coloredPixels).some(value => value < 20)) {
      throw new Error('Selected Curves and Surfaces must be visible on both sides');
    }
    evidence = {
      documentId: cad.document.documentId, revision: cad.document.revision,
      frame: cad.document.nativeFrame, assetRevisions: cad.document.assets.map(asset => asset.revision),
      originalIds: cad.compiledAssets.map(asset => asset.model.objects.map(object => object.id)),
      originalSignedZero: cad.compiledAssets.map(asset => Object.is(asset.model.objects[0].controlPoints[0][1], -0)),
      bodyIds: display.bindings.map(binding => binding.bodyId),
      refs: display.bindings.map(binding => binding.ref),
      nativeNames: display.bindings.map(binding => binding.geometryId),
      sampleVersions: projection.filter(entry => entry.kind === 'curve').map(entry => entry.sampleVersion),
      domains: projection.filter(entry => entry.kind === 'curve').map(entry => entry.sample.domain),
      babylonLines: display.bindings.filter(binding => binding.mesh instanceof LinesMesh).length,
      babylonSurfaces: display.bindings.filter(binding => !(binding.mesh instanceof LinesMesh)).length,
      unselectedDisabled: scene.meshes.filter(mesh => mesh.name.endsWith(':skip_path_native') && !mesh.isEnabled()).length,
      webgl2: canvas.getContext('webgl2') instanceof WebGL2RenderingContext,
      uploadedPositionsMatch: true, oneCanvas: document.querySelectorAll('canvas').length === 1,
      coloredPixels, pixelHash: hash(pixels), callerMeshRetained: !callerMesh.isDisposed(),
    };
    window.__baroCadDocumentBabylonEvidence = evidence;
    show();
  } catch (error) {
    display?.dispose();
    status.textContent = `Failed: ${error?.stack ?? error}`;
    window.__baroCadDocumentBabylonError = String(error);
  }
  document.querySelector('#reject').onclick = () => {
    if (!display) return;
    const before = hash(readPixels());
    const checks = [
      { ...request, bodyIds: ['missing_body'] },
      { ...request, bodyIds: ['body_0_curve', 'body_0_curve'] },
      { ...request, bodyIds: [...request.bodyIds, 'body_0_skip'] },
      { ...request, basis: 'authored-xyz-no-axis-conversion' },
    ].map(candidate => { try { createBaroCadDocumentBabylonDisplay(scene, cad, candidate); return false; }
      catch { return true; } });
    const forged = structuredClone(cad); forged.bodyBindings[0].assetId = 'asset_b';
    let forgedRejected = false;
    try { createBaroCadDocumentBabylonDisplay(scene, forged, request); } catch { forgedRejected = true; }
    Object.assign(evidence, { invalidCandidatesRejected: checks.every(Boolean), forgedRejected,
      priorSceneRetained: display.bindings.every(binding => scene.meshes.includes(binding.mesh)) &&
        scene.meshes.includes(callerMesh), priorPixelsRetained: hash(readPixels()) === before });
    show();
  };
  document.querySelector('#dispose').onclick = () => {
    if (!display) return;
    const owned = scene.meshes.filter(mesh => mesh !== callerMesh);
    display.dispose(); display.dispose();
    Object.assign(evidence, { ownedMeshesDisposed: owned.every(mesh => mesh.isDisposed() && !scene.meshes.includes(mesh)),
      assetNodesDisposed: display.assetNodes.every(node => node.isDisposed()),
      callerMeshRetained: !callerMesh.isDisposed() && scene.meshes.includes(callerMesh),
      callerCanvasRetained: document.body.contains(canvas),
      sceneAndEngineLive: !scene.isDisposed && engine.getRenderingCanvas() === canvas,
      nativeSourcesRetained: cad.document.assets.every(asset => asset.source.includes('#guide_path_native')) });
    show();
  };
</script>
</html>
